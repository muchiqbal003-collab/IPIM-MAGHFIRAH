<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Rekap Absensi Kelas - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green: #00875A; --green-dark: #006644; --green-bg: #E3FCEF; --green-text: #006644;
      --red: #DE350B; --red-bg: #FFEBE6; --red-text: #BF2600;
      --amber: #FF8B00; --amber-bg: #FFF7D0; --amber-text: #7A4100;
      --blue: #0052CC; --blue-bg: #DEEBFF; --blue-text: #0747A6;
      --surface: #FFFFFF; --bg: #F4F5F7; --border: #DFE1E6;
      --text: #172B4D; --text-muted: #6B778C; --text-subtle: #97A0AF;
      --radius: 8px; --radius-lg: 14px;
      --header-h: 56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      padding-top: var(--header-h); padding-bottom: 40px;
      min-height: 100vh; font-size: 14px;
    }

    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: var(--green-dark); height: var(--header-h);
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
    }
    .btn-back {
      width: 36px; height: 36px; flex-shrink: 0;
      background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
      color: white; font-size: 15px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-back:active { background: rgba(255,255,255,0.25); transform: scale(0.94); }
    .header-title { color: white; font-size: 15px; font-weight: 600; flex: 1; }
    .btn-excel {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius);
      color: white; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .btn-excel:disabled { opacity: 0.45; cursor: not-allowed; }

    .page { padding: 14px; max-width: 700px; margin: 0 auto; }

    .card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
    .card-body { padding: 16px; }

    .field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .select-wrap { position: relative; }
    .select-wrap select {
      width: 100%; padding: 10px 34px 10px 12px; border: 1.5px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit;
      color: var(--text); background: var(--surface);
      appearance: none; outline: none; cursor: pointer;
    }
    .select-wrap select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,135,90,0.12); }
    .select-wrap::after {
      content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 10px; pointer-events: none;
    }

    .meta-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .meta-chip { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); }
    .meta-chip i { font-size: 11px; }
    .meta-chip strong { font-weight: 600; color: var(--text); }
    .meta-sep { color: var(--border); font-size: 14px; }

    /* JP EDIT */
    .jp-edit-row {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: #fffde7; border-bottom: 1px solid var(--border);
    }
    .jp-edit-row label { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .jp-input {
      width: 55px; padding: 5px 8px; text-align: center;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: 13px; font-family: inherit; font-weight: 600; background: white;
    }
    .jp-input:focus { border-color: var(--green); outline: none; }
    .btn-save-jp {
      padding: 6px 12px; background: var(--green); color: white;
      border: none; border-radius: var(--radius); font-size: 11px;
      font-weight: 600; font-family: inherit; cursor: pointer;
    }

    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .sum-card { background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 10px 12px; }
    .sum-card .sc-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .sum-card .sc-val { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 2px; }
    .sum-card.danger .sc-val { color: var(--red); }
    .sum-card.success .sc-val { color: var(--green); }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap table { width: 100%; border-collapse: collapse; min-width: 560px; }
    .table-wrap thead tr { background: var(--bg); border-bottom: 2px solid var(--border); }
    .table-wrap th {
      padding: 9px 10px; font-size: 10px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;
      text-align: center; white-space: nowrap;
    }
    .table-wrap th.left { text-align: left; }
    .table-wrap td { padding: 10px 10px; font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); }
    .table-wrap td.left { text-align: left; }
    .table-wrap tbody tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr:hover td { background: #F8F9FA; }

    .td-no { color: var(--text-subtle); font-size: 11px; width: 32px; }
    .nama-cell { display: flex; align-items: center; gap: 8px; }
    .mini-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0;
    }
    .nama-text { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .nim-text { font-size: 10.5px; color: var(--text-subtle); }

    .td-count { font-size: 13px; font-weight: 600; }
    .td-count.zero { color: var(--text-subtle); font-weight: 400; }
    .td-count.sakit { color: #D97706; } .td-count.izin  { color: var(--blue); }
    .td-count.alfa  { color: var(--red); } .td-count.jaga  { color: #7C3AED; }

    .pct-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .pct-badge.good   { background: var(--green-bg); color: var(--green-text); }
    .pct-badge.warn   { background: var(--amber-bg); color: var(--amber-text); }
    .pct-badge.danger { background: var(--red-bg); color: var(--red-text); }
    .pct-badge i { font-size: 9px; }

    .state-box { text-align: center; padding: 48px 20px; color: var(--text-subtle); }
    .state-box i { font-size: 32px; margin-bottom: 10px; display: block; opacity: 0.4; }
    .state-box p { font-size: 13px; }

    @media (max-width: 480px) {
      .summary-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .btn-excel span { display: none; }
    }
  </style>
</head>
<body>

  <header class="header">
    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="header-title">Rekap Absensi</span>
    <button class="btn-excel" id="btnExcel" onclick="exportExcel()" disabled>
      <i class="fa-solid fa-file-excel"></i><span>Download Excel</span>
    </button>
  </header>

  <div class="page">
    <!-- FILTER -->
    <div class="card">
      <div class="card-body">
        <div class="field-label">Matakuliah</div>
        <div class="select-wrap">
          <select id="filterMatkul" onchange="loadRekap()">
            <option value="">Pilih matakuliah...</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TABLE CARD -->
    <div class="card" id="tableCard">
      <div class="state-box">
        <i class="fa-solid fa-table-list"></i>
        <p>Pilih matakuliah untuk melihat rekap</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['dosen', 'dosen-musyrif']);
    if (!user) window.location.href = '../../index.html';

    let rekapData = [], currentMkNama = '', currentMkId = '', currentTotalPertemuan = 16;
    let allJadwalData = [];

    function getInitials(nama) {
      return (nama || '').split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
    }

    async function loadFilter() {
      const sel = document.getElementById('filterMatkul');
      try {
        const snap = await db.collection('jadwal').where('dosenId', '==', user.uid).get();
        allJadwalData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const ids = [...new Set(allJadwalData.map(d => d.mkId).filter(Boolean))];
        for (const id of ids) {
          const doc = await db.collection('matakuliah').doc(id).get();
          if (doc.exists) {
            const o = document.createElement('option');
            o.value = id; o.textContent = doc.data().nama || id; sel.appendChild(o);
          }
        }
      } catch(e) { console.error(e); }
    }

    window.loadRekap = async function() {
      const mkId = document.getElementById('filterMatkul').value;
      const card = document.getElementById('tableCard');
      const btnExcel = document.getElementById('btnExcel');
      currentMkId = mkId;
      rekapData = []; btnExcel.disabled = true;

      if (!mkId) {
        card.innerHTML = '<div class="state-box"><i class="fa-solid fa-table-list"></i><p>Pilih matakuliah untuk melihat rekap</p></div>';
        return;
      }

      card.innerHTML = '<div class="state-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Memuat data...</p></div>';

      try {
        const mkDoc = await db.collection('matakuliah').doc(mkId).get();
        currentMkNama = mkDoc.exists ? (mkDoc.data().nama || 'Matakuliah') : 'Matakuliah';

        // Ambil total pertemuan dari jadwal
        const jadwalMK = allJadwalData.filter(j => j.mkId === mkId);
        currentTotalPertemuan = jadwalMK.length > 0 ? (jadwalMK[0].totalPertemuan || 16) : 16;

        // Ambil absensi
        let absenDocs = [];
        const snap1 = await db.collection('absensi').where('dosenId', '==', user.uid).where('mapelId', '==', mkId).get();
        absenDocs = [...snap1.docs];
        if (absenDocs.length === 0) {
          const snap2 = await db.collection('absensi').where('dosenId', '==', user.uid).where('mkId', '==', mkId).get();
          absenDocs = [...snap2.docs];
        }

        // Rekap per mahasiswa
        const rekapMap = {};
        absenDocs.forEach(doc => {
          const d = doc.data();
          const mhsId = d.mahasiswaId || d.santriId || null;
          if (!mhsId) return;
          if (!rekapMap[mhsId]) rekapMap[mhsId] = { sakit: 0, izin: 0, alfa: 0, jaga: 0 };
          const status = d.status || 'hadir';
          if (status !== 'hadir') rekapMap[mhsId][status] = (rekapMap[mhsId][status] || 0) + 1;
        });

        // Fetch mahasiswa
        const mhsCache = {};
        async function getMahasiswa(id) {
          if (mhsCache[id] !== undefined) return mhsCache[id];
          const doc = await db.collection('mahasiswa').doc(id).get();
          mhsCache[id] = doc.exists ? doc.data() : null;
          return mhsCache[id];
        }

        const arr = [];
        for (const [mhsId, val] of Object.entries(rekapMap)) {
          const mhsData = await getMahasiswa(mhsId);
          if (!mhsData || !mhsData.nama) continue;
          const sakit = val.sakit || 0, izin = val.izin || 0, alfa = val.alfa || 0, jaga = val.jaga || 0;
          const totalTidakHadir = sakit + izin + alfa + jaga;
          const hadir = Math.max(0, currentTotalPertemuan - totalTidakHadir);
          const persentase = currentTotalPertemuan > 0 ? Math.round((hadir / currentTotalPertemuan) * 100) : 0;
          arr.push({ mhsId, nama: mhsData.nama, nim: mhsData.nim || '—', hadir, sakit, izin, alfa, jaga, totalTidakHadir, persentase });
        }
        arr.sort((a,b) => a.nama.localeCompare(b.nama, 'id'));
        rekapData = arr;

        renderTable(arr);
        btnExcel.disabled = false;
      } catch(e) {
        card.innerHTML = `<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i><p>Gagal memuat</p></div>`;
      }
    };

    function renderTable(arr) {
      const card = document.getElementById('tableCard');
      const lulusCount = arr.filter(r => r.persentase >= 75).length;
      const tidakLulus = arr.filter(r => r.persentase < 75).length;
      const totalAlfa = arr.reduce((s, r) => s + r.alfa, 0);

      if (arr.length === 0) {
        card.innerHTML = '<div class="state-box"><i class="fa-solid fa-inbox"></i><p>Belum ada data absensi</p></div>';
        return;
      }

      let html = `
        <div class="meta-row">
          <div class="meta-chip"><i class="fa-solid fa-book"></i> <span>${currentMkNama}</span></div>
          <span class="meta-sep">·</span>
          <div class="meta-chip"><i class="fa-solid fa-users"></i> <strong>${arr.length}</strong> mahasiswa</div>
        </div>

        <!-- JP EDIT ROW -->
        <div class="jp-edit-row">
          <label>📅 Pertemuan/JP:</label>
          <input class="jp-input" id="jpInput" value="${currentTotalPertemuan}" type="number" min="1" max="30" onchange="updateJPPreview(this.value)">
          <button class="btn-save-jp" onclick="saveJP()"><i class="fa-solid fa-save"></i> Simpan</button>
          <span style="font-size:10px;color:var(--text-muted);margin-left:4px;">Simpan ke jadwal</span>
        </div>

        <div class="summary-grid">
          <div class="sum-card success"><div class="sc-label">Lulus Hadir</div><div class="sc-val">${lulusCount}</div></div>
          <div class="sum-card danger"><div class="sc-label">Tidak Lulus</div><div class="sc-val">${tidakLulus}</div></div>
          <div class="sum-card"><div class="sc-label">Total Alfa</div><div class="sc-val">${totalAlfa}</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="left">#</th><th class="left">Nama</th>
              <th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alfa</th><th>Jaga</th><th>% Hadir</th>
            </tr></thead><tbody>`;

      arr.forEach((r, i) => {
        const pctClass = r.persentase >= 75 ? 'good' : r.persentase >= 50 ? 'warn' : 'danger';
        const pctIcon = r.persentase >= 75 ? 'fa-circle-check' : r.persentase >= 50 ? 'fa-triangle-exclamation' : 'fa-circle-xmark';
        const cell = (val, cls) => `<td class="td-count ${cls} ${val===0?'zero':''}">${val===0?'—':val}</td>`;
        html += `<tr>
          <td class="td-no left">${i+1}</td>
          <td class="left"><div class="nama-cell"><div class="mini-avatar">${getInitials(r.nama)}</div><div><div class="nama-text">${r.nama}</div><div class="nim-text">${r.nim}</div></div></div></td>
          <td class="td-count" style="font-weight:700;">${r.hadir}</td>
          ${cell(r.sakit,'sakit')}${cell(r.izin,'izin')}${cell(r.alfa,'alfa')}${cell(r.jaga,'jaga')}
          <td><span class="pct-badge ${pctClass}"><i class="fa-solid ${pctIcon}"></i> ${r.persentase}%</span></td></tr>`;
      });
      html += '</tbody></table></div>';
      card.innerHTML = html;
    }

    // ═══ UPDATE JP PREVIEW (TANPA SIMPAN) ═══
    window.updateJPPreview = function(value) {
      const newJP = parseInt(value) || 16;
      // Update data & render ulang
      currentTotalPertemuan = newJP;
      rekapData.forEach(r => {
        const totalTidakHadir = r.sakit + r.izin + r.alfa + r.jaga;
        r.hadir = Math.max(0, newJP - totalTidakHadir);
        r.persentase = newJP > 0 ? Math.round((r.hadir / newJP) * 100) : 0;
      });
      renderTable(rekapData);
    };

    // ═══ SIMPAN JP KE JADWAL ═══
    window.saveJP = async function() {
      const newJP = parseInt(document.getElementById('jpInput').value) || 16;
      currentTotalPertemuan = newJP;

      try {
        const jadwalMK = allJadwalData.filter(j => j.mkId === currentMkId);
        if (jadwalMK.length === 0) { alert('Tidak ada jadwal untuk MK ini!'); return; }

        const batch = db.batch();
        jadwalMK.forEach(j => {
          batch.update(db.collection('jadwal').doc(j.id), {
            totalPertemuan: newJP,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit();
        alert(`✅ Pertemuan/JP disimpan: ${newJP}x`);

        // Update allJadwalData
        allJadwalData.forEach(j => { if (j.mkId === currentMkId) j.totalPertemuan = newJP; });

        // Render ulang
        updateJPPreview(newJP);
      } catch(e) { alert('❌ Gagal: ' + e.message); }
    };

    window.exportExcel = function() {
      if (!rekapData.length) { alert('Tidak ada data!'); return; }
      const wb = XLSX.utils.book_new();
      const infoRows = [
        ['REKAP ABSENSI KELAS'],
        ['Matakuliah', currentMkNama],
        ['Total Pertemuan/JP', currentTotalPertemuan],
        ['Tanggal', new Date().toLocaleDateString('id-ID')],
        [],
      ];
      const tableHeader = ['No','Nama','NIM','Hadir','Sakit','Izin','Alfa','Jaga','% Kehadiran','Keterangan'];
      const tableRows = rekapData.map((r, i) => [
        i+1, r.nama, r.nim, r.hadir, r.sakit, r.izin, r.alfa, r.jaga,
        r.persentase/100, r.persentase >= 75 ? 'Lulus' : 'Tidak Lulus'
      ]);
      const ws = XLSX.utils.aoa_to_sheet([...infoRows, tableHeader, ...tableRows]);
      XLSX.utils.book_append_sheet(wb, ws, 'Rekap Absensi');
      XLSX.writeFile(wb, `rekap-absensi-${currentMkNama.replace(/\s+/g,'-')}-${new Date().toISOString().split('T')[0]}.xlsx`);
    };

    loadFilter();
  </script>
</body>
</html>
