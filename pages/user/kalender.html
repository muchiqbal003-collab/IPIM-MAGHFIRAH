<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalender Kegiatan - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--gold-light:#fffbee;
      --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
      --gray-200:#d1ead8;--gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--blue:#1565c0;--blue-light:#e3f2fd;
      --orange:#f57c00;--orange-light:#fff3e0;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.3s ease;
      --header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
      color: var(--gray-800);
      padding-top: var(--header-height);
      padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, #003d33 0%, #006644 100%);
      color: white; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,61,51,0.35);
    }
    .btn-back {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      color: white; font-size: 16px; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .app-header h3 { font-size: 16px; font-weight: 700; flex: 1; }
    .btn-share {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 8px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    /* Content */
    .content { padding: 14px; display: flex; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; }

    /* Card Glass */
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06);
    }

    /* Month Navigator */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .nav-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(0, 61, 51, 0.1);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      color: var(--green-dark); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); flex-shrink: 0;
    }
    .nav-btn:hover { background: rgba(0, 168, 89, 0.1); }
    .month-label { font-size: 16px; font-weight: 700; color: var(--green-dark); text-align: center; }
    .month-count { font-size: 11px; color: var(--gray-600); text-align: center; margin-top: 2px; }
    .today-btn {
      padding: 8px 14px; border-radius: 20px; border: 1px solid var(--green);
      background: var(--green-light); color: var(--green-dark);
      font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }

    /* Event List */
    .event-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .event-item {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 4px solid var(--green);
      transition: var(--transition);
    }
    .event-item:hover { background: rgba(0, 168, 89, 0.06); }
    .event-item.eo { border-left-color: var(--orange); }
    .event-item.today { background: rgba(0, 168, 89, 0.08); border-color: var(--green); }

    .event-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .event-date-badge {
      background: var(--green-light); color: var(--green-dark);
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .event-item.eo .event-date-badge { background: var(--orange-light); color: #e65100; }
    .today-badge {
      background: var(--green); color: white; padding: 2px 8px;
      border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 4px;
    }
    .event-title { font-size: 14px; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
    .event-desc { font-size: 12px; color: var(--gray-600); line-height: 1.5; margin-bottom: 6px; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--gray-600); }
    .event-meta span { display: flex; align-items: center; gap: 4px; }
    .event-source {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 10px; font-weight: 700; margin-top: 6px;
    }
    .event-source.ipim { background: var(--green-light); color: var(--green-dark); }
    .event-source.eo { background: var(--orange-light); color: #e65100; }

    /* Empty */
    .empty-state { text-align: center; padding: 30px; }
    .empty-state .icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state p { color: var(--gray-600); font-size: 13px; }

    /* Loading */
    .loading { text-align: center; padding: 30px; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--gray-200);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 24px;
      display: flex; align-items: center; justify-content: space-around; z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 61, 51, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 0 8px; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600);
      cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
    }
    .nav-item i { font-size: 20px; transition: all 0.3s ease; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; }
    .nav-item.active i { color: var(--green); filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3)); }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: var(--green); border-radius: 0 0 4px 4px; }

    @media (max-width: 480px) {
      .content { padding: 8px; gap: 10px; }
      .month-label { font-size: 14px; }
      .event-title { font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="goTo('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
    <h3>📅 Kalender Kegiatan</h3>
    <button class="btn-share" onclick="shareKalender()"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
  </header>

  <div class="content">
    <!-- Month Navigator -->
    <div class="card">
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <div style="flex:1;">
          <div class="month-label" id="monthLabel">Juli 2026</div>
          <div class="month-count" id="monthCount">0 kegiatan</div>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="today-btn" onclick="goToToday()">📌 Hari Ini</button>
      </div>
    </div>

    <!-- Event List -->
    <div id="eventList">
      <div class="loading"><div class="spinner"></div><p style="color:var(--gray-600);">Memuat kegiatan...</p></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item active" onclick="goTo('kalender.html')"><i class="fa-solid fa-calendar-days"></i><span>Kalender</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')">
      <i class="fa-solid fa-grip"></i><span id="navMenu">Menu</span>
    </div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span>Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span>Profil</span></div>
  </nav>

  <!-- Supabase -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const supabaseEO = createClient(
      'https://twdtfckgwlclfznznrvu.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3ZHRmY2tnd2xjbGZ6bnpucnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NTMwMjAsImV4cCI6MjA5NzMyOTAyMH0.HmGPveqQ6CdhKfH2PsofEfBN6vZx8Np6opUM-XOywKQ'
    )

    const user = checkRole(['dosen', 'musyrif', 'dosen-musyrif', 'umum']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    const now = new Date();
    let currentMonth = now.getMonth();
    let currentYear = now.getFullYear();
    let allEventsData = [];
    const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    function updateLabel() {
      document.getElementById('monthLabel').textContent = `${monthNames[currentMonth]} ${currentYear}`;
    }

    async function loadEvents(month, year) {
      const container = document.getElementById('eventList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:var(--gray-600);">Memuat...</p></div>';

      try {
        const startDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
        const endDay = new Date(year, month+1, 0).getDate();
        const endDate = `${year}-${String(month+1).padStart(2,'0')}-${String(endDay).padStart(2,'0')}`;
        const today = new Date().toISOString().split('T')[0];

        // IPIM events
        const ipimSnap = await db.collection('kalenderAkademik')
          .where('tanggal', '>=', startDate)
          .where('tanggal', '<=', endDate)
          .get();
        const ipimEvents = ipimSnap.docs.map(d => ({ ...d.data(), sumber: 'IPIM' }));

        // EO HK events
        const { data: eoData } = await supabaseEO
          .from('kalender_kegiatan')
          .select('*')
          .eq('is_public', true)
          .gte('tanggal', startDate)
          .lte('tanggal', endDate)
          .order('tanggal', { ascending: true });

        const eoEvents = (eoData || []).map(e => ({
          judul: e.judul,
          deskripsi: e.deskripsi || '',
          tanggal: e.tanggal,
          waktuMulai: e.waktu_mulai?.slice(0,5),
          waktuSelesai: e.waktu_selesai?.slice(0,5),
          tempat: e.tempat || '',
          sumber: 'EO HK'
        }));

        allEventsData = [...ipimEvents, ...eoEvents].sort((a,b) => a.tanggal.localeCompare(b.tanggal));
        document.getElementById('monthCount').textContent = `${allEventsData.length} kegiatan`;

        if (allEventsData.length === 0) {
          container.innerHTML = `<div class="card"><div class="empty-state"><div class="icon">📭</div><p>Belum ada kegiatan di bulan ini</p></div></div>`;
          return;
        }

        // Group by date
        const grouped = {};
        allEventsData.forEach(e => {
          if (!grouped[e.tanggal]) grouped[e.tanggal] = [];
          grouped[e.tanggal].push(e);
        });

        let html = '<div class="event-list">';
        for (const [tanggal, events] of Object.entries(grouped)) {
          const d = new Date(tanggal + 'T00:00:00');
          const formatted = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
          const isToday = tanggal === today;

          events.forEach(e => {
            const isEO = e.sumber === 'EO HK';
            html += `<div class="event-item ${isEO ? 'eo' : ''} ${isToday ? 'today' : ''}">
              <div class="event-date-row">
                <span class="event-date-badge">📅 ${formatted}${isToday ? '<span class="today-badge">HARI INI</span>' : ''}</span>
              </div>
              <div class="event-title">${e.judul}</div>
              ${e.deskripsi ? `<div class="event-desc">${e.deskripsi}</div>` : ''}
              <div class="event-meta">
                ${e.waktuMulai ? `<span>⏰ ${e.waktuMulai}${e.waktuSelesai?' - '+e.waktuSelesai:''} WIB</span>` : ''}
                ${e.tempat ? `<span>📍 ${e.tempat}</span>` : ''}
              </div>
              <span class="event-source ${isEO ? 'eo' : 'ipim'}">${isEO ? 'EO HK' : 'IPIM'}</span>
            </div>`;
          });
        }
        html += '</div>';
        container.innerHTML = html;
      } catch(e) {
        container.innerHTML = `<div class="card"><div class="empty-state"><div class="icon">❌</div><p>Gagal memuat: ${e.message}</p></div></div>`;
      }
    }

    window.changeMonth = function(delta) {
      if (currentMonth === 0 && delta < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth === 11 && delta > 0) { currentMonth = 0; currentYear++; }
      else { currentMonth += delta; }
      updateLabel();
      loadEvents(currentMonth, currentYear);
    };

    window.goToToday = function() {
      currentMonth = now.getMonth();
      currentYear = now.getFullYear();
      updateLabel();
      loadEvents(currentMonth, currentYear);
    };

    window.shareKalender = async function() {
      if (allEventsData.length === 0) { alert('Belum ada kegiatan!'); return; }
      let text = '📅 *KALENDER KEGIATAN*\n';
      text += `📆 ${monthNames[currentMonth]} ${currentYear}\n━━━━━━━━━━━━━━━━\n\n`;
      
      const grouped = {};
      allEventsData.forEach(e => {
        if (!grouped[e.tanggal]) grouped[e.tanggal] = [];
        grouped[e.tanggal].push(e);
      });
      
      for (const [tanggal, events] of Object.entries(grouped)) {
        const d = new Date(tanggal + 'T00:00:00');
        const formatted = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
        text += `📌 *${formatted}*\n`;
        events.forEach(e => {
          text += `  • ${e.judul}`;
          if (e.waktuMulai) text += ` (${e.waktuMulai}${e.waktuSelesai?'-'+e.waktuSelesai:''})`;
          text += ` [${e.sumber}]\n`;
        });
        text += '\n';
      }
      
      text += '━━━━━━━━━━━━━━━━\n© IPIM Maghfirah';
      
      if (navigator.share) {
        try { await navigator.share({ title: 'Kalender IPIM', text }); } catch(e) {}
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      }
    };

    updateLabel();
    loadEvents(currentMonth, currentYear);
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
