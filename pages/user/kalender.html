<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalender - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
      min-height: 100vh; color: #e2e8f0;
      position: relative; overflow-x: hidden; padding-bottom: 100px;
    }
    body::before {
      content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(15, 118, 110, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
      animation: bgFloat 20s ease-in-out infinite; pointer-events: none; z-index: 0;
    }
    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(1%, -1%); }
      66% { transform: translate(-1%, 1%); }
    }

    .container { max-width: 640px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 1; }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
      padding: 1.5rem; text-align: center; margin-bottom: 1rem;
      position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }
    .header-icon {
      width: 48px; height: 48px; margin: 0 auto 0.5rem;
      background: rgba(15, 118, 110, 0.2); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(15, 118, 110, 0.3);
    }
    .header h1 { color: #fff; font-size: 1.5rem; font-weight: 700; }
    .header-subtitle { color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; margin-top: 0.25rem; }

    /* Month Navigator */
    .month-nav {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
      padding: 0.75rem 1rem; margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .nav-btn {
      width: 40px; height: 40px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      cursor: pointer; color: #5eead4; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.2s;
    }
    .nav-btn:active { background: rgba(15, 118, 110, 0.2); }
    .month-label { font-size: 1rem; font-weight: 600; color: #f1f5f9; text-align: center; }
    .month-count { font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); margin-top: 0.15rem; }
    .today-btn {
      background: rgba(15, 118, 110, 0.2); border: 1px solid rgba(15, 118, 110, 0.3);
      border-radius: 10px; padding: 0.5rem 0.75rem; cursor: pointer;
      color: #5eead4; font-size: 0.75rem; font-weight: 600; font-family: inherit;
    }

    /* Event List */
    .event-list { display: flex; flex-direction: column; gap: 1rem; }
    .event-card {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
      padding: 1.25rem; position: relative; overflow: hidden;
      transition: all 0.3s;
    }
    .event-card:active { transform: translateY(-2px); background: rgba(255, 255, 255, 0.06); }
    .event-card::after {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 60%; border-radius: 0 4px 4px 0;
    }
    .event-card.ipim::after { background: linear-gradient(180deg, #0f766e, #14b8a6); }
    .event-card.eo::after { background: linear-gradient(180deg, #f59e0b, #fbbf24); }

    .event-date { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; padding-left: 0.5rem; }
    .date-badge {
      background: rgba(15, 118, 110, 0.15); border: 1px solid rgba(15, 118, 110, 0.2);
      border-radius: 12px; padding: 0.25rem 0.75rem; font-size: 0.75rem;
      font-weight: 600; color: #5eead4; white-space: nowrap;
    }
    .event-card.eo .date-badge { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .event-title { font-size: 1rem; font-weight: 600; color: #f1f5f9; padding-left: 0.5rem; margin-bottom: 0.35rem; }
    .event-desc { color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; line-height: 1.5; padding-left: 0.5rem; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; padding-left: 0.5rem; font-size: 0.75rem; color: rgba(255, 255, 255, 0.4); margin-top: 0.5rem; }
    .event-source {
      display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.65rem;
      font-weight: 700; margin-top: 0.5rem; margin-left: 0.5rem;
    }
    .event-source.ipim { background: rgba(15, 118, 110, 0.2); color: #5eead4; }
    .event-source.eo { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .today-badge {
      background: #14b8a6; color: #fff; font-size: 0.55rem; padding: 2px 6px;
      border-radius: 8px; margin-left: 4px; font-weight: 700;
    }

    .empty-state { text-align: center; padding: 3rem; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); }
    .empty-state p { color: rgba(255,255,255,0.4); font-size: 0.9rem; }
    .loading { text-align: center; padding: 3rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #14b8a6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 2rem; padding: 1.5rem; color: rgba(255,255,255,0.25); font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.05); }
    .footer a { color: #5eead4; text-decoration: none; }

    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
      display: flex; align-items: center; justify-content: space-around; z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      padding: 0 8px;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.5); cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px; transition: all 0.3s; position: relative; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: #5eead4; font-weight: 700; }
    .nav-item.active i { color: #14b8a6; }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: #14b8a6; border-radius: 0 0 4px 4px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">📅</div>
      <h1>Kalender Kegiatan</h1>
      <div class="header-subtitle">IPIM Maghfirah × EO HK</div>
    </div>

    <!-- Month Navigator -->
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <div style="text-align:center;">
        <div class="month-label" id="monthLabel">Juli 2026</div>
        <div class="month-count" id="monthCount">0 kegiatan</div>
      </div>
      <button class="nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="today-btn" onclick="goToToday()">Hari Ini</button>
    </div>

    <!-- Event List -->
    <div id="eventList">
      <div class="loading"><div class="spinner"></div><p>Memuat kegiatan...</p></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      © 2026 <a href="#">IPIM Maghfirah</a> × <a href="#">EO HK</a> · Kalender Kegiatan
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item active" onclick="goTo('kalender.html')"><i class="fa-solid fa-calendar-days"></i><span>Kalender</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')"><i class="fa-solid fa-grid-2"></i><span>Menu</span></div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span>Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span>Profil</span></div>
  </nav>

  <!-- Supabase -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const supabaseEO = createClient(
      'https://twdtfckgwlclfznznrvu.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3ZHRmY2tnd2xjbGZ6bnpucnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NTMwMjAsImV4cCI6MjA5NzMyOTAyMH0.HmGPveqQ6CdhKfH2PsofEfBN6vZx8Np6opUM-XOywKQ'
    )

    const user = checkRole(['dosen', 'musyrif', 'dosen-musyrif', 'umum']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    const now = new Date();
    let currentMonth = now.getMonth();
    let currentYear = now.getFullYear();
    const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    function updateLabel() {
      document.getElementById('monthLabel').textContent = `${monthNames[currentMonth]} ${currentYear}`;
    }

    async function loadEvents(month, year) {
      const container = document.getElementById('eventList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Memuat...</p></div>';

      try {
        // Load IPIM events
        const startDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
        const endDay = new Date(year, month+1, 0).getDate();
        const endDate = `${year}-${String(month+1).padStart(2,'0')}-${String(endDay).padStart(2,'0')}`;
        const today = new Date().toISOString().split('T')[0];

        const ipimSnap = await db.collection('kalenderAkademik')
          .where('tanggal', '>=', startDate)
          .where('tanggal', '<=', endDate)
          .get();
        
        const ipimEvents = ipimSnap.docs.map(d => ({ ...d.data(), sumber: 'IPIM' }));

        // Load EO HK events
        const { data: eoData } = await supabaseEO
          .from('kalender_kegiatan')
          .select('*')
          .eq('is_public', true)
          .gte('tanggal', startDate)
          .lte('tanggal', endDate)
          .order('tanggal', { ascending: true });

        const eoEvents = (eoData || []).map(e => ({
          judul: e.judul,
          deskripsi: e.deskripsi || '',
          tanggal: e.tanggal,
          waktuMulai: e.waktu_mulai?.slice(0,5),
          waktuSelesai: e.waktu_selesai?.slice(0,5),
          tempat: e.tempat || '',
          sumber: 'EO HK'
        }));

        // Gabung & sort
        const allEvents = [...ipimEvents, ...eoEvents].sort((a,b) => a.tanggal.localeCompare(b.tanggal));
        
        document.getElementById('monthCount').textContent = `${allEvents.length} kegiatan`;

        if (allEvents.length === 0) {
          container.innerHTML = `<div class="empty-state"><p>📭 Belum ada kegiatan</p><p style="font-size:0.7rem;margin-top:0.25rem;">${monthNames[month]} ${year}</p></div>`;
          return;
        }

        container.innerHTML = `<div class="event-list">${allEvents.map(e => {
          const d = new Date(e.tanggal + 'T00:00:00');
          const formatted = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
          const isToday = e.tanggal === today;
          const isEO = e.sumber === 'EO HK';
          
          return `<div class="event-card ${isEO ? 'eo' : 'ipim'}">
            <div class="event-date">
              <span class="date-badge">📅 ${formatted}${isToday ? '<span class="today-badge">HARI INI</span>' : ''}</span>
            </div>
            <div class="event-title">${e.judul}</div>
            ${e.deskripsi ? `<div class="event-desc">${e.deskripsi}</div>` : ''}
            <div class="event-meta">
              ${e.waktuMulai ? `<span>⏰ ${e.waktuMulai}${e.waktuSelesai?' - '+e.waktuSelesai:''} WIB</span>` : ''}
              ${e.tempat ? `<span>📍 ${e.tempat}</span>` : ''}
            </div>
            <span class="event-source ${isEO ? 'eo' : 'ipim'}">${isEO ? 'EO HK' : 'IPIM'}</span>
          </div>`;
        }).join('')}</div>`;
      } catch(e) {
        container.innerHTML = `<div class="empty-state"><p>❌ Gagal memuat: ${e.message}</p></div>`;
      }
    }

    window.changeMonth = function(delta) {
      if (currentMonth === 0 && delta < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth === 11 && delta > 0) { currentMonth = 0; currentYear++; }
      else { currentMonth += delta; }
      updateLabel();
      loadEvents(currentMonth, currentYear);
    };

    window.goToToday = function() {
      currentMonth = now.getMonth();
      currentYear = now.getFullYear();
      updateLabel();
      loadEvents(currentMonth, currentYear);
    };

    // Init
    updateLabel();
    loadEvents(currentMonth, currentYear);
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
