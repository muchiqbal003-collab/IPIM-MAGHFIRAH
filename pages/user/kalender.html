<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kalender Akademik - IPIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
            --green-light:#e8f5e9;--green-pale:#f0faf5;
            --gold:#f5c842;--gold-light:#fffbee;
            --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
            --gray-200:#d1ead8;--gray-600:#666666;--gray-800:#222222;
            --radius-sm:10px;--radius:14px;--radius-lg:18px;
            --transition:all 0.3s ease;
            --header-height:56px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
            color: var(--gray-800);
            padding-top: var(--header-height);
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* ═══ HEADER ═══ */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: linear-gradient(135deg, #003d33 0%, #006644 100%);
            color: white; padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 4px 20px rgba(0,61,51,0.35);
        }
        .btn-back {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
            color: white; font-size: 16px; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .app-header h3 { font-size: 16px; font-weight: 700; flex: 1; }
        .btn-share {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: var(--transition);
        }

        /* ═══ CONTENT ═══ */
        .content { padding: 14px; display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }

        /* ═══ CARDS — GLASS ═══ */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06);
        }

        /* ═══ CALENDAR ═══ */
        .calendar-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
        }
        .calendar-header h2 { font-size: 16px; font-weight: 700; color: var(--green-dark); }
        .cal-nav-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid rgba(0, 61, 51, 0.1);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: var(--green-dark); font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
        }
        .calendar-grid .day-name {
            font-size: 10px; font-weight: 700; color: var(--gray-600);
            padding: 6px 0; text-transform: uppercase;
        }
        .calendar-grid .day-name:first-child { color: #b71c1c; }
        .calendar-grid .day {
            padding: 10px 4px; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 12px; font-weight: 500; position: relative;
            transition: var(--transition); color: var(--gray-800);
        }
        .calendar-grid .day.today {
            background: var(--green-light); font-weight: 700;
            border: 2px solid var(--green);
        }
        .calendar-grid .day.selected {
            background: var(--green-dark); color: white; font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 61, 51, 0.3);
        }
        .calendar-grid .day.has-event::after {
            content: ''; position: absolute; bottom: 3px; left: 50%;
            transform: translateX(-50%); width: 5px; height: 5px;
            border-radius: 50%; background: var(--gold);
        }
        .calendar-grid .day.selected.has-event::after { background: white; }

        /* ═══ EVENT LIST ═══ */
        .section-title {
            font-size: 14px; font-weight: 700; color: var(--green-dark);
            margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
        }
        .section-title i { font-size: 16px; color: var(--green); }
        .event-list { display: flex; flex-direction: column; gap: 8px; }
        .event-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 3px solid var(--green);
            font-size: 12px;
        }
        .event-item .title { font-weight: 700; color: var(--gray-800); margin-bottom: 3px; }
        .event-item .desc { font-size: 11px; color: var(--gray-600); }
        .no-event { text-align: center; color: var(--gray-600); font-size: 13px; padding: 20px; }
    </style>
</head>
<body>

    <header class="app-header">
        <button class="btn-back" onclick="goTo('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <h3>Kalender Akademik</h3>
        <button class="btn-share" onclick="shareKalender()"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
    </header>

    <div class="content">
        <div class="card">
            <div class="calendar-header">
                <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="monthLabel">Januari 2026</h2>
                <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="card">
            <div class="section-title">
                <i class="fa-solid fa-calendar-check"></i>
                <span id="selectedDateLabel">📅 Event Hari Ini</span>
            </div>
            <div class="event-list" id="eventList">
                <p class="no-event">Pilih tanggal untuk lihat event</p>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════ -->
    <!-- BOTTOM NAV — GLASS FLOATING PREMIUM  -->
    <!-- ══════════════════════════════════════ -->
    <style>
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 420px;
            height: 64px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            box-shadow: 
                0 8px 32px rgba(0, 61, 51, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 0 8px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 10px;
            font-weight: 500;
            color: var(--gray-600);
            cursor: pointer;
            text-decoration: none;
            padding: 8px 0;
            flex: 1;
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .nav-item i {
            font-size: 20px;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: var(--green-dark);
            font-weight: 700;
        }
        .nav-item.active i {
            color: var(--green);
            filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3));
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 2px;
            width: 28px;
            height: 3px;
            background: var(--green);
            border-radius: 0 0 4px 4px;
        }
    </style>

     <!-- ══════════════════════════════════════ -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')">
      <i class="fa-solid fa-house"></i>
      <span id="navHome">Home</span>
    </div>
    <div class="nav-item active" onclick="goTo('kalender.html')">
      <i class="fa-solid fa-calendar-days"></i>
      <span id="navKalender">Kalender</span>
    </div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')">
      <i class="fa-brands fa-html5"></i>
      <span id="navMenu">Menu</span>
    </div>
    <div class="nav-item" onclick="goTo('rekap.html')">
      <i class="fa-solid fa-chart-simple"></i>
      <span id="navRekap">Rekap</span>
    </div>
    <div class="nav-item" onclick="goTo('profil.html')">
      <i class="fa-solid fa-circle-user"></i>
      <span id="navProfil">Profil</span>
    </div>
  </nav>
  
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        const user = checkRole(['dosen', 'musyrif', 'dosen-musyrif', 'umum']);
        if (!user) window.location.href = '../../index.html';
        window.goTo = page => window.location.href = page;

        let currentDate = new Date();
        let events = [];
        let selectedDate = new Date().toISOString().split('T')[0];

        async function loadEvents() {
            try {
                const snap = await db.collection('kalenderAkademik').get();
                events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCalendar();
                loadEventsByDate(selectedDate);
            } catch(e) { console.error(e); }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date().toISOString().split('T')[0];
            const dayNames = ['Ahad','Sen','Sel','Rab','Kam','Jum','Sab'];
            let html = dayNames.map(d => `<div class="day-name">${d}</div>`).join('');
            for (let i = 0; i < firstDay; i++) html += '<div class="day"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = dateStr === today;
                const isSelected = dateStr === selectedDate;
                const hasEvent = events.some(e => e.tanggal === dateStr);
                html += `<div class="day ${isToday?'today':''} ${isSelected?'selected':''} ${hasEvent?'has-event':''}" onclick="selectDate('${dateStr}')">${d}</div>`;
            }
            document.getElementById('calendarGrid').innerHTML = html;
        }

        window.changeMonth = function(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); };

        window.selectDate = function(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selectedDateLabel').textContent = `📅 Event ${formatDate(dateStr)}`;
            renderCalendar();
            loadEventsByDate(dateStr);
        };

        function loadEventsByDate(dateStr) {
            const filtered = events.filter(e => e.tanggal === dateStr);
            const list = document.getElementById('eventList');
            list.innerHTML = filtered.length === 0 
                ? '<p class="no-event">Tidak ada event</p>' 
                : filtered.map(e => `<div class="event-item"><div class="title">${e.judul}</div><div class="desc">${e.deskripsi||''}</div></div>`).join('');
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            return `${d} ${months[parseInt(m)-1]} ${y}`;
        }

        async function shareKalender() {
            if (events.length === 0) { alert('Belum ada event!'); return; }
            const sorted = [...events].sort((a, b) => (a.tanggal || '').localeCompare(b.tanggal || ''));
            let text = '📅 *KALENDER AKADEMIK IPIM*\n━━━━━━━━━━━━━━━━\n\n';
            sorted.forEach(e => {
                text += `📌 *${formatDate(e.tanggal)}*\n   📖 ${e.judul}\n`;
                if (e.deskripsi) text += `   📝 ${e.deskripsi}\n`;
                text += '\n';
            });
            text += '━━━━━━━━━━━━━━━━\n© IPIM Maghfirah';
            if (navigator.share) {
                try { await navigator.share({ title: 'Kalender Akademik IPIM', text }); } catch(err) {}
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            }
        }

        loadEvents();
    </script>
</body>
</html>
