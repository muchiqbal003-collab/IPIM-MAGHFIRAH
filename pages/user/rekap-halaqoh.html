<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rekap Absensi Halaqoh - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { 
      --green-dark: #004d40; --green: #00a859; --green-light: #e8f5e9; 
      --gold: #d4a843; --white: #ffffff; --gray-50: #fafafa; --gray-100: #f5f5f5; 
      --gray-200: #e0e0e0; --gray-600: #616161; --gray-800: #333333; 
      --red: #e53935; --red-light: #fce4ec; --orange: #f57c00; --orange-light: #fff3e0;
      --blue: #2563eb; --blue-light: #e3f2fd;
      --radius-sm: 8px; --radius: 12px; --transition: all 0.25s ease; --header-height: 56px; 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%); color: var(--gray-800); padding-top: var(--header-height); padding-bottom: 80px; min-height: 100vh; }
    
    .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #003d33, #006644); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,61,51,0.3); }
    .app-header .btn-back { background: rgba(255,255,255,0.12); border: none; color: white; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .app-header h3 { font-size: 15px; font-weight: 700; flex: 1; }
    
    .content { padding: 16px; max-width: 700px; margin: 0 auto; }
    
    .card { background: white; border-radius: var(--radius); padding: 16px; border: 1px solid var(--gray-200); margin-bottom: 14px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,61,51,0.05); }
    .card-title { font-size: 13px; font-weight: 700; color: var(--green-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    .halaqoh-card {
      background: white; border-radius: var(--radius-sm);
      padding: 14px; border: 1px solid var(--gray-200);
      cursor: pointer; margin-bottom: 8px;
      transition: all 0.2s;
    }
    .halaqoh-card:active { background: var(--gray-50); }
    .halaqoh-card h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .halaqoh-card p { font-size: 11px; color: var(--gray-600); }
    
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .badge-pengganti { background: var(--orange-light); color: var(--orange); }
    .badge-tetap { background: var(--green-light); color: var(--green-dark); }
    .badge-green { background: var(--green-light); color: #1b5e20; }
    .badge-red { background: var(--red-light); color: #b71c1c; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-blue { background: var(--blue-light); color: var(--blue); }
    
    .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .summary-card { background: white; border-radius: var(--radius-sm); padding: 10px; text-align: center; border: 1px solid var(--gray-200); }
    .summary-card .s-val { font-size: 18px; font-weight: 800; color: var(--green-dark); }
    .summary-card .s-lbl { font-size: 9px; color: var(--gray-600); margin-top: 2px; font-weight: 600; }
    
    table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 500px; }
    th { background: var(--gray-100); padding: 8px 6px; text-align: center; font-size: 9px; font-weight: 700; color: var(--gray-600); border-bottom: 2px solid var(--gray-200); white-space: nowrap; text-transform: uppercase; }
    td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--gray-100); }
    tbody tr:hover { background: var(--gray-50); }
    
    .info-box { background: var(--blue-light); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 11px; color: var(--blue); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .warning-box { background: #fff3cd; border-radius: var(--radius-sm); padding: 16px; text-align: center; color: #856404; }
    
    @media (max-width: 480px) { .summary-row { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<header class="app-header">
  <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h3>📊 Rekap Absensi Halaqoh</h3>
</header>

<div class="content" id="mainContent">
  <p style="text-align:center;color:var(--gray-600);">Memuat data...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../../js/firebase-config.js"></script>
<script src="../../js/app.js"></script>
<script>
  const user = checkRole(['musyrif', 'dosen-musyrif']);
  if (!user) window.location.href = '../../index.html';

  let isPengganti = false;
  let activeHalaqohId = null;

  // ═══ INIT ═══
  async function init() {
    const container = document.getElementById('mainContent');
    
    try {
      // Cek halaqoh tetap
      let hSnap = await db.collection('halaqoh').where('musyrifId', '==', user.uid).get();
      if (hSnap.empty) hSnap = await db.collection('halaqoh').where('userId', '==', user.uid).get();

      if (!hSnap.empty) {
        isPengganti = false;
        activeHalaqohId = hSnap.docs[0].id;
        await loadRekap(container, hSnap.docs[0].data().nama, false);
        return;
      }

      // Cek halaqoh pengganti
      const penggantiSnap = await db.collection('halaqoh').where('musyrifPenggantiId', '==', user.uid).get();

      if (!penggantiSnap.empty) {
        isPengganti = true;
        let html = `
          <div class="info-box">
            <i class="fa-solid fa-circle-info"></i>
            <span>Anda adalah <strong>Musyrif Pengganti</strong>. Pilih halaqoh untuk melihat rekap:</span>
          </div>`;

        penggantiSnap.forEach(d => {
          const hData = d.data();
          html += `
            <div class="halaqoh-card" onclick="pilihHalaqoh('${d.id}')">
              <h4>${hData.nama} <span class="badge badge-pengganti">Pengganti</span></h4>
              <p>Musyrif tetap: ${hData.musyrifNama || '-'}</p>
            </div>`;
        });

        container.innerHTML = html;
        return;
      }

      // Tidak punya halaqoh
      container.innerHTML = `
        <div class="warning-box">
          <i class="fa-solid fa-circle-exclamation" style="font-size:30px;display:block;margin-bottom:10px;"></i>
          <strong>Anda belum memiliki halaqoh.</strong>
          <p style="margin-top:8px;font-size:12px;">Hubungi Operator Halaqoh.</p>
        </div>`;

    } catch(e) {
      container.innerHTML = `<p style="text-align:center;color:var(--red);">Error: ${e.message}</p>`;
    }
  }

  // ═══ PILIH HALAQOH (PENGGANTI) ═══
  window.pilihHalaqoh = async function(hId) {
    const container = document.getElementById('mainContent');
    try {
      const hDoc = await db.collection('halaqoh').doc(hId).get();
      if (!hDoc.exists) { alert('Halaqoh tidak ditemukan!'); return; }
      activeHalaqohId = hId;
      isPengganti = true;
      await loadRekap(container, hDoc.data().nama, true);
    } catch(e) { alert('Gagal: ' + e.message); }
  };

  // ═══ LOAD REKAP ═══
  async function loadRekap(container, halaqohNama, pengganti) {
    container.innerHTML = '<p style="text-align:center;color:var(--gray-600);">Memuat rekap...</p>';
    
    try {
      // Ambil semua absensi untuk halaqoh ini (oleh musyrif tetap ATAU pengganti)
      const absenSnap = await db.collection('absensiHalaqoh')
        .where('halaqohId', '==', activeHalaqohId)
        .get();
      
      const rekap = {};
      let totalAbsensi = 0;
      
      absenSnap.forEach(d => {
        const data = d.data();
        const mhsId = data.mahasiswaId;
        if (!mhsId) return;
        if (!rekap[mhsId]) rekap[mhsId] = { hadir:0, sakit:0, izin:0, alfa:0, jaga:0, total:0 };
        const status = data.status || 'hadir';
        if (rekap[mhsId][status] !== undefined) rekap[mhsId][status]++;
        rekap[mhsId].total++;
        totalAbsensi++;
      });

      // Ambil daftar anggota halaqoh
      const pSnap = await db.collection('pembagianHalaqoh').where('halaqohId', '==', activeHalaqohId).get();
      const anggotaIds = pSnap.docs.map(d => d.data().mahasiswaId);
      
      const arr = [];
      for (const id of anggotaIds) {
        const mhsDoc = await db.collection('mahasiswa').doc(id).get();
        if (!mhsDoc.exists) continue;
        const nama = mhsDoc.data().nama;
        const val = rekap[id] || { hadir:0, sakit:0, izin:0, alfa:0, jaga:0, total:0 };
        const hadirTotal = val.hadir + (val.jaga || 0);
        const persentase = val.total > 0 ? Math.round((hadirTotal / val.total) * 100) : 0;
        arr.push({ nama, ...val, hadirTotal, persentase });
      }
      
      arr.sort((a,b) => a.nama.localeCompare(b.nama));

      // Summary
      const totalHadir = arr.reduce((s, r) => s + r.hadirTotal, 0);
      const totalSakit = arr.reduce((s, r) => s + r.sakit, 0);
      const totalIzin = arr.reduce((s, r) => s + r.izin, 0);
      const totalAlfa = arr.reduce((s, r) => s + r.alfa, 0);

      let html = `
        <div class="card">
          <div class="card-title">
            📋 ${halaqohNama}
            ${pengganti ? '<span class="badge badge-pengganti">Pengganti</span>' : '<span class="badge badge-tetap">Tetap</span>'}
          </div>
          <div class="summary-row">
            <div class="summary-card"><div class="s-val">${arr.length}</div><div class="s-lbl">Anggota</div></div>
            <div class="summary-card"><div class="s-val" style="color:#1b5e20;">${totalHadir}</div><div class="s-lbl">Hadir</div></div>
            <div class="summary-card"><div class="s-val" style="color:#e65100;">${totalSakit + totalIzin + totalAlfa}</div><div class="s-lbl">Tidak Hadir</div></div>
            <div class="summary-card"><div class="s-val" style="color:#2563eb;">${totalAbsensi}</div><div class="s-lbl">Total Absensi</div></div>
          </div>
        </div>

        <div class="card">
          <table>
            <thead><tr><th>No</th><th>Nama</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alfa</th><th>Jaga</th><th>Total</th><th>%</th></tr></thead>
            <tbody>`;

      if (arr.length === 0) {
        html += '<tr><td colspan="9">Tidak ada data</td></tr>';
      } else {
        arr.forEach((r, i) => {
          const badge = r.persentase >= 75 ? 'badge-green' : r.persentase >= 50 ? 'badge-yellow' : 'badge-red';
          html += `<tr>
            <td>${i+1}</td>
            <td style="text-align:left;font-weight:600;">${r.nama}</td>
            <td style="color:#1b5e20;font-weight:700;">${r.hadirTotal}</td>
            <td style="color:#e65100;">${r.sakit}</td>
            <td style="color:#2563eb;">${r.izin}</td>
            <td style="color:#b71c1c;font-weight:700;">${r.alfa}</td>
            <td style="color:#6d28d9;">${r.jaga||0}</td>
            <td><strong>${r.total}</strong></td>
            <td><span class="badge ${badge}">${r.persentase}%</span></td>
          </tr>`;
        });
      }
      
      html += '</tbody></table></div>';
      container.innerHTML = html;
      
    } catch(e) {
      container.innerHTML = `<p style="text-align:center;color:var(--red);">Gagal: ${e.message}</p>`;
    }
  }

  init();
</script>
</body>
</html>
