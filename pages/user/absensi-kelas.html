<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Absensi Kelas - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--white:#ffffff;
      --gray-50:#f9f9f9;--gray-100:#f0f0f0;--gray-200:#d1ead8;
      --gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--amber:#d97706;--blue:#2563eb;--purple:#7c3aed;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.2s ease;--header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
      color: var(--gray-800); padding-top: var(--header-height); padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent; min-height: 100vh;
    }

    .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #003d33 0%, #006644 100%); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,61,51,0.35); }
    .btn-back { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .header-info { flex: 1; }
    .header-info h3 { font-size: 15px; font-weight: 700; }
    .header-info .sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }

    .content { padding: 14px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .info-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); border-radius: var(--radius-lg);
      padding: 14px 16px; border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06);
    }
    .info-card .mk-nama { font-size: 16px; font-weight: 800; color: var(--green-dark); }
    .info-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .info-chip { display: flex; align-items: center; gap: 5px; background: var(--green-light); border-radius: 20px; padding: 4px 10px; font-size: 10px; font-weight: 600; color: var(--green-dark); }

    .summary-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      border-radius: var(--radius-lg); padding: 12px 16px;
      display: flex; gap: 0; border: 1px solid rgba(255,255,255,0.6);
    }
    .summary-item { flex: 1; text-align: center; }
    .summary-val { font-size: 20px; font-weight: 800; color: var(--green-dark); }
    .summary-lbl { font-size: 10px; color: var(--gray-600); margin-top: 2px; }

    .list-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 4px; }
    .list-header span { font-size: 12px; font-weight: 700; color: var(--green-dark); }
    .mark-all-btn { font-size: 11px; color: var(--green-mid); font-weight: 600; background: var(--green-light); border: none; cursor: pointer; padding: 4px 10px; border-radius: 20px; }

    .santri-list { display: flex; flex-direction: column; gap: 6px; }
    .santri-row {
      background: rgba(255, 255, 255, 0.7); border-radius: var(--radius);
      padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex; align-items: center; gap: 10px; transition: var(--transition);
    }
    .santri-num { width: 26px; height: 26px; border-radius: 50%; background: var(--green-light); color: var(--green-mid); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .santri-nama { flex: 1; font-size: 13px; font-weight: 600; }
    .santri-kelas { font-size: 9px; color: var(--gray-600); margin-left: 4px; }

    .status-select { padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; border: 1.5px solid var(--gray-200); background: white; cursor: pointer; outline: none; }
    .status-select.hadir { border-color: #10b981; background: #d1fae5; color: #065f46; }
    .status-select.sakit { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
    .status-select.izin { border-color: #3b82f6; background: #dbeafe; color: #1e40af; }
    .status-select.alfa { border-color: #ef4444; background: #fce4ec; color: #991b1b; }
    .status-select.jaga { border-color: #8b5cf6; background: #ede9fe; color: #6d28d9; }

    .btn-simpan {
      width: 100%; padding: 13px; border: none; border-radius: 40px;
      background: linear-gradient(135deg, #004d40, #006644); color: white;
      font-size: 14px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(0,61,51,0.3);
    }
    .btn-simpan:disabled { opacity: 0.6; }

    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; border-radius: 20px; padding: 10px 20px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.3s; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; }

    @media (max-width: 480px) { .content { padding: 10px; } }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="header-info">
      <h3 id="headerTitle">Absensi Kelas</h3>
      <div class="sub" id="headerSub">Memuat...</div>
    </div>
  </header>

  <div class="content" id="mainContent">
    <p style="text-align:center;color:var(--gray-600);">Memuat data...</p>
  </div>

  <div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;z-index:50;">
    <button class="btn-simpan" id="btnSimpan"><i class="fa-solid fa-circle-check"></i> Simpan Absensi</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['dosen', 'dosen-musyrif']);
    if (!user) window.location.href = '../../index.html';

    const params = new URLSearchParams(window.location.search);
    const jadwalId = params.get('jadwalId');
    const kelasId = params.get('kelasId');
    const mapelId = params.get('mapelId');

    const absensiState = {};
    let isSaving = false;
    let pertemuanKe = 1;
    let allKelasIds = [];

    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function updateSummary() {
      const counts = { hadir: 0, sakit: 0, izin: 0, alfa: 0, jaga: 0 };
      Object.values(absensiState).forEach(s => { if (counts[s] !== undefined) counts[s]++; });
      document.getElementById('sumHadir').textContent = counts.hadir;
      document.getElementById('sumSakit').textContent = counts.sakit;
      document.getElementById('sumIzin').textContent = counts.izin;
      document.getElementById('sumAlfa').textContent = counts.alfa;
    }

    window.setStatus = function(mhsId, status) {
      absensiState[mhsId] = status;
      const sel = document.getElementById(`sel_${mhsId}`);
      if (sel) {
        sel.className = `status-select ${status}`;
        sel.value = status;
      }
      updateSummary();
    };

    window.markAllHadir = function() {
      Object.keys(absensiState).forEach(id => setStatus(id, 'hadir'));
    };

    document.getElementById('btnSimpan').addEventListener('click', async function() {
      if (isSaving) return;
      if (Object.keys(absensiState).length === 0) { showToast('Tidak ada mahasiswa', 'error'); return; }

      isSaving = true;
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      try {
        const today = new Date().toISOString().split('T')[0];
        const batch = db.batch();

        for (const [mhsId, status] of Object.entries(absensiState)) {
          const existingSnap = await db.collection('absensi')
            .where('mahasiswaId', '==', mhsId)
            .where('mapelId', '==', mapelId)
            .where('tanggal', '==', today)
            .get();

          if (!existingSnap.empty) {
            existingSnap.docs.forEach(d => batch.update(d.ref, { status }));
          } else {
            const ref = db.collection('absensi').doc();
            batch.set(ref, {
              mahasiswaId: mhsId, kelasId, mapelId, jadwalId,
              dosenId: user.uid, status, tanggal: today,
              pertemuanKe, createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        }

        await batch.commit();
        showToast(`✅ Pertemuan ke-${pertemuanKe} tersimpan!`, 'success');
        setTimeout(() => history.back(), 1500);
      } catch(e) {
        showToast('❌ Gagal: ' + e.message, 'error');
        isSaving = false; btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Simpan Absensi';
      }
    });

    async function init() {
      if (!jadwalId || !kelasId || !mapelId) {
        document.getElementById('mainContent').innerHTML = '<p style="text-align:center;">Parameter tidak lengkap.</p>';
        return;
      }

      try {
        const jDoc = await db.collection('jadwal').doc(jadwalId).get();
        const j = jDoc.exists ? jDoc.data() : {};

        // ⬇️ DAPATKAN SEMUA KELAS (GABUNGAN)
        allKelasIds = j.kelasIds || [kelasId];
        if (!allKelasIds.includes(kelasId)) allKelasIds.push(kelasId);

        // Hitung pertemuan ke-
        const absensiSnap = await db.collection('absensi').where('jadwalId', '==', jadwalId).get();
        const tanggalUnik = new Set(absensiSnap.docs.map(d => d.data().tanggal).filter(Boolean));
        const todayStr = new Date().toISOString().split('T')[0];
        if (!tanggalUnik.has(todayStr)) pertemuanKe = tanggalUnik.size + 1;
        else { const sorted = [...tanggalUnik].sort(); pertemuanKe = sorted.indexOf(todayStr) + 1; }
        if (pertemuanKe <= 0) pertemuanKe = 1;

        document.getElementById('headerTitle').textContent = j.mkNama || 'Absensi';
        document.getElementById('headerSub').textContent = `${j.kelasNama || ''} · Pertemuan ke-${pertemuanKe}`;

        // ⬇️ AMBIL MAHASISWA DARI SEMUA KELAS (GABUNGAN)
        let allMhs = [];
        for (const kid of allKelasIds) {
          const mSnap = await db.collection('mahasiswa').where('kelasId', '==', kid).get();
          mSnap.forEach(d => { allMhs.push({ id: d.id, ...d.data() }); });
        }
        // Hapus duplikat
        allMhs = [...new Map(allMhs.map(m => [m.id, m])).values()];
        allMhs.sort((a,b) => (a.nama||'').localeCompare(b.nama||''));

        if (allMhs.length === 0) {
          document.getElementById('mainContent').innerHTML = '<p style="text-align:center;">Tidak ada mahasiswa di kelas ini.</p>';
          return;
        }

        // Existing absensi hari ini
        const existingSnap = await db.collection('absensi')
          .where('dosenId', '==', user.uid)
          .where('tanggal', '==', todayStr)
          .where('mapelId', '==', mapelId)
          .get();
        const existingMap = {};
        existingSnap.forEach(d => { const data = d.data(); if (data.mahasiswaId) existingMap[data.mahasiswaId] = data.status; });

        allMhs.forEach(m => { absensiState[m.id] = existingMap[m.id] || 'hadir'; });

        // Render
        let listHtml = '';
        allMhs.forEach((m, i) => {
          const status = absensiState[m.id];
          const kelasMhs = m.kelasNama || '';
          listHtml += `<div class="santri-row">
            <div class="santri-num">${i+1}</div>
            <div class="santri-nama">${m.nama}${kelasMhs ? `<span class="santri-kelas">(${kelasMhs})</span>` : ''}</div>
            <select class="status-select ${status}" id="sel_${m.id}" onchange="setStatus('${m.id}', this.value)">
              <option value="hadir" ${status==='hadir'?'selected':''}>✓ Hadir</option>
              <option value="sakit" ${status==='sakit'?'selected':''}>🤒 Sakit</option>
              <option value="izin" ${status==='izin'?'selected':''}>📝 Izin</option>
              <option value="alfa" ${status==='alfa'?'selected':''}>❌ Alfa</option>
              <option value="jaga" ${status==='jaga'?'selected':''}>🛡️ Jaga</option>
            </select>
          </div>`;
        });

        const counts = { hadir:0, sakit:0, izin:0, alfa:0, jaga:0 };
        Object.values(absensiState).forEach(s => { if(counts[s]!==undefined) counts[s]++; });

        document.getElementById('mainContent').innerHTML = `
          <div class="info-card">
            <div class="mk-nama">${j.mkNama || '-'}</div>
            <div class="info-row">
              <div class="info-chip"><i class="fa-solid fa-users"></i> ${j.kelasNama || allKelasIds.length+' kelas'}</div>
              <div class="info-chip"><i class="fa-solid fa-calendar-check"></i> Pertemuan ke-${pertemuanKe}</div>
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-item"><div class="summary-val" id="sumHadir">${counts.hadir}</div><div class="summary-lbl">Hadir</div></div>
            <div class="summary-item"><div class="summary-val" id="sumSakit" style="color:#d97706;">${counts.sakit}</div><div class="summary-lbl">Sakit</div></div>
            <div class="summary-item"><div class="summary-val" id="sumIzin" style="color:#2563eb;">${counts.izin}</div><div class="summary-lbl">Izin</div></div>
            <div class="summary-item"><div class="summary-val" id="sumAlfa" style="color:#e53935;">${counts.alfa}</div><div class="summary-lbl">Alfa</div></div>
          </div>
          <div class="list-header">
            <span>📋 ${allMhs.length} Mahasiswa</span>
            <button class="mark-all-btn" onclick="markAllHadir()">✅ Semua Hadir</button>
          </div>
          <div class="santri-list">${listHtml}</div>`;

      } catch(e) {
        document.getElementById('mainContent').innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
