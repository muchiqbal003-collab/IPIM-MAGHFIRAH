<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RPS - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--white:#ffffff;
      --gray-50:#f9f9f9;--gray-100:#f0f0f0;--gray-200:#d1ead8;
      --gray-600:#666666;--gray-800:#222222;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.3s ease;--header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
      color: var(--gray-800); padding-top: var(--header-height); padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent; min-height: 100vh;
    }

    .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #003d33 0%, #006644 100%); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,61,51,0.35); }
    .btn-back { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .app-header h3 { font-size: 16px; font-weight: 700; flex: 1; }

    .content { padding: 14px; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); border-radius: var(--radius-lg);
      padding: 16px; border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06); overflow-x: auto;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--green-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--gray-600); display: block; margin-bottom: 3px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm); font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none; background: white; resize: vertical;
    }
    .form-group textarea { min-height: 40px; }

    .info-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .info-chip { background: var(--green-light); color: var(--green-dark); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

    .btn { padding: 9px 16px; border: none; border-radius: 40px; font-size: 13px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #004d40, #006644); color: white; }
    .btn-outline { background: white; border: 1.5px solid var(--gray-200); color: var(--gray-600); }
    .btn-danger { background: #fce4ec; color: #b71c1c; }
    .btn-sm { padding: 5px 10px; font-size: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 10px; min-width: 700px; }
    th { background: var(--green-dark); color: white; padding: 7px 5px; text-align: center; font-size: 9px; font-weight: 700; border: 1px solid #003d33; }
    td { padding: 5px; text-align: center; border: 1px solid var(--gray-200); }
    td input { width: 100%; padding: 4px 6px; border: 1px solid var(--gray-200); border-radius: 4px; font-size: 10px; font-family: 'Plus Jakarta Sans', sans-serif; }
    td textarea { width: 100%; padding: 4px 6px; border: 1px solid var(--gray-200); border-radius: 4px; font-size: 10px; font-family: 'Plus Jakarta Sans', sans-serif; resize: vertical; min-height: 30px; }

    .alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 8px; display: none; background: var(--green-light); color: #1b5e20; border-left: 4px solid var(--green); }

    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px; display: flex; align-items: center; justify-content: space-around; z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 61, 51, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 0 8px; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600); cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px; transition: all 0.3s; position: relative; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; }
    .nav-item.active i { color: var(--green); filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3)); }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: var(--green); border-radius: 0 0 4px 4px; }

    /* Print */
    @media print {
      .app-header, .bottom-nav, .btn, .alert, .info-row { display: none !important; }
      body { background: white; padding: 0; }
      .content { max-width: 100%; padding: 10px; }
      .card { background: white; border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="goTo('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
    <h3>📖 RPS (Rencana Pembelajaran Semester)</h3>
  </header>

  <div class="content" id="mainContent">
    <p style="text-align:center;color:var(--gray-600);">Memuat data...</p>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item" onclick="goTo('kalender.html')"><i class="fa-solid fa-calendar-days"></i><span>Kalender</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')"><i class="fa-solid fa-grip"></i><span>Menu</span></div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span>Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span>Profil</span></div>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['dosen', 'dosen-musyrif']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    let currentMkId = '', currentKelasId = '', currentTotalPertemuan = 16;
    let currentMkNama = '', currentKelasNama = '', currentProdiNama = '', currentMkKode = '', currentSKS = '';

    function showAlert(text) {
      const el = document.getElementById('alertSuccess');
      if (el) { el.textContent = text; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
    }

    async function loadPage() {
      const container = document.getElementById('mainContent');
      try {
        const jadwalSnap = await db.collection('jadwal').where('dosenId', '==', user.uid).get();
        if (jadwalSnap.empty) {
          container.innerHTML = '<div class="card"><p style="text-align:center;padding:30px;">Belum ada jadwal mengajar</p></div>';
          return;
        }

        const mkMap = new Map();
        jadwalSnap.forEach(doc => {
          const j = doc.data();
          if (!mkMap.has(j.mkId)) {
            mkMap.set(j.mkId, {
              mkNama: j.mkNama, mkKode: j.mkKode || '', sks: j.sks || '3',
              kelasNama: j.kelasNama, kelasId: j.kelasId,
              totalPertemuan: j.totalPertemuan || 16,
              prodiNama: j.prodiNama || '-', semester: j.semester || '-'
            });
          }
        });

        let html = '<div id="alertSuccess" class="alert alert-success"></div>';
        html += '<div class="card"><div class="form-group"><label>📚 Pilih Matakuliah</label><select id="mkSelect" onchange="loadRPS()"><option value="">Pilih Matakuliah...</option>';
        mkMap.forEach((val, mkId) => {
          html += `<option value="${mkId}" data-kelas="${val.kelasId}" data-pertemuan="${val.totalPertemuan}" data-mk="${val.mkNama}" data-kode="${val.mkKode}" data-sks="${val.sks}" data-kelasnama="${val.kelasNama}" data-prodi="${val.prodiNama}" data-semester="${val.semester}">${val.mkKode||''} - ${val.mkNama} (${val.kelasNama})</option>`;
        });
        html += '</select></div></div>';
        html += '<div id="rpsContainer"></div>';
        container.innerHTML = html;
      } catch(e) { console.error(e); }
    }

    window.loadRPS = async function() {
      const sel = document.getElementById('mkSelect');
      if (!sel || !sel.value) { document.getElementById('rpsContainer').innerHTML = ''; return; }

      const opt = sel.options[sel.selectedIndex];
      currentMkId = sel.value;
      currentKelasId = opt.getAttribute('data-kelas');
      currentTotalPertemuan = parseInt(opt.getAttribute('data-pertemuan')) || 16;
      currentMkNama = opt.getAttribute('data-mk');
      currentKelasNama = opt.getAttribute('data-kelasnama');
      currentProdiNama = opt.getAttribute('data-prodi');
      currentMkKode = opt.getAttribute('data-kode');
      currentSKS = opt.getAttribute('data-sks');
      const semester = opt.getAttribute('data-semester');

      const container = document.getElementById('rpsContainer');

      // Load existing
      const existingSnap = await db.collection('silabus').where('mkId', '==', currentMkId).where('dosenId', '==', user.uid).get();
      const existingMap = {};
      let rpsMeta = {};
      existingSnap.forEach(doc => {
        const d = doc.data();
        if (d.pekan) existingMap[d.pekan] = { id: doc.id, ...d };
        if (d.type === 'meta') rpsMeta = { id: doc.id, ...d };
      });

      let html = '';

      // HEADER RPS
      html += '<div class="card">';
      html += '<div class="card-title"><i class="fa-solid fa-file-alt"></i> RENCANA PEMBELAJARAN SEMESTER (RPS)</div>';
      
      // Info MK
      html += '<div class="info-row">';
      html += `<div class="info-chip"><i class="fa-solid fa-book"></i> ${currentMkKode||''} - ${currentMkNama}</div>`;
      html += `<div class="info-chip"><i class="fa-solid fa-users"></i> ${currentKelasNama}</div>`;
      html += `<div class="info-chip"><i class="fa-solid fa-clock"></i> ${currentSKS} SKS</div>`;
      html += `<div class="info-chip"><i class="fa-solid fa-calendar-check"></i> ${currentTotalPertemuan} Pertemuan</div>`;
      html += '</div>';

      // Form meta RPS
      html += '<div class="form-group"><label>📋 Deskripsi Mata Kuliah</label><textarea id="rpsDeskripsi" placeholder="Deskripsi singkat mata kuliah...">' + (rpsMeta.deskripsi || '') + '</textarea></div>';
      html += '<div class="form-group"><label>🎯 Capaian Pembelajaran (CPL-Prodi / CPMK)</label><textarea id="rpsCapaian" placeholder="Capaian pembelajaran yang dibebankan pada mata kuliah...">' + (rpsMeta.capaian || '') + '</textarea></div>';
      html += '<div class="form-group"><label>📚 Referensi / Pustaka</label><textarea id="rpsReferensi" placeholder="Buku, artikel, atau sumber belajar...">' + (rpsMeta.referensi || '') + '</textarea></div>';
      html += '</div>';

      // TABEL RPS
      html += '<div class="card">';
      html += '<div class="card-title"><i class="fa-solid fa-table"></i> Rincian Per Pekan</div>';
      html += '<div style="overflow-x:auto;"><table><thead><tr>';
      html += '<th style="width:40px;">Pekan</th><th style="width:80px;">Tanggal</th>';
      html += '<th style="width:150px;">Kemampuan Akhir (Sub-CPMK)</th>';
      html += '<th style="width:150px;">Materi / Bahan Kajian</th>';
      html += '<th style="width:100px;">Metode Pembelajaran</th>';
      html += '<th style="width:50px;">Waktu (menit)</th>';
      html += '<th style="width:50px;">Bobot (%)</th>';
      html += '<th style="width:40px;">Aksi</th>';
      html += '</tr></thead><tbody>';

      for (let i = 1; i <= currentTotalPertemuan; i++) {
        const ex = existingMap[i] || {};
        html += `<tr>
          <td><strong>${i}</strong></td>
          <td><input type="date" id="tgl_${i}" value="${ex.tanggal || ''}"></td>
          <td><textarea id="capaian_${i}" rows="1">${ex.subCapaian || ''}</textarea></td>
          <td><textarea id="materi_${i}" rows="1">${ex.materi || ''}</textarea></td>
          <td><input type="text" id="metode_${i}" value="${ex.metode || ''}" placeholder="Ceramah, Diskusi..."></td>
          <td><input type="number" id="waktu_${i}" value="${ex.waktu || '50'}" min="1"></td>
          <td><input type="number" id="bobot_${i}" value="${ex.bobot || ''}" min="0" max="100" placeholder="%"></td>
          <td>${ex.id ? `<button class="btn btn-danger btn-sm" onclick="hapusRPS('${ex.id}')"><i class="fa-solid fa-trash"></i></button>` : '-'}</td>
        </tr>`;
      }

      html += '</tbody></table></div>';
      html += '<div style="display:flex;gap:8px;margin-top:12px;">';
      html += '<button class="btn btn-primary" onclick="simpanRPS()"><i class="fa-solid fa-save"></i> Simpan RPS</button>';
      html += '<button class="btn btn-outline" onclick="cetakRPS()"><i class="fa-solid fa-print"></i> Cetak</button>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;
    };

    window.simpanRPS = async function() {
      const batch = db.batch();
      let count = 0;

      // Simpan meta
      const deskripsi = document.getElementById('rpsDeskripsi')?.value || '';
      const capaian = document.getElementById('rpsCapaian')?.value || '';
      const referensi = document.getElementById('rpsReferensi')?.value || '';

      // Simpan per pekan
      for (let i = 1; i <= currentTotalPertemuan; i++) {
        const materi = document.getElementById(`materi_${i}`)?.value?.trim() || '';
        const subCapaian = document.getElementById(`capaian_${i}`)?.value?.trim() || '';
        const tanggal = document.getElementById(`tgl_${i}`)?.value || '';
        const metode = document.getElementById(`metode_${i}`)?.value?.trim() || '';
        const waktu = parseInt(document.getElementById(`waktu_${i}`)?.value) || 0;
        const bobot = parseInt(document.getElementById(`bobot_${i}`)?.value) || 0;

        if (!materi && !subCapaian && !tanggal) continue;

        const existingSnap = await db.collection('silabus')
          .where('mkId', '==', currentMkId)
          .where('dosenId', '==', user.uid)
          .where('pekan', '==', i)
          .get();

        const data = {
          mkId: currentMkId, mkNama: currentMkNama, mkKode: currentMkKode,
          kelasId: currentKelasId, kelasNama: currentKelasNama,
          prodiNama: currentProdiNama, sks: currentSKS,
          dosenId: user.uid, dosenNama: user.nama,
          pekan: i, tanggal, materi, subCapaian, metode, waktu, bobot,
          deskripsi, capaian, referensi,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (!existingSnap.empty) {
          batch.update(existingSnap.docs[0].ref, data);
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          batch.set(db.collection('silabus').doc(), data);
        }
        count++;
      }

      if (count === 0) { alert('Tidak ada data!'); return; }
      await batch.commit();
      showAlert(`✅ ${count} pekan RPS berhasil disimpan!`);
      loadRPS();
    };

    window.hapusRPS = async function(id) {
      if (!confirm('Hapus data pekan ini?')) return;
      await db.collection('silabus').doc(id).delete();
      showAlert('Data dihapus!');
      loadRPS();
    };

    window.cetakRPS = function() { window.print(); };

    loadPage();
  </script>
</body>
</html>
