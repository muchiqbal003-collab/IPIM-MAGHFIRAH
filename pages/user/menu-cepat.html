<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Menu Cepat - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--gold-light:#fffbee;
      --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
      --gray-200:#d1ead8;--gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--blue:#1565c0;--blue-light:#e3f2fd;
      --orange:#e65100;--orange-light:#fff3e0;
      --purple:#6a1b9a;--purple-light:#f3e5f5;
      --teal:#00695c;--teal-light:#e0f2f1;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.3s ease;--header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
      color: var(--gray-800); padding-top: var(--header-height);
      padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent; min-height: 100vh;
    }

    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, #003d33 0%, #006644 100%);
      color: white; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,61,51,0.35);
    }
    .btn-back {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      color: white; font-size: 16px; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .app-header h3 { font-size: 16px; font-weight: 700; flex: 1; }

    .content { padding: 14px; max-width: 600px; margin: 0 auto; }

    /* Search */
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap input {
      width: 100%; padding: 12px 16px 12px 42px;
      border: none; border-radius: 40px;
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06);
      font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--gray-800); outline: none; transition: var(--transition);
    }
    .search-wrap input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,168,89,0.1); }
    .search-wrap input::placeholder { color: var(--gray-600); }
    .search-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gray-600); font-size: 16px; }

    /* Section */
    .section-wrapper { margin-bottom: 18px; }
    .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .section-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .section-icon.umum { background: var(--blue-light); color: var(--blue); }
    .section-icon.akademik { background: var(--green-light); color: var(--green-dark); }
    .section-icon.halaqoh { background: var(--orange-light); color: var(--orange); }
    .section-label { font-size: 13px; font-weight: 700; color: var(--gray-800); }
    .section-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--gray-200); color: var(--gray-600); margin-left: auto; }

    /* Menu Grid */
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .menu-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius); padding: 16px 8px 12px; text-align: center;
      cursor: pointer; transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 1px 3px rgba(0,61,51,0.04); position: relative;
    }
    .menu-card:active { transform: scale(0.95); background: rgba(255,255,255,0.9); }
    .menu-card.favorite { border: 2px solid var(--gold); }
    .menu-card.favorite::after { content: '⭐'; position: absolute; top: 6px; right: 8px; font-size: 12px; }
    .menu-icon { width: 42px; height: 42px; border-radius: 12px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .menu-icon.green { background: var(--green-light); color: #1b5e20; }
    .menu-icon.blue { background: var(--blue-light); color: var(--blue); }
    .menu-icon.orange { background: var(--orange-light); color: var(--orange); }
    .menu-icon.purple { background: var(--purple-light); color: var(--purple); }
    .menu-icon.teal { background: var(--teal-light); color: var(--teal); }
    .menu-icon.gold { background: var(--gold-light); color: #b8860b; }
    .menu-label { font-size: 11px; font-weight: 600; color: var(--gray-800); line-height: 1.3; }
    .menu-sub { font-size: 9px; color: var(--gray-600); margin-top: 2px; }

    .no-result { text-align: center; padding: 30px; color: var(--gray-600); font-size: 13px; display: none; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px; display: flex; align-items: center; justify-content: space-around;
      z-index: 100; box-shadow: 0 8px 32px rgba(0, 61, 51, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 0 8px; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600); cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; }
    .nav-item.active i { color: var(--green); filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3)); }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: var(--green); border-radius: 0 0 4px 4px; }

    @media (max-width: 360px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; } .menu-card { padding: 12px 4px 10px; } .menu-icon { width: 36px; height: 36px; font-size: 15px; } .menu-label { font-size: 10px; } }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="goTo('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
    <h3 data-lang="menuCepat">Menu Cepat</h3>
  </header>

  <div class="content">
    <!-- Search -->
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" data-lang-placeholder="cariMenu" placeholder="Cari menu..." onkeyup="filterMenu()">
    </div>

    <div id="menuContainer"></div>
    <div class="no-result" id="noResult">
      <i class="fa-solid fa-search" style="font-size:30px;opacity:0.3;display:block;margin-bottom:10px;"></i>
      <span data-lang="noMenuFound">Tidak ada menu ditemukan</span>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span data-lang="home">Home</span></div>
    <div class="nav-item" onclick="goTo('kalender.html')"><i class="fa-solid fa-calendar-days"></i><span data-lang="kalender">Kalender</span></div>
    <div class="nav-item active" onclick="goTo('menu-cepat.html')"><i class="fa-solid fa-grip"></i><span data-lang="menu">Menu</span></div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span data-lang="rekap">Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span data-lang="profil">Profil</span></div>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/lang.js"></script>
  <script>
    const user = checkRole(['dosen', 'musyrif', 'dosen-musyrif', 'umum']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    // ═══ MENU DEFINITIONS ═══
    const menuUmum = [
      { id:'absensi-sholat', icon:'fa-mosque', color:'blue', labelKey:'absensiSholat', page:'absensi.html', subKey:'absensiSholatSub', section:'umum' },
      { id:'kinerjaku', icon:'fa-chart-line', color:'green', labelKey:'kinerjaku', page:'kinerja.html', subKey:'kinerjakuSub', section:'umum' },
    ];

    const menuAkademik = [
      { id:'jadwal-saya', icon:'fa-calendar-alt', color:'blue', labelKey:'jadwalSaya', page:'jadwal-saya.html', subKey:'jadwalSayaSub', section:'akademik' },
      { id:'input-nilai', icon:'fa-chart-line', color:'orange', labelKey:'inputNilai', page:'nilai.html', subKey:'inputNilaiSub', section:'akademik' },
      { id:'absensi-mk', icon:'fa-clipboard-check', color:'teal', labelKey:'absensiMK', page:'rekap-absensi-kelas.html', subKey:'absensiMKSub', section:'akademik' },
      { id:'mahasiswa-pa', icon:'fa-user-graduate', color:'purple', labelKey:'mahasiswaPA', page:'mahasiswa-bimbingan.html', subKey:'mahasiswaPASub', section:'akademik' },
      { id:'silabus', icon:'fa-file-alt', color:'green', labelKey:'silabus', page:'silabus.html', subKey:'silabusSub', section:'akademik' },
      { id:'pencapaian', icon:'fa-pen-to-square', color:'teal', labelKey:'pencapaian', page:'pencapaian.html', subKey:'pencapaianSub', section:'akademik' },
    ];

    const menuHalaqoh = [
      { id:'anggota-halaqoh', icon:'fa-users', color:'orange', labelKey:'anggotaHalaqoh', page:'anggota-halaqohku.html', subKey:'anggotaHalaqohSub', section:'halaqoh' },
      { id:'absensi-halaqoh', icon:'fa-clipboard-check', color:'green', labelKey:'absensiHalaqoh', page:'absensi-halaqoh.html', subKey:'absensiHalaqohSub', section:'halaqoh' },
      { id:'setoran-hafalan', icon:'fa-book-open', color:'purple', labelKey:'setoranHafalan', page:'hafalan.html', subKey:'setoranHafalanSub', section:'halaqoh' },
      { id:'ujian-quran', icon:'fa-quran', color:'gold', labelKey:'ujianQuran', page:'ujian-quran.html', subKey:'ujianQuranSub', section:'halaqoh' },
      { id:'rekap-halaqoh', icon:'fa-chart-simple', color:'blue', labelKey:'rekapHalaqoh', page:'rekap-halaqoh.html', subKey:'rekapHalaqohSub', section:'halaqoh' },
    ];

    // Gabung menu sesuai role
    let allMenus = [...menuUmum];
    if (user.role === 'dosen' || user.role === 'dosen-musyrif') allMenus = [...allMenus, ...menuAkademik];
    if (user.role === 'musyrif' || user.role === 'dosen-musyrif') allMenus = [...allMenus, ...menuHalaqoh];

    // Favorit — maksimal 3
    function getFavorites() { try { return JSON.parse(localStorage.getItem('menuFavorites') || '[]'); } catch { return []; } }
    function saveFavorite(id) {
      let favs = getFavorites().filter(f => f !== id);
      favs.unshift(id);
      if (favs.length > 3) favs = favs.slice(0, 3); // ⬅️ MAKS 3
      localStorage.setItem('menuFavorites', JSON.stringify(favs));
    }

    const sectionLabels = { umum: 'menuUmum', akademik: 'akademik', halaqoh: 'halaqohTahfidz' };
    const sectionIcons = { umum: 'fa-grip', akademik: 'fa-book-open', halaqoh: 'fa-mosque' };
    const sectionIconClasses = { umum: 'umum', akademik: 'akademik', halaqoh: 'halaqoh' };

    function renderMenus(filterText = '') {
      const container = document.getElementById('menuContainer');
      const noResult = document.getElementById('noResult');
      const search = filterText.toLowerCase().trim();

      let filtered = allMenus;
      if (search) {
        filtered = allMenus.filter(m => 
          t(m.labelKey).toLowerCase().includes(search) || 
          t(m.subKey).toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = '';
        noResult.style.display = 'block';
        return;
      }
      noResult.style.display = 'none';

      const favs = getFavorites();
      const favMenus = filtered.filter(m => favs.includes(m.id));
      const nonFavMenus = filtered.filter(m => !favs.includes(m.id));

      const sections = {};
      [...favMenus, ...nonFavMenus].forEach(m => {
        const sec = m.section || 'umum';
        if (!sections[sec]) sections[sec] = [];
        if (!sections[sec].find(x => x.id === m.id)) sections[sec].push(m);
      });

      let html = '';
      // Favorit section
      if (favMenus.length > 0) {
        html += buildSectionHTML('fa-star', 'halaqoh', '⭐ ' + t('favorit'), favMenus);
      }

      // Section lainnya (tanpa menu yang sudah di favorit)
      for (const [sec, items] of Object.entries(sections)) {
        const nonFav = items.filter(m => !favs.includes(m.id));
        if (nonFav.length > 0) {
          html += buildSectionHTML(sectionIcons[sec], sectionIconClasses[sec], t(sectionLabels[sec]), nonFav);
        }
      }

      container.innerHTML = html;
    }

    function buildSectionHTML(iconClass, iconColorClass, label, items) {
      if (!items || items.length === 0) return '';
      return `
        <div class="section-wrapper">
          <div class="section-header">
            <div class="section-icon ${iconColorClass}"><i class="fa-solid ${iconClass}"></i></div>
            <span class="section-label">${label}</span>
            <span class="section-badge">${items.length}</span>
          </div>
          <div class="menu-grid">
            ${items.map(m => `
              <div class="menu-card ${getFavorites().includes(m.id) ? 'favorite' : ''}" onclick="goTo('${m.page}'); saveFavorite('${m.id}'); renderMenus();">
                <div class="menu-icon ${m.color}"><i class="fa-solid ${m.icon}"></i></div>
                <div class="menu-label">${t(m.labelKey)}</div>
                <div class="menu-sub">${t(m.subKey)}</div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    window.filterMenu = function() {
      renderMenus(document.getElementById('searchInput').value);
    };

    // Init
    renderMenus();

    // Multi-bahasa
    if (typeof applyLang === 'function') {
      setTimeout(applyLang, 200);
    }
  </script>
</body>
</html>
