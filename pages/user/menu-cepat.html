<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>IPIM - Menu Cepat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--gold-light:#fffbee;
      --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
      --gray-200:#d1ead8;--gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--blue:#1565c0;--blue-light:#e3f2fd;
      --orange:#e65100;--orange-light:#fff3e0;
      --purple:#6a1b9a;--purple-light:#f3e5f5;
      --teal:#00695c;--teal-light:#e0f2f1;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.3s ease;--header-height:56px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #d4edda 25%, #f0faf5 50%, #e8f0ea 75%, #f9f9f9 100%);
      background-attachment: fixed;
      color: var(--gray-800); 
      padding-top: var(--header-height);
      padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent; 
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    body.lang-ar {
      font-family: 'Noto Sans Arabic', 'Plus Jakarta Sans', sans-serif;
      direction: rtl;
    }
    
    /* Animated Background Ornaments */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 168, 89, 0.05) 0%, transparent 70%);
      animation: floatBg 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      left: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(245, 200, 66, 0.04) 0%, transparent 70%);
      animation: floatBg 25s ease-in-out infinite reverse;
      pointer-events: none;
      z-index: 0;
    }
    
    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    /* Header */
    .app-header { 
      position: fixed; 
      top: 0; left: 0; right: 0; z-index: 1000; 
      background: rgba(0, 61, 51, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: white; 
      padding: 12px 16px; 
      display: flex; align-items: center; gap: 12px; 
      box-shadow: 0 4px 30px rgba(0,61,51,0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .btn-back { 
      background: rgba(255,255,255,0.12); 
      border: 1px solid rgba(255,255,255,0.2); 
      color: white; font-size: 16px; 
      width: 36px; height: 36px; border-radius: 50%; 
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .btn-back:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
    
    .app-header h3 { 
      font-size: 16px; font-weight: 700; flex: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    
    .btn-lang {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .btn-lang:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }

    .content { 
      padding: 16px; 
      max-width: 600px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* Search */
    .search-wrap { 
      position: relative; 
      margin-bottom: 4px;
      animation: slideDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    body.lang-ar .search-wrap input {
      padding: 14px 50px 14px 20px;
      text-align: right;
    }
    
    body.lang-ar .search-wrap i {
      left: auto;
      right: 20px;
    }
    
    .search-wrap input {
      width: 100%; 
      padding: 14px 20px 14px 50px;
      border: none; 
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 8px 32px rgba(0, 61, 51, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      font-size: 14px; 
      font-family: inherit;
      font-weight: 500;
      color: var(--gray-800); 
      outline: none; 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .search-wrap input:focus { 
      border-color: var(--green);
      box-shadow: 
        0 8px 40px rgba(0, 168, 89, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 0 0 4px rgba(0, 168, 89, 0.1);
    }
    
    .search-wrap i { 
      position: absolute; left: 20px; top: 50%; 
      transform: translateY(-50%); 
      color: var(--green-mid); 
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .search-wrap input:focus ~ i {
      color: var(--green);
      transform: translateY(-50%) scale(1.2);
    }

    /* Search Results */
    .search-results {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 16px 48px rgba(0, 61, 51, 0.15);
      max-height: 400px;
      overflow-y: auto;
      z-index: 50;
    }
    
    .search-results.show {
      display: block;
      animation: fadeInUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .search-result-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 1px solid rgba(0, 61, 51, 0.05);
    }
    
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: rgba(0, 168, 89, 0.05); }
    
    .search-result-item .result-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    
    .search-result-item .result-info { flex: 1; }
    
    .search-result-item .result-name {
      font-size: 13px; font-weight: 700; color: #1a3c34;
    }
    
    .search-result-item .result-category {
      font-size: 10px; color: var(--gray-600); margin-top: 2px;
    }
    
    .no-results {
      padding: 20px; text-align: center; color: var(--gray-600); font-size: 13px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Icon Cards */
    .icon-row { 
      display: flex; gap: 12px;
      animation: fadeInUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both;
    }
    
    .icon-card {
      flex: 1; 
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-lg);
      padding: 20px 12px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 4px 16px rgba(0, 61, 51, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }
    
    .icon-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, 
        rgba(255, 255, 255, 0.3) 0%, 
        rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    
    .icon-card:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 8px 24px rgba(0, 61, 51, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border-color: rgba(255, 255, 255, 0.6);
    }
    
    .icon-card:active { 
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease;
    }
    
    .icon-card .icn {
      width: 52px; height: 52px; 
      border-radius: 16px; 
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center; 
      font-size: 22px;
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 12px rgba(0, 61, 51, 0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .icon-card:hover .icn {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 6px 20px rgba(0, 61, 51, 0.12);
    }
    
    .icn.blue { background: rgba(21, 101, 192, 0.1); color: var(--blue); border-color: rgba(21, 101, 192, 0.2); }
    .icn.green { background: rgba(0, 168, 89, 0.1); color: #1b5e20; border-color: rgba(0, 168, 89, 0.2); }
    .icn.orange { background: rgba(230, 81, 0, 0.1); color: var(--orange); border-color: rgba(230, 81, 0, 0.2); }
    
    .icon-card .lbl { 
      font-size: 13px; font-weight: 700; 
      color: #1a3c34;
      position: relative; z-index: 1;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      margin-bottom: 3px;
    }
    .icon-card .sub { 
      font-size: 10px; 
      color: var(--gray-600);
      opacity: 0.7;
      position: relative; z-index: 1;
    }

    /* Big Cards */
    .big-card-row { 
      display: flex; flex-direction: column; gap: 12px;
      animation: fadeInUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
    }
    
    .big-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-lg);
      padding: 24px 20px; 
      cursor: pointer; 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 4px 16px rgba(0, 61, 51, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      display: flex; align-items: center; gap: 16px;
      position: relative;
      overflow: hidden;
    }
    
    .big-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, 
        rgba(255, 255, 255, 0.3) 0%, 
        rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    
    .big-card:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 8px 24px rgba(0, 61, 51, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border-color: rgba(255, 255, 255, 0.6);
    }
    
    .big-card:active { 
      transform: scale(0.97);
      transition: all 0.15s ease;
    }
    
    .big-card.akademik { border-left: 4px solid rgba(0, 168, 89, 0.4); }
    .big-card.halaqoh { border-left: 4px solid rgba(230, 81, 0, 0.4); }
    
    body.lang-ar .big-card.akademik { 
      border-left: none;
      border-right: 4px solid rgba(0, 168, 89, 0.4);
    }
    body.lang-ar .big-card.halaqoh { 
      border-left: none;
      border-right: 4px solid rgba(230, 81, 0, 0.4);
    }
    
    .big-icon {
      width: 64px; height: 64px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; 
      font-size: 28px; flex-shrink: 0;
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 12px rgba(0, 61, 51, 0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .big-card:hover .big-icon {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 6px 20px rgba(0, 61, 51, 0.12);
    }
    
    .big-icon.akademik { background: rgba(0, 168, 89, 0.1); color: #1b5e20; border-color: rgba(0, 168, 89, 0.2); }
    .big-icon.halaqoh { background: rgba(230, 81, 0, 0.1); color: var(--orange); border-color: rgba(230, 81, 0, 0.2); }
    
    .big-info { flex: 1; position: relative; z-index: 1; }
    .big-info h4 { 
      font-size: 16px; font-weight: 800; 
      color: #1a3c34;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    .big-info p { 
      font-size: 11px; 
      color: var(--gray-600);
      line-height: 1.5;
      opacity: 0.7;
    }
    
    .big-arrow { 
      font-size: 18px; 
      color: var(--gray-600);
      position: relative; z-index: 1;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .big-card:hover .big-arrow {
      transform: translateX(4px);
      color: var(--green);
    }
    
    body.lang-ar .big-card:hover .big-arrow {
      transform: translateX(-4px);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(255,255,255,0.72); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); 
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px; 
      display: flex; align-items: center; justify-content: space-around; 
      z-index: 100;
      box-shadow: 
        0 8px 32px rgba(0,61,51,0.1), 
        0 2px 8px rgba(0,0,0,0.06), 
        inset 0 1px 0 rgba(255,255,255,0.8);
      padding: 0 8px; 
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600); 
      cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; 
      border-radius: 18px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      position: relative; 
    }
    .nav-item i { font-size: 20px; transition: all 0.3s ease; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; }
    .nav-item.active i { 
      color: var(--green); 
      filter: drop-shadow(0 2px 4px rgba(0,168,89,0.3)); 
    }
    .nav-item.active::before { 
      content: ''; position: absolute; top: 2px; width: 28px; height: 3px; 
      background: var(--green); border-radius: 0 0 4px 4px; 
    }

    /* Responsive */
    @media (min-width: 768px) {
      .content { max-width: 600px; }
    }
    
    @media (max-width: 360px) { 
      .icon-card { padding: 14px 8px; } 
      .big-icon { width: 50px; height: 50px; font-size: 22px; }
      .big-card { padding: 18px 14px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="goTo('dashboard.html')">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h3 data-lang="menuCepat">⚡ Menu Cepat</h3>
    <button class="btn-lang" onclick="cycleLang()" title="Ganti Bahasa">
      <span id="langIndicator">🌐</span>
    </button>
  </header>

  <div class="content">
    <!-- Search Bar -->
    <div class="search-wrap" id="searchWrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" data-lang-placeholder="cariMenu" placeholder="🔍 Cari menu apa saja..." onkeyup="filterMenu()" onfocus="showResults()" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 3 Icon Cards -->
    <div class="icon-row">
      <div class="icon-card" onclick="goTo('absensi.html')">
        <div class="icn blue"><i class="fa-solid fa-mosque"></i></div>
        <div class="lbl" data-lang="absensiSholat">Absensi Sholat</div>
        <div class="sub" data-lang="absensiSholatSub">Catat sholat wajib</div>
      </div>
      <div class="icon-card" onclick="goTo('kinerja.html')">
        <div class="icn green"><i class="fa-solid fa-clipboard-list"></i></div>
        <div class="lbl" data-lang="kinerjaku">Kinerjaku</div>
        <div class="sub" data-lang="kinerjakuSub">Lihat statistik</div>
      </div>
      <div class="icon-card" onclick="goTo('rekap-tidak-hadir-kelas.html')">
        <div class="icn orange"><i class="fa-solid fa-user-xmark"></i></div>
        <div class="lbl" data-lang="tidakHadir">Tidak Hadir</div>
        <div class="sub" data-lang="tidakHadirSub">Rekap harian</div>
      </div>
    </div>

    <!-- 2 Master Cards -->
    <div class="big-card-row">
      <!-- Card Akademik -->
      <div class="big-card akademik" onclick="goTo('menu-akademik.html')">
        <div class="big-icon akademik">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div class="big-info">
          <h4 data-lang="akademik">📚 Akademik</h4>
          <p data-lang="akademikSub">Jadwal, absensi kelas, nilai, mahasiswa PA, silabus & pencapaian</p>
        </div>
        <i class="fa-solid fa-chevron-right big-arrow"></i>
      </div>

      <!-- Card Halaqoh -->
      <div class="big-card halaqoh" onclick="goTo('menu-halaqoh.html')">
        <div class="big-icon halaqoh">
          <i class="fa-solid fa-mosque"></i>
        </div>
        <div class="big-info">
          <h4 data-lang="halaqohTahfidz">🕌 Halaqoh & Tahfidz</h4>
          <p data-lang="halaqohTahfidzSub">Anggota, absensi, setoran hafalan, ujian Quran & rekap progress</p>
        </div>
        <i class="fa-solid fa-chevron-right big-arrow"></i>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')">
      <i class="fa-solid fa-house"></i>
      <span data-lang="home">Home</span>
    </div>
    <div class="nav-item" onclick="goTo('kalender.html')">
      <i class="fa-solid fa-calendar-days"></i>
      <span data-lang="kalender">Kalender</span>
    </div>
    <div class="nav-item active" onclick="goTo('menu-cepat.html')">
      <i class="fa-solid fa-grip"></i>
      <span data-lang="menu">Menu</span>
    </div>
    <div class="nav-item" onclick="goTo('rekap.html')">
      <i class="fa-solid fa-chart-simple"></i>
      <span data-lang="rekap">Rekap</span>
    </div>
    <div class="nav-item" onclick="goTo('profil.html')">
      <i class="fa-solid fa-circle-user"></i>
      <span data-lang="profil">Profil</span>
    </div>
  </nav>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/lang.js"></script>
  <script>
    const user = checkRole(['dosen', 'musyrif', 'dosen-musyrif', 'umum']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    // ═══ MULTI LANGUAGE ═══
    function cycleLang() {
      const langs = ['id', 'en', 'ar'];
      const current = getLang();
      const nextIndex = (langs.indexOf(current) + 1) % langs.length;
      setLang(langs[nextIndex]);
      updateLangIndicator();
      // Re-run search if active
      if (document.getElementById('searchInput').value.trim() !== '') {
        filterMenu();
      }
    }
    
    function updateLangIndicator() {
      const lang = getLang();
      const indicator = document.getElementById('langIndicator');
      if (lang === 'id') indicator.textContent = '🇮🇩';
      else if (lang === 'en') indicator.textContent = '🇬🇧';
      else if (lang === 'ar') indicator.textContent = '🇸🇦';
    }
    
    updateLangIndicator();

    // ═══ ALL MENU DATA ═══
    const allMenus = [
      // Menu Umum
      { nameKey: 'absensiSholat', categoryKey: 'menuUmum', icon: 'fa-mosque', color: 'blue', url: 'absensi.html' },
      { nameKey: 'kinerjaku', categoryKey: 'menuUmum', icon: 'fa-clipboard-list', color: 'green', url: 'kinerja.html' },
      { nameKey: 'tidakHadir', categoryKey: 'menuUmum', icon: 'fa-user-xmark', color: 'orange', url: 'rekap-tidak-hadir-kelas.html' },
      
      // Menu Akademik
      { nameKey: 'jadwalSaya', categoryKey: 'akademik', icon: 'fa-calendar-alt', color: 'blue', url: 'jadwal-saya.html' },
      { nameKey: 'absensiMK', categoryKey: 'akademik', icon: 'fa-clipboard-check', color: 'teal', url: 'rekap-absensi-kelas.html' },
      { nameKey: 'inputNilai', categoryKey: 'akademik', icon: 'fa-star', color: 'orange', url: 'nilai.html' },
      { nameKey: 'rekapNilai', categoryKey: 'akademik', icon: 'fa-chart-line', color: 'purple', url: 'rekap-nilai-matkul.html' },
      { nameKey: 'mahasiswaPA', categoryKey: 'akademik', icon: 'fa-user-graduate', color: 'green', url: 'mahasiswa-bimbingan.html' },
      { nameKey: 'silabus', categoryKey: 'akademik', icon: 'fa-file-alt', color: 'teal', url: 'silabus.html' },
      { nameKey: 'pencapaian', categoryKey: 'akademik', icon: 'fa-pen-to-square', color: 'gold', url: 'pencapaian.html' },
      { nameKey: 'izinDosen', categoryKey: 'akademik', icon: 'fa-calendar-xmark', color: 'red', url: 'izin-dosen.html' },
      
      // Menu Halaqoh
      { nameKey: 'anggotaHalaqoh', categoryKey: 'halaqohTahfidz', icon: 'fa-users', color: 'orange', url: 'anggota-halaqohku.html' },
      { nameKey: 'absensiHalaqoh', categoryKey: 'halaqohTahfidz', icon: 'fa-clipboard-check', color: 'green', url: 'absensi-halaqoh.html' },
      { nameKey: 'izinHalaqoh', categoryKey: 'halaqohTahfidz', icon: 'fa-clock', color: 'red', url: 'izin-musyrif.html' },
      { nameKey: 'setoranHafalan', categoryKey: 'halaqohTahfidz', icon: 'fa-book-open', color: 'purple', url: 'hafalan.html' },
      { nameKey: 'ujianQuran', categoryKey: 'halaqohTahfidz', icon: 'fa-quran', color: 'blue', url: 'ujian-quran.html' },
      { nameKey: 'rekapHalaqoh', categoryKey: 'halaqohTahfidz', icon: 'fa-chart-simple', color: 'gold', url: 'rekap-halaqoh.html' }
    ];

    // ═══ SEARCH FUNCTION ═══
    window.filterMenu = function() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      
      if (searchTerm === '') {
        resultsContainer.innerHTML = '';
        resultsContainer.classList.remove('show');
        return;
      }
      
      const filtered = allMenus.filter(menu => {
        const name = t(menu.nameKey).toLowerCase();
        const category = t(menu.categoryKey).toLowerCase();
        return name.includes(searchTerm) || category.includes(searchTerm);
      });
      
      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results" data-lang="noMenuFound">😔 ' + t('noMenuFound') + ' "' + searchTerm + '"</div>';
      } else {
        resultsContainer.innerHTML = filtered.map(menu => `
          <div class="search-result-item" onclick="goTo('${menu.url}')">
            <div class="result-icon" style="background: rgba(${getColorRGB(menu.color)}, 0.1); color: ${getColorHex(menu.color)};">
              <i class="fa-solid ${menu.icon}"></i>
            </div>
            <div class="result-info">
              <div class="result-name">${t(menu.nameKey)}</div>
              <div class="result-category">📁 ${t(menu.categoryKey)}</div>
            </div>
            <i class="fa-solid fa-chevron-right result-arrow"></i>
          </div>
        `).join('');
      }
      
      resultsContainer.classList.add('show');
    };
    
    window.showResults = function() {
      if (document.getElementById('searchInput').value.trim() !== '') {
        document.getElementById('searchResults').classList.add('show');
      }
    };
    
    // Helper functions for colors
    function getColorRGB(color) {
      const colors = {
        'blue': '21, 101, 192',
        'green': '0, 168, 89',
        'orange': '230, 81, 0',
        'purple': '106, 27, 154',
        'red': '229, 57, 53',
        'teal': '0, 105, 92',
        'gold': '245, 200, 66'
      };
      return colors[color] || '0, 168, 89';
    }
    
    function getColorHex(color) {
      const colors = {
        'blue': '#1565c0',
        'green': '#1b5e20',
        'orange': '#e65100',
        'purple': '#6a1b9a',
        'red': '#e53935',
        'teal': '#00695c',
        'gold': '#a08000'
      };
      return colors[color] || '#1b5e20';
    }
    
    // Close search results when clicking outside
    document.addEventListener('click', function(e) {
      const searchWrap = document.getElementById('searchWrap');
      if (!searchWrap.contains(e.target)) {
        document.getElementById('searchResults').classList.remove('show');
      }
    });

    // Multi-bahasa initialization
    if (typeof applyLang === 'function') setTimeout(applyLang, 200);
  </script>
</body>
</html>
