<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IPI Maghfirah - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--gold-light:#fffbee;
      --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
      --gray-200:#d1ead8;--gray-300:#cccccc;--gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--orange:#f57c00;--blue:#1565c0;--purple:#7b1fa2;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --header-max-height:130px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:#f0faf5;
      color:var(--gray-800);
      padding-top:calc(var(--header-max-height) + 16px);
      padding-bottom:100px;
      transition:padding-top 0.3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    body.scrolled{padding-top:16px;}
    body.lang-ar{
      font-family:'Noto Naskh Arabic','Noto Sans Arabic','Plus Jakarta Sans',sans-serif;
      direction:rtl;
    }
    body.lang-ar .motivasi-text {
      font-family: 'Noto Naskh Arabic', 'Amiri', serif !important;
      font-size: 15px;line-height: 2.2;font-style: normal;
    }
    body.lang-ar .motivasi-source {
      font-family: 'Noto Naskh Arabic', 'Amiri', serif !important;font-size: 12px;
    }

    /* ═══ HEADER ═══ */
    .app-header{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:rgba(0,61,51,0.85);
      backdrop-filter:blur(20px) saturate(180%);
      -webkit-backdrop-filter:blur(20px) saturate(180%);
      color:white;
      box-shadow:0 4px 30px rgba(0,61,51,0.2);
      border-bottom:1px solid rgba(255,255,255,0.1);
      transition:all 0.35s ease;
      overflow:hidden;
      height:var(--header-max-height);
    }
    .app-header.scrolled{height:0;opacity:0;pointer-events:none;}

    .header-inner{
      display:flex;align-items:center;gap:16px;
      padding:18px 18px 16px;
      height:100%;
    }
    .header-avatar{
      width:76px;height:76px;border-radius:50%;
      background:var(--gold);
      display:flex;align-items:center;justify-content:center;
      color:var(--green-dark);font-weight:800;font-size:28px;
      cursor:pointer;border:3px solid rgba(255,255,255,0.45);
      overflow:hidden;flex-shrink:0;
      box-shadow:0 6px 20px rgba(0,0,0,0.25);
    }
    .header-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .header-info{flex:1;min-width:0;}
    .header-greeting h2{
      font-size:17px;font-weight:700;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .header-greeting h2 span{color:var(--gold);}
    .header-greeting p{font-size:11px;opacity:0.75;margin-top:4px;}
    .header-date{margin-top:8px;font-size:10px;opacity:0.85;}

    .btn-lang-header{
      background:rgba(255,255,255,0.15);
      border:1px solid rgba(255,255,255,0.2);
      width:40px;height:40px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:white;font-size:16px;flex-shrink:0;
      transition:all 0.2s ease;
    }
    .btn-lang-header:active{transform:scale(0.92);}

    /* ═══ MAIN CONTENT ═══ */
    .main-content{padding:0 14px;display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto;}

    .card{
      background:var(--white);
      border-radius:var(--radius-lg);
      padding:16px;
      border:1px solid var(--gray-200);
      box-shadow:0 1px 4px rgba(0,61,51,0.04);
    }
    .card-title{
      font-size:13px;font-weight:700;color:var(--green-dark);
      margin-bottom:14px;display:flex;align-items:center;gap:7px;
    }
    .card-title i{font-size:15px;color:var(--green);}
    .card-title .label-right{margin-inline-start:auto;font-size:10px;color:var(--gray-600);font-weight:500;}

    /* Jadwal */
    .jadwal-list{display:flex;flex-direction:column;gap:10px;}
    .jadwal-item{
      display:flex;align-items:flex-start;gap:12px;
      padding:12px;
      background:var(--gray-50);
      border-radius:var(--radius-sm);
      border:1px solid var(--gray-100);
      flex-wrap:wrap;
    }
    .jadwal-jp{
      width:48px;height:48px;border-radius:12px;
      background:var(--green-mid);color:white;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;flex-shrink:0;
    }
    .jadwal-jp .jp-num{font-size:14px;line-height:1;}
    .jadwal-jp .jp-time{font-size:7px;opacity:0.9;margin-top:2px;}
    .jadwal-info{flex:1;min-width:0;}
    .jadwal-mk{
      font-size:13px;font-weight:700;color:#222;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .jadwal-kls{font-size:10px;color:var(--gray-600);margin-top:3px;}
    .jadwal-waktu{
      font-size:10px;color:var(--green-mid);font-weight:600;
      background:var(--green-light);
      padding:3px 8px;border-radius:12px;white-space:nowrap;
    }
    .jadwal-actions{
      display:flex;gap:6px;width:100%;justify-content:flex-end;
      margin-top:8px;padding-top:8px;
      border-top:1px dashed var(--gray-200);
    }
    .btn-absensi{
      background:var(--green-mid);color:white;
      border:none;padding:7px 14px;border-radius:20px;
      font-size:11px;font-family:inherit;font-weight:600;
      cursor:pointer;white-space:nowrap;text-decoration:none;
      display:inline-flex;align-items:center;gap:5px;
    }
    .btn-tugas{
      background:var(--gold);color:var(--green-dark);
      border:none;padding:7px 14px;border-radius:20px;
      font-size:11px;font-family:inherit;font-weight:700;
      cursor:pointer;white-space:nowrap;text-decoration:none;
      display:inline-flex;align-items:center;gap:5px;
    }

    /* Empty */
    .empty-jadwal{text-align:center;padding:20px 10px;}
    .empty-jadwal .empty-icon{
      font-size:36px;color:var(--gray-300);margin-bottom:10px;display:block;
    }
    .empty-jadwal p{font-size:12px;color:var(--gray-600);margin-bottom:14px;}
    .btn-atur-jadwal{
      background:var(--green-mid);color:white;
      border:none;padding:9px 20px;border-radius:20px;
      font-size:12px;font-family:inherit;font-weight:600;
      cursor:pointer;text-decoration:none;
      display:inline-flex;align-items:center;gap:6px;
    }

    /* ═══ MOTIVASI (GLASSMORPHISM) ═══ */
    .motivasi-card{
      background:linear-gradient(135deg,
        rgba(0,168,89,0.2) 0%,
        rgba(245,200,66,0.12) 100%);
      backdrop-filter:blur(24px) saturate(200%);
      -webkit-backdrop-filter:blur(24px) saturate(200%);
      border-radius:20px;
      padding:22px 20px 18px;
      border:1.5px solid rgba(255,255,255,0.6);
      box-shadow:
        0 10px 40px rgba(0,61,51,0.12),
        inset 0 1px 0 rgba(255,255,255,0.6),
        inset 0 -1px 0 rgba(255,255,255,0.2);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .motivasi-card::before{
      content:'❝';
      position:absolute;top:6px;left:16px;
      font-size:56px;color:rgba(255,255,255,0.5);
      line-height:1;font-family:Georgia,serif;
    }
    .motivasi-label{
      font-size:10px;font-weight:700;
      letter-spacing:0.15em;text-transform:uppercase;
      color:var(--green-mid);
      margin-bottom:14px;
      display:flex;align-items:center;justify-content:center;gap:6px;
      position:relative;z-index:1;
    }
    .motivasi-text{
      font-size:14px;font-weight:600;
      color:#1a3c34;line-height:1.7;font-style:italic;
      position:relative;z-index:1;
      transition:opacity 0.3s ease;
      padding:0 4px;min-height:60px;
      display:flex;align-items:center;justify-content:center;
    }
    .motivasi-source{
      font-size:11px;color:var(--green-dark);
      margin-top:12px;font-weight:700;
      position:relative;z-index:1;
      transition:opacity 0.3s ease;
    }
    .motivasi-nav{
      display:flex;align-items:center;justify-content:center;
      gap:12px;margin-top:16px;
      position:relative;z-index:1;
    }
    .motivasi-btn{
      width:30px;height:30px;border-radius:50%;
      background:rgba(255,255,255,0.5);
      border:1px solid rgba(255,255,255,0.6);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all 0.2s ease;
      color:var(--green-dark);font-size:11px;
    }
    .motivasi-btn:active{transform:scale(0.9);}
    .motivasi-dots{display:flex;gap:6px;align-items:center;}
    .motivasi-dot{
      width:6px;height:6px;border-radius:50%;
      background:rgba(0,61,51,0.2);cursor:pointer;
      transition:all 0.3s ease;
    }
    .motivasi-dot.active{background:var(--green-dark);width:18px;border-radius:4px;}

    /* ═══ BOTTOM NAV ═══ */
    .bottom-nav{
      position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
      width:calc(100% - 32px);max-width:420px;height:64px;
      background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.7);
      border-radius:24px;display:flex;align-items:center;justify-content:space-around;
      z-index:100;
      box-shadow:0 8px 32px rgba(0,61,51,0.1),0 2px 8px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8);
      padding:0 8px;padding-bottom:env(safe-area-inset-bottom);
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;font-size:10px;font-weight:500;color:var(--gray-600);
      cursor:pointer;text-decoration:none;padding:8px 0;flex:1;
      border-radius:18px;transition:all 0.3s;position:relative;
    }
    .nav-item i{font-size:20px;}
    .nav-item.active{color:var(--green-dark);font-weight:700;}
    .nav-item.active i{color:var(--green);filter:drop-shadow(0 2px 4px rgba(0,168,89,0.3));}
    .nav-item.active::before{
      content:'';position:absolute;top:2px;width:28px;height:3px;
      background:var(--green);border-radius:0 0 4px 4px;
    }

    @media(min-width:768px){.main-content{max-width:600px;margin:0 auto;}}
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <div class="header-avatar" onclick="goTo('profil.html')" id="headerAvatar">U</div>
      <div class="header-info">
        <div class="header-greeting">
          <h2 id="greetingText">Assalamu'alaikum, <span id="greetingName">...</span></h2>
          <p id="greetingSub">Semoga aktivitas hari ini dimudahkan Alloh</p>
        </div>
        <div class="header-date" id="headerDate">...</div>
      </div>
      <button class="btn-lang-header" onclick="cycleLang()">
        <span id="langIndicator">🇮🇩</span>
      </button>
    </div>
  </header>

  <main class="main-content">

    <!-- ═══ JADWAL HARI INI ═══ -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-calendar-day"></i>
        <span id="lblJadwal">Jadwal Mengajar Hari Ini</span>
        <span class="label-right" id="hariIniLabel"></span>
      </div>
      <div class="jadwal-list" id="jadwalList">
        <p style="font-size:12px;color:var(--gray-600);text-align:center;">Memuat jadwal...</p>
      </div>
    </div>

    <!-- ═══ MOTIVASI ═══ -->
    <div class="motivasi-card">
      <div class="motivasi-label">
        <i class="fa-solid fa-star"></i>
        <span id="lblMotivasi">Motivasi</span>
      </div>
      <div class="motivasi-text" id="motivasiText">Memuat...</div>
      <div class="motivasi-source" id="motivasiSource"></div>
      <div class="motivasi-nav">
        <button class="motivasi-btn" id="prevMotivasi"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="motivasi-dots" id="motivasiDots"></div>
        <button class="motivasi-btn" id="nextMotivasi"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span id="navHome">Home</span></div>
    <div class="nav-item" onclick="goTo('kalender.html')"><i class="fa-solid fa-calendar-days"></i><span id="navKalender">Kalender</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')"><i class="fa-solid fa-grip"></i><span id="navMenu">Menu</span></div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span id="navRekap">Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span id="navProfil">Profil</span></div>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/lang.js"></script>
  <script>
    const user = checkRole(['dosen','musyrif','dosen-musyrif','umum']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    let userPhotoURL = null;
    let jadwalHariIniCache = [];
    let autoPlayMotivasi = null;

    // ═══ LANGUAGE ═══
    function cycleLang() {
      const langs = ['id', 'en', 'ar'];
      const current = getLang();
      const nextIndex = (langs.indexOf(current) + 1) % langs.length;
      setLang(langs[nextIndex]);
      updateLangIndicator();
      applyLang();
    }
    function updateLangIndicator() {
      const lang = getLang();
      const el = document.getElementById('langIndicator');
      if (lang === 'id') el.textContent = '🇮🇩';
      else if (lang === 'en') el.textContent = '🇬🇧';
      else el.textContent = '🇸🇦';
    }
    updateLangIndicator();

    function applyLang() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.classList.toggle('lang-ar', lang === 'ar');

      const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      set('greetingSub', t('greetingSub') || 'Semoga aktivitas hari ini dimudahkan Alloh');
      set('lblJadwal', t('jadwalHariIni') || 'Jadwal Mengajar Hari Ini');
      set('lblMotivasi', t('motivasi') || 'Motivasi');
      set('navHome', t('home') || 'Home');
      set('navKalender', t('kalender') || 'Jadwal');
      set('navMenu', t('menu') || 'Menu');
      set('navRekap', t('rekap') || 'Rekap');
      set('navProfil', t('profil') || 'Profil');

      const grEl = document.getElementById('greetingText');
      if (grEl) grEl.childNodes[0].textContent = (t('greeting') || "Assalamu'alaikum") + ', ';

      renderJadwalHariIni();
    }

    // ═══ GREETING & TANGGAL ═══
    function getGreeting() {
      const hour = new Date().getHours();
      const lang = getLang();
      if (hour >= 4 && hour < 11) return { id: 'Selamat pagi', en: 'Good morning', ar: 'صباح الخير' }[lang];
      if (hour >= 11 && hour < 15) return { id: 'Selamat siang', en: 'Good afternoon', ar: 'طاب نهارك' }[lang];
      if (hour >= 15 && hour < 18) return { id: 'Selamat sore', en: 'Good evening', ar: 'مساء الخير' }[lang];
      return { id: 'Selamat malam', en: 'Good night', ar: 'ليلة سعيدة' }[lang];
    }

    function getDateStr() {
      const lang = getLang();
      const locale = lang === 'ar' ? 'ar-SA' : lang === 'en' ? 'en-US' : 'id-ID';
      return new Date().toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // PENTING: Firestore menyimpan nama hari dalam Bahasa Indonesia
    function getHariIndonesia() {
      const days = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return days[new Date().getDay()];
    }

    function getHariDisplay() {
      const names = {
        id: ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],
        en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
        ar: ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']
      };
      return names[getLang()][new Date().getDay()];
    }

    // ═══ FOTO PROFIL ═══
    async function loadUserPhoto() {
      try {
        const savedFoto = localStorage.getItem('fotoProfil_' + user.uid);
        if (savedFoto) { userPhotoURL = savedFoto; applyUserPhoto(); return; }
        if (user.photoURL) { userPhotoURL = user.photoURL; applyUserPhoto(); return; }
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          const data = userDoc.data();
          if (data.photoURL) userPhotoURL = data.photoURL;
          else if (data.photo) userPhotoURL = data.photo;
          else if (data.fotoProfil) userPhotoURL = data.fotoProfil;
        }
        applyUserPhoto();
      } catch(e) { console.error('Gagal load foto:', e); }
    }

    function applyUserPhoto() {
      const initial = (user.nama || 'U')[0].toUpperCase();
      const html = userPhotoURL 
        ? `<img src="${userPhotoURL}" alt="Foto" onerror="this.parentElement.innerHTML='${initial}'">`
        : initial;
      document.getElementById('headerAvatar').innerHTML = html;
    }

    // ═══ JADWAL HARI INI ═══
    async function loadJadwalHariIni() {
      const todayID = getHariIndonesia();
      try {
        const snap = await db.collection('jadwal').where('dosenId','==',user.uid).get();
        jadwalHariIniCache = snap.docs.map(d => ({id:d.id,...d.data()}))
          .filter(j => {
            if (!j.hari) return false;
            return String(j.hari).toLowerCase().trim() === todayID.toLowerCase();
          })
          .sort((a,b) => (a.jamKe||0) - (b.jamKe||0));
        renderJadwalHariIni();
      } catch(e) {
        console.error(e);
        document.getElementById('jadwalList').innerHTML = 
          '<p style="font-size:12px;color:red;text-align:center;">Gagal memuat jadwal</p>';
      }
    }

    function renderJadwalHariIni() {
      const list = document.getElementById('jadwalList');
      const hariLabel = document.getElementById('hariIniLabel');
      const todayID = getHariIndonesia();
      
      if (hariLabel) hariLabel.textContent = getHariDisplay();

      if (todayID === 'Jumat') {
        list.innerHTML = '<p style="font-size:12px;color:var(--gray-600);text-align:center;padding:16px;">Libur Jumat</p>';
        return;
      }

      if (user.role !== 'dosen' && user.role !== 'dosen-musyrif') {
        list.innerHTML = '<p style="font-size:12px;color:var(--gray-600);text-align:center;padding:16px;">Tidak ada jadwal</p>';
        return;
      }

      if (jadwalHariIniCache.length === 0) {
        const msg = t('tidakAdaJadwalHariIni') || 'Belum ada jadwal mengajar hari ini';
        const btnLabel = t('aturJadwal') || 'Atur Jadwal';
        list.innerHTML = `
          <div class="empty-jadwal">
            <i class="fa-solid fa-calendar-xmark empty-icon"></i>
            <p>${msg}</p>
            <button class="btn-atur-jadwal" onclick="goTo('jadwal-saya.html')">
              <i class="fa-solid fa-plus"></i> ${btnLabel}
            </button>
          </div>`;
        return;
      }

      const JP_WAKTU = {
        1: '07:15-08:05', 2: '08:10-09:00', 3: '09:05-09:55',
        4: '10:10-11:00', 5: '11:05-11:55',
        6: '13:00-13:50', 7: '13:55-14:45', 8: '14:50-15:40'
      };

      const absLabel = t('absensi') || 'Absensi';
      const tugasLabel = t('tugas') || 'Tugas';

      list.innerHTML = jadwalHariIniCache.map(j => {
        const jp = j.jamKe || 1;
        const waktu = j.waktu || JP_WAKTU[jp] || '';
        const waktuStart = waktu.split('-')[0] || '';
        
        // ═══ PARAMETER LENGKAP ═══
        const params = `jadwalId=${j.id}&kelasId=${j.kelasId || ''}&mapelId=${j.mkId || ''}`;
        
        return `
          <div class="jadwal-item">
            <div class="jadwal-jp">
              <span class="jp-num">JP${jp}</span>
              <span class="jp-time">${waktuStart}</span>
            </div>
            <div class="jadwal-info">
              <div class="jadwal-mk">${j.mkNama || '-'}</div>
              <div class="jadwal-kls">🏫 ${j.kelasNama || '-'}</div>
            </div>
            <div class="jadwal-waktu">${waktu}</div>
            <div class="jadwal-actions">
              <a href="absensi-kelas.html?${params}" class="btn-absensi">
                <i class="fa-solid fa-clipboard-check"></i> ${absLabel}
              </a>
              <a href="tugas.html?${params}" class="btn-tugas">
                <i class="fa-solid fa-pen-to-square"></i> ${tugasLabel}
              </a>
            </div>
          </div>`;
      }).join('');
    }

    // ═══ MOTIVASI ═══
    async function loadMotivasi() {
      const textEl = document.getElementById('motivasiText');
      const sourceEl = document.getElementById('motivasiSource');
      const dotsEl = document.getElementById('motivasiDots');
      const defaults = [
        {teks:'Barangsiapa menempuh jalan untuk mencari ilmu, Allah mudahkan baginya jalan menuju surga.',sumber:'HR. Muslim'},
        {teks:"Sebaik-baik kalian adalah yang belajar Al-Qur'an dan mengajarkannya.",sumber:'HR. Bukhari'}
      ];
      
      let motivasiList = [];
      let currentIndex = 0;
      
      try {
        const doc = await db.collection('pengaturan').doc('app').get();
        const data = doc.exists ? doc.data() : {};
        if (data.motivasi?.length) motivasiList = data.motivasi;
        else if (data.motivasiList?.length) motivasiList = data.motivasiList.map(m => typeof m==='string'?{teks:m,sumber:''}:m);
        else if (data.artikelMotivasi?.length) motivasiList = data.artikelMotivasi.map(m => typeof m==='string'?{teks:m,sumber:''}:m);
        else motivasiList = defaults;
      } catch(e) { motivasiList = defaults; }
      
      dotsEl.innerHTML = '';
      motivasiList.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'motivasi-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => { showMotivasi(i); resetAutoPlay(); };
        dotsEl.appendChild(dot);
      });
      
      function showMotivasi(index) {
        currentIndex = index;
        const m = motivasiList[index];
        const teks = typeof m === 'string' ? m : (m.teks || '');
        const src = typeof m === 'object' ? (m.sumber || '') : '';
        
        textEl.style.opacity = '0';
        sourceEl.style.opacity = '0';
        
        setTimeout(() => {
          textEl.textContent = '"' + teks + '"';
          sourceEl.textContent = src ? '— ' + src : '';
          textEl.style.opacity = '1';
          sourceEl.style.opacity = '1';
        }, 300);
        
        document.querySelectorAll('.motivasi-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });
      }
      
      textEl.style.transition = 'opacity 0.3s ease';
      sourceEl.style.transition = 'opacity 0.3s ease';
      
      document.getElementById('prevMotivasi').onclick = () => {
        showMotivasi(currentIndex > 0 ? currentIndex - 1 : motivasiList.length - 1);
        resetAutoPlay();
      };
      
      document.getElementById('nextMotivasi').onclick = () => {
        showMotivasi(currentIndex < motivasiList.length - 1 ? currentIndex + 1 : 0);
        resetAutoPlay();
      };
      
      function resetAutoPlay() {
        if (autoPlayMotivasi) clearInterval(autoPlayMotivasi);
        autoPlayMotivasi = setInterval(() => {
          showMotivasi((currentIndex + 1) % motivasiList.length);
        }, 8000);
      }
      
      showMotivasi(0);
      resetAutoPlay();
    }

    // ═══ SCROLL HEADER HIDE ═══
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY > 30;
      document.getElementById('appHeader').classList.toggle('scrolled', scrolled);
      document.body.classList.toggle('scrolled', scrolled);
    }, { passive: true });

    // ═══ INIT HEADER ═══
    function initHeader() {
      document.getElementById('greetingName').textContent = user.nama || 'User';
      document.getElementById('headerDate').textContent = getDateStr();
    }

    // ═══ INIT ═══
    (async function init() {
      await loadUserPhoto();
      initHeader();
      applyLang();
      await loadJadwalHariIni();
      await loadMotivasi();
    })();
  </script>
</body>
</html>
