<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Absensi Halaqoh - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--white:#ffffff;
      --gray-50:#f9f9f9;--gray-100:#f0f0f0;--gray-200:#d1ead8;
      --gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--amber:#d97706;--blue:#2563eb;--purple:#7c3aed;
      --orange:#f57c00;--orange-light:#fff3e0;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.2s ease;--header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%);
      color: var(--gray-800); padding-top: var(--header-height); padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent; min-height: 100vh;
    }

    .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #003d33 0%, #006644 100%); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,61,51,0.35); }
    .btn-back { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .header-info { flex: 1; }
    .header-info h3 { font-size: 15px; font-weight: 700; }
    .header-info .sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }

    .content { padding: 14px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .info-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); border-radius: var(--radius-lg);
      padding: 14px 16px; border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06);
    }
    .info-card .halaqoh-nama { font-size: 16px; font-weight: 800; color: var(--green-dark); }
    .info-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .info-chip { display: flex; align-items: center; gap: 5px; background: var(--green-light); border-radius: 20px; padding: 4px 10px; font-size: 10px; font-weight: 600; color: var(--green-dark); }
    .info-chip.warning { background: var(--orange-light); color: var(--orange); }

    .summary-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
      border-radius: var(--radius-lg); padding: 12px 16px;
      display: flex; gap: 0; border: 1px solid rgba(255,255,255,0.6);
    }
    .summary-item { flex: 1; text-align: center; }
    .summary-val { font-size: 20px; font-weight: 800; color: var(--green-dark); }
    .summary-lbl { font-size: 10px; color: var(--gray-600); margin-top: 2px; }

    .list-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 4px; }
    .list-header span { font-size: 12px; font-weight: 700; color: var(--green-dark); }
    .mark-all-btn { font-size: 11px; color: var(--green-mid); font-weight: 600; background: var(--green-light); border: none; cursor: pointer; padding: 4px 10px; border-radius: 20px; }

    .santri-list { display: flex; flex-direction: column; gap: 6px; }
    .santri-row {
      background: rgba(255, 255, 255, 0.7); border-radius: var(--radius);
      padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex; align-items: center; gap: 10px; transition: var(--transition);
    }
    .santri-num { width: 26px; height: 26px; border-radius: 50%; background: var(--green-light); color: var(--green-mid); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .santri-nama { flex: 1; font-size: 13px; font-weight: 600; }

    .status-select { padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; border: 1.5px solid var(--gray-200); background: white; cursor: pointer; outline: none; }
    .status-select.hadir { border-color: #10b981; background: #d1fae5; color: #065f46; }
    .status-select.sakit { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
    .status-select.izin { border-color: #3b82f6; background: #dbeafe; color: #1e40af; }
    .status-select.alfa { border-color: #ef4444; background: #fce4ec; color: #991b1b; }
    .status-select.jaga { border-color: #8b5cf6; background: #ede9fe; color: #6d28d9; }

    .btn-simpan {
      width: 100%; padding: 13px; border: none; border-radius: 40px;
      background: linear-gradient(135deg, #004d40, #006644); color: white;
      font-size: 14px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(0,61,51,0.3);
    }
    .btn-simpan:disabled { opacity: 0.6; }

    .halaqoh-card {
      background: rgba(255,255,255,0.5); border-radius: var(--radius-sm);
      padding: 14px; border: 1px solid rgba(255,255,255,0.5);
      cursor: pointer; transition: var(--transition); margin-bottom: 8px;
    }
    .halaqoh-card:active { background: rgba(255,255,255,0.9); transform: scale(0.98); }
    .halaqoh-card h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .halaqoh-card p { font-size: 11px; color: var(--gray-600); }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
    .badge-pengganti { background: var(--orange-light); color: var(--orange); }
    .badge-tetap { background: var(--green-light); color: var(--green-dark); }

    .info-box { background: #e3f2fd; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 12px; color: #1565c0; display: flex; align-items: center; gap: 8px; }
    .warning-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius-sm); padding: 16px; text-align: center; color: #856404; }

    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; border-radius: 20px; padding: 10px 20px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.3s; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; }

    .bottom-nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; height: 64px;
      background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px; display: flex; align-items: center; justify-content: space-around; z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 61, 51, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 0 8px; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600); cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; }
    .nav-item.active i { color: var(--green); filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3)); }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: var(--green); border-radius: 0 0 4px 4px; }

    @media (max-width: 480px) { .content { padding: 10px; } }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="header-info">
      <h3 id="headerTitle">Absensi Halaqoh</h3>
      <div class="sub" id="headerSub">Memuat...</div>
    </div>
  </header>

  <div class="content" id="mainContent">
    <p style="text-align:center;color:var(--gray-600);">Memuat data...</p>
  </div>

  <div style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;z-index:50;">
    <button class="btn-simpan" id="btnSimpan" onclick="simpanAbsensi()"><i class="fa-solid fa-circle-check"></i> Simpan Absensi</button>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item active" onclick="goTo('absensi-halaqoh.html')"><i class="fa-solid fa-clipboard-check"></i><span>Absensi</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')">
      <i class="fa-solid fa-grip"></i><span id="navMenu">Menu</span>
    </div><div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span>Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span>Profil</span></div>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['musyrif', 'dosen-musyrif']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    const absensiState = {};
    let isSaving = false;
    let halaqohId = null, halaqohData = null;
    let isPengganti = false;
    let anggotaList = [];

    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function updateSummary() {
      const counts = { hadir: 0, sakit: 0, izin: 0, alfa: 0, jaga: 0 };
      Object.values(absensiState).forEach(s => { if (counts[s] !== undefined) counts[s]++; });
      document.getElementById('sumHadir').textContent = counts.hadir;
      document.getElementById('sumSakit').textContent = counts.sakit;
      document.getElementById('sumIzin').textContent = counts.izin;
      document.getElementById('sumAlfa').textContent = counts.alfa;
    }

    window.setStatus = function(mhsId, status) {
      absensiState[mhsId] = status;
      const sel = document.getElementById(`sel_${mhsId}`);
      if (sel) { sel.className = `status-select ${status}`; sel.value = status; }
      updateSummary();
    };

    window.markAllHadir = function() {
      Object.keys(absensiState).forEach(id => setStatus(id, 'hadir'));
    };

    // ═══ SIMPAN ABSENSI ═══
    async function simpanAbsensi() {
      if (isSaving) return;
      if (Object.keys(absensiState).length === 0) { showToast('Tidak ada anggota', 'error'); return; }

      isSaving = true;
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      try {
        const today = new Date().toISOString().split('T')[0];
        const batch = db.batch();

        for (const [mhsId, status] of Object.entries(absensiState)) {
          // Cek existing absensi hari ini
          const existingSnap = await db.collection('absensiHalaqoh')
            .where('mahasiswaId', '==', mhsId)
            .where('halaqohId', '==', halaqohId)
            .where('tanggal', '==', today)
            .get();

          if (!existingSnap.empty) {
            existingSnap.docs.forEach(d => batch.update(d.ref, { 
              status, 
              musyrifId: user.uid,
              isPengganti: isPengganti,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
            }));
          } else {
            const ref = db.collection('absensiHalaqoh').doc();
            batch.set(ref, {
              mahasiswaId: mhsId,
              halaqohId,
              halaqohNama: halaqohData?.nama || '',
              musyrifId: user.uid,
              musyrifNama: user.nama || '',
              isPengganti: isPengganti,
              status,
              tanggal: today,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        }

        await batch.commit();
        const roleLabel = isPengganti ? ' (Pengganti)' : '';
        showToast(`✅ Absensi tersimpan!${roleLabel}`, 'success');
      } catch(e) {
        showToast('❌ Gagal: ' + e.message, 'error');
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Simpan Absensi';
      }
    }

    // ═══ INIT ═══
    async function init() {
      const container = document.getElementById('mainContent');
      container.innerHTML = '<p style="text-align:center;">Mencari halaqoh...</p>';

      try {
        // 1. Cari sebagai musyrif tetap
        let hSnap = await db.collection('halaqoh').where('musyrifId', '==', user.uid).get();
        if (hSnap.empty) hSnap = await db.collection('halaqoh').where('userId', '==', user.uid).get();

        // 2. Jika tidak ada → cek sebagai pengganti
        if (hSnap.empty) {
          const penggantiSnap = await db.collection('halaqoh').where('musyrifPenggantiId', '==', user.uid).get();
          
          if (!penggantiSnap.empty) {
            // Tampilkan pilihan halaqoh
            isPengganti = true;
            let html = `
              <div class="info-box">
                <i class="fa-solid fa-circle-info"></i>
                <span>Anda adalah <strong>Musyrif Pengganti</strong>. Pilih halaqoh untuk mengisi absensi:</span>
              </div>`;

            penggantiSnap.forEach(d => {
              const hData = d.data();
              html += `
                <div class="halaqoh-card" onclick="pilihHalaqoh('${d.id}')">
                  <h4>🕌 ${hData.nama} <span class="badge badge-pengganti">Pengganti</span></h4>
                  <p>👤 Musyrif tetap: ${hData.musyrifNama || '-'}</p>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('headerTitle').textContent = 'Absensi Halaqoh';
            document.getElementById('headerSub').textContent = 'Pilih halaqoh';
            return;
          }

          container.innerHTML = `
            <div class="warning-box">
              <i class="fa-solid fa-circle-exclamation" style="font-size:30px;display:block;margin-bottom:10px;"></i>
              <strong>Anda belum memiliki Halaqoh.</strong>
              <p style="margin-top:8px;font-size:13px;">Hubungi Operator Halaqoh.</p>
            </div>`;
          return;
        }

        // 3. Musyrif tetap
        isPengganti = false;
        halaqohId = hSnap.docs[0].id;
        halaqohData = hSnap.docs[0].data();
        await loadAnggota(container);
      } catch(e) {
        container.innerHTML = `<div class="warning-box">Gagal: ${e.message}</div>`;
      }
    }

    // ═══ PILIH HALAQOH (PENGGANTI) ═══
    window.pilihHalaqoh = async function(hId) {
      const container = document.getElementById('mainContent');
      container.innerHTML = '<p style="text-align:center;">Memuat anggota...</p>';

      try {
        const hDoc = await db.collection('halaqoh').doc(hId).get();
        if (!hDoc.exists) { container.innerHTML = '<div class="warning-box">Halaqoh tidak ditemukan</div>'; return; }

        halaqohId = hId;
        halaqohData = hDoc.data();
        await loadAnggota(container);
      } catch(e) {
        container.innerHTML = `<div class="warning-box">Gagal: ${e.message}</div>`;
      }
    };

    // ═══ LOAD ANGGOTA ═══
    async function loadAnggota(container) {
      const today = new Date().toISOString().split('T')[0];

      try {
        // Ambil anggota halaqoh
        const pSnap = await db.collection('pembagianHalaqoh').where('halaqohId', '==', halaqohId).get();
        const mhsIds = pSnap.docs.map(d => d.data().mahasiswaId);

        if (mhsIds.length === 0) {
          container.innerHTML = '<p style="text-align:center;">Belum ada anggota di halaqoh ini.</p>';
          return;
        }

        // Ambil data mahasiswa
        const mhsList = [];
        for (const id of mhsIds) {
          const doc = await db.collection('mahasiswa').doc(id).get();
          if (doc.exists) mhsList.push({ id, ...doc.data() });
        }
        mhsList.sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
        anggotaList = mhsList;

        // Cek absensi hari ini
        const absensiSnap = await db.collection('absensiHalaqoh')
          .where('halaqohId', '==', halaqohId)
          .where('tanggal', '==', today)
          .get();
        const existingMap = {};
        absensiSnap.forEach(d => {
          const data = d.data();
          if (data.mahasiswaId) existingMap[data.mahasiswaId] = data.status;
        });

        // Set state
        mhsList.forEach(m => { absensiState[m.id] = existingMap[m.id] || 'hadir'; });

        // Hitung summary
        const counts = { hadir: 0, sakit: 0, izin: 0, alfa: 0, jaga: 0 };
        Object.values(absensiState).forEach(s => { if (counts[s] !== undefined) counts[s]++; });

        const roleLabel = isPengganti ? 'Pengganti' : 'Tetap';
        const roleBadge = isPengganti ? 'badge-pengganti' : 'badge-tetap';

        document.getElementById('headerTitle').textContent = halaqohData.nama || 'Absensi Halaqoh';
        document.getElementById('headerSub').textContent = `${anggotaList.length} anggota · ${today}`;

        // Render list
        let listHtml = '';
        mhsList.forEach((m, i) => {
          const status = absensiState[m.id];
          listHtml += `<div class="santri-row">
            <div class="santri-num">${i+1}</div>
            <div class="santri-nama">${m.nama}</div>
            <select class="status-select ${status}" id="sel_${m.id}" onchange="setStatus('${m.id}', this.value)">
              <option value="hadir" ${status==='hadir'?'selected':''}>✓ Hadir</option>
              <option value="sakit" ${status==='sakit'?'selected':''}>🤒 Sakit</option>
              <option value="izin" ${status==='izin'?'selected':''}>📝 Izin</option>
              <option value="alfa" ${status==='alfa'?'selected':''}>❌ Alfa</option>
              <option value="jaga" ${status==='jaga'?'selected':''}>🛡️ Jaga</option>
            </select>
          </div>`;
        });

        container.innerHTML = `
          <div class="info-card">
            <div class="halaqoh-nama">🕌 ${halaqohData.nama}</div>
            <div class="info-row">
              <div class="info-chip"><span class="badge ${roleBadge}">${roleLabel}</span></div>
              ${halaqohData.musyrifNama ? `<div class="info-chip"><i class="fa-solid fa-user"></i> ${halaqohData.musyrifNama}</div>` : ''}
              <div class="info-chip"><i class="fa-solid fa-users"></i> ${anggotaList.length} anggota</div>
              <div class="info-chip"><i class="fa-solid fa-calendar-day"></i> ${today}</div>
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-item"><div class="summary-val" id="sumHadir">${counts.hadir}</div><div class="summary-lbl">Hadir</div></div>
            <div class="summary-item"><div class="summary-val" id="sumSakit" style="color:#d97706;">${counts.sakit}</div><div class="summary-lbl">Sakit</div></div>
            <div class="summary-item"><div class="summary-val" id="sumIzin" style="color:#2563eb;">${counts.izin}</div><div class="summary-lbl">Izin</div></div>
            <div class="summary-item"><div class="summary-val" id="sumAlfa" style="color:#e53935;">${counts.alfa}</div><div class="summary-lbl">Alfa</div></div>
          </div>
          <div class="list-header">
            <span>📋 ${anggotaList.length} Anggota</span>
            <button class="mark-all-btn" onclick="markAllHadir()">✅ Semua Hadir</button>
          </div>
          <div class="santri-list">${listHtml}</div>`;

      } catch(e) {
        container.innerHTML = `<div class="warning-box">Gagal: ${e.message}</div>`;
      }
    }

    // Expose simpanAbsensi ke global
    window.simpanAbsensi = simpanAbsensi;

    init();
  </script>
</body>
</html>
