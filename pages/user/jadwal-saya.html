<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jadwal Saya - IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green-dark:#003d33;--green-mid:#006644;--green:#00a859;
      --green-light:#e8f5e9;--green-pale:#f0faf5;
      --gold:#f5c842;--gold-light:#fffbee;
      --white:#ffffff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;
      --gray-200:#d1ead8;--gray-600:#666666;--gray-800:#222222;
      --red:#e53935;--blue:#1565c0;--blue-light:#e3f2fd;
      --radius-sm:10px;--radius:14px;--radius-lg:18px;
      --transition:all 0.3s ease;--header-height:56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(180deg, #e8f5e9 0%, #f0faf5 40%, #f9f9f9 100%); color: var(--gray-800); padding-top: var(--header-height); padding-bottom: 100px; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
    .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #003d33 0%, #006644 100%); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,61,51,0.35); }
    .btn-back { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .app-header h3 { font-size: 16px; font-weight: 700; flex: 1; }
    .content { padding: 14px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; margin: 0 auto; }
    .card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: var(--radius-lg); padding: 16px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 2px 12px rgba(0, 61, 51, 0.06); overflow-x: auto; }
    .info-box { background: var(--blue-light); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 12px; color: var(--blue); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .btn { padding: 9px 16px; border: none; border-radius: 40px; font-size: 13px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #004d40, #006644); color: white; }
    .btn-outline { background: white; border: 1.5px solid var(--gray-200); color: var(--gray-600); }
    .btn-danger { background: var(--red); color: white; }
    .btn-sm { padding: 5px 10px; font-size: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 650px; }
    thead th { background: var(--green-dark); color: white; padding: 10px 6px; text-align: center; font-size: 10px; font-weight: 700; border: 1px solid #003d33; white-space: nowrap; }
    thead th:first-child { width: 55px; background: #003d33; }
    tbody td { padding: 8px 5px; text-align: center; border: 1px solid var(--gray-200); vertical-align: middle; height: 65px; }
    tbody td:first-child { font-weight: 700; color: var(--green-dark); background: var(--green-light); font-size: 11px; }
    .cell-filled { background: #e8f5e9; cursor: pointer; transition: var(--transition); } .cell-filled:hover { background: #c8e6c9; }
    .cell-empty { cursor: pointer; transition: var(--transition); } .cell-empty:hover { background: #f0f0f0; }
    .cell-empty .add-icon { font-size: 18px; color: var(--gray-600); opacity: 0.5; }
    .cell-mapel { font-weight: 700; color: var(--green-dark); font-size: 10px; margin-bottom: 2px; }
    .cell-kelas { font-size: 9px; color: var(--gray-600); }
    .cell-actions { margin-top: 4px; display: flex; gap: 3px; justify-content: center; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: white; border-radius: var(--radius-lg); width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 22px; box-shadow: 0 12px 48px rgba(0,0,0,0.25); }
    .modal-box h4 { margin-bottom: 14px; font-size: 15px; font-weight: 700; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
    .form-group select, .form-group input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; background: white; }
    .form-group select:focus, .form-group input:focus { border-color: var(--green); }
    .kelas-checkbox-list { max-height: 140px; overflow-y: auto; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 8px; background: white; }
    .kelas-checkbox-list label { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 12px; cursor: pointer; border-radius: 6px; transition: var(--transition); }
    .kelas-checkbox-list label:hover { background: var(--green-light); }
    .kelas-checkbox-list input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .bottom-nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 420px; height: 64px; background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 24px; display: flex; align-items: center; justify-content: space-around; z-index: 100; box-shadow: 0 8px 32px rgba(0, 61, 51, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8); padding: 0 8px; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--gray-600); cursor: pointer; text-decoration: none; padding: 8px 0; flex: 1; border-radius: 18px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .nav-item i { font-size: 20px; transition: all 0.3s ease; }
    .nav-item.active { color: var(--green-dark); font-weight: 700; } .nav-item.active i { color: var(--green); filter: drop-shadow(0 2px 4px rgba(0, 168, 89, 0.3)); }
    .nav-item.active::before { content: ''; position: absolute; top: 2px; width: 28px; height: 3px; background: var(--green); border-radius: 0 0 4px 4px; }
    @media (max-width: 480px) { .content { padding: 8px; } table { font-size: 10px; } }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="goTo('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
    <h3>📅 Jadwal Saya</h3>
  </header>

  <div class="content">
    <div class="info-box">
      <i class="fa-solid fa-circle-info"></i>
      <span>💡 Klik <strong>sel kosong</strong> untuk tambah · <strong>Multi-kelas</strong> · Filter <strong>Semester</strong></span>
    </div>
    <div class="card" id="jadwalContainer"><p style="text-align:center;color:var(--gray-600);">Memuat jadwal...</p></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('dashboard.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item active" onclick="goTo('jadwal-saya.html')"><i class="fa-solid fa-calendar-days"></i><span>Jadwal</span></div>
    <div class="nav-item" onclick="goTo('menu-cepat.html')"><i class="fa-solid fa-grid-2"></i><span>Menu</span></div>
    <div class="nav-item" onclick="goTo('rekap.html')"><i class="fa-solid fa-chart-simple"></i><span>Rekap</span></div>
    <div class="nav-item" onclick="goTo('profil.html')"><i class="fa-solid fa-circle-user"></i><span>Profil</span></div>
  </nav>

  <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalContent"></div></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['dosen', 'dosen-musyrif']);
    if (!user) window.location.href = '../../index.html';
    window.goTo = page => window.location.href = page;

    const JP_WAKTU = { 1:'07:15-08:05',2:'08:10-09:00',3:'09:05-09:55',4:'10:10-11:00',5:'11:05-11:55' };
    const HARI_LIST = ['Sabtu','Ahad','Senin','Selasa','Rabu','Kamis'];
    const JAM_LIST = [1,2,3,4,5];
    let allJadwal = [], mkMap = {}, kelasMap = {};

    function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

    async function loadOptions() {
      try {
        const [mkSnap, kelasSnap] = await Promise.all([
          db.collection('matakuliah').get(), db.collection('kelas').get()
        ]);
        mkMap = {}; kelasMap = {};
        mkSnap.forEach(d => { const data = d.data(); data._id = d.id; mkMap[d.id] = data; });
        kelasSnap.forEach(d => { const data = d.data(); data._id = d.id; kelasMap[d.id] = data; });
        console.log('✅ Loaded: MK=' + Object.keys(mkMap).length + ' Kelas=' + Object.keys(kelasMap).length);
      } catch(e) { console.error(e); }
    }

    async function loadJadwal() {
      try {
        const snap = await db.collection('jadwal').where('dosenId','==',user.uid).get();
        allJadwal = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTabel();
      } catch(e) { document.getElementById('jadwalContainer').innerHTML = '<p style="color:red;">Gagal: '+e.message+'</p>'; }
    }

    function renderTabel() {
      const jm = {}; allJadwal.forEach(j => { jm[`${j.hari}_${j.jamKe}`] = j; });
      let h = '<table><thead><tr><th>JP</th>'+HARI_LIST.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
      JAM_LIST.forEach(jam => {
        h += `<tr><td>${jam}<br><small style="font-size:9px;">${JP_WAKTU[jam]}</small></td>`;
        HARI_LIST.forEach(hari => {
          const j = jm[`${hari}_${jam}`];
          if (j) {
            h += `<td class="cell-filled" onclick="editJadwal('${j.id}')"><div class="cell-mapel">${j.mkNama||'-'}</div><div class="cell-kelas">${j.kelasNama||'-'}</div><div class="cell-actions" onclick="event.stopPropagation()"><button class="btn btn-outline btn-sm" onclick="editJadwal('${j.id}')"><i class="fa-solid fa-pen"></i></button><button class="btn btn-danger btn-sm" onclick="hapusJadwal('${j.id}')"><i class="fa-solid fa-trash"></i></button></div></td>`;
          } else {
            h += `<td class="cell-empty" onclick="openForm('${hari}',${jam})"><div class="add-icon"><i class="fa-solid fa-plus-circle"></i></div></td>`;
          }
        });
        h += '</tr>';
      });
      h += '</tbody></table>';
      document.getElementById('jadwalContainer').innerHTML = h;
    }

    function renderKelasCheckboxes(selectedIds=[]) {
      return Object.entries(kelasMap).sort((a,b)=>(a[1].nama||'').localeCompare(b[1].nama||'')).map(([id,k])=>`<label><input type="checkbox" value="${id}" class="kelas-cb" ${selectedIds.includes(id)?'checked':''}> ${k.nama} (${k.semester==="i'dad"?"I'dad":'Sem '+k.semester})</label>`).join('');
    }

    function filterMKBySemester() {
      const semester = document.getElementById('fSemester')?.value || '';
      const mkSel = document.getElementById('fMkId');
      if (!mkSel) return;
      let filtered = Object.entries(mkMap);
      if (semester) {
        const target = semester.toLowerCase().replace(/[^a-z0-9]/g, '');
        filtered = filtered.filter(([id, m]) => {
          const mkSem = String(m.semester || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          return mkSem === target || mkSem.includes(target) || target.includes(mkSem);
        });
      }
      if (filtered.length === 0) {
        mkSel.innerHTML = '<option value="">Tidak ada MK di semester ini</option>';
        return;
      }
      mkSel.innerHTML = '<option value="">Pilih Matakuliah...</option>' +
        filtered.sort((a,b)=>(a[1].nama||'').localeCompare(b[1].nama||''))
        .map(([id, m]) => `<option value="${id}">${m.kode||''} - ${m.nama} (${m.semester||'-'})</option>`).join('');
    }

    window.openForm = function(hari, jamKe) {
      const waktu = JP_WAKTU[jamKe];
      document.getElementById('modalContent').innerHTML = `
        <h4>➕ Tambah Jadwal</h4><p style="font-size:11px;color:var(--gray-600);margin-bottom:12px;">${hari} · JP ${jamKe} · ${waktu}</p>
        <div class="form-group"><label>📅 Semester</label><select id="fSemester" onchange="filterMKBySemester()"><option value="">Semua Semester</option><option value="i'dad">Semester i'dad</option>${[1,2,3,4,5,6,7,8].map(s=>`<option value="${s}">Semester ${s}</option>`).join('')}</select></div>
        <div class="form-group"><label>📚 Matakuliah</label><select id="fMkId"><option value="">Pilih Semester dulu...</option></select></div>
        <div class="form-group"><label>🏫 Kelas (bisa pilih multiple)</label><div class="kelas-checkbox-list">${renderKelasCheckboxes()}</div><small style="color:var(--gray-600);">💡 Centang semua kelas yang digabung</small></div>
        <div class="modal-buttons"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="btnSimpan" type="button">Simpan</button></div>`;
      document.getElementById('modalOverlay').classList.add('show');

      document.getElementById('btnSimpan').onclick = async () => {
        const mkId = document.getElementById('fMkId').value;
        const checkedKelas = [...document.querySelectorAll('.kelas-cb:checked')].map(cb=>cb.value);
        if (!mkId) { alert('⚠️ Pilih matakuliah!'); return; }
        if (checkedKelas.length===0) { alert('⚠️ Pilih minimal 1 kelas!'); return; }
        if (allJadwal.find(j=>j.hari===hari&&j.jamKe===jamKe)) { alert('⚠️ Sudah ada jadwal!'); return; }
        const mk = mkMap[mkId], kelasNama = checkedKelas.map(id=>kelasMap[id]?.nama||id).join(', ');
        try {
          await db.collection('jadwal').add({hari,jamKe,waktu,dosenId:user.uid,dosenNama:user.nama||'-',mkId,mkNama:mk?.nama||'-',mkKode:mk?.kode||'',kelasId:checkedKelas[0],kelasIds:checkedKelas,kelasNama,semester:kelasMap[checkedKelas[0]]?.semester||'1',totalPertemuan:16,minKehadiran:75,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
          closeModal(); alert('✅ Ditambahkan!'); await loadJadwal();
        } catch(e) { alert('❌ '+e.message); }
      };
      setTimeout(() => filterMKBySemester(), 100);
    };

    window.editJadwal = async function(id) {
      const j = allJadwal.find(x=>x.id===id); if(!j)return;
      const selectedKelas = j.kelasIds || [j.kelasId];
      document.getElementById('modalContent').innerHTML = `
        <h4>✏️ Edit Jadwal</h4><p style="font-size:11px;color:var(--gray-600);margin-bottom:12px;">${j.hari} · JP ${j.jamKe} · ${j.waktu}</p>
        <div class="form-group"><label>📅 Semester</label><select id="fSemester" onchange="filterMKBySemester()"><option value="">Semua</option><option value="i'dad" ${j.semester==="i'dad"?'selected':''}>Semester i'dad</option>${[1,2,3,4,5,6,7,8].map(s=>`<option value="${s}" ${j.semester==s?'selected':''}>Semester ${s}</option>`).join('')}</select></div>
        <div class="form-group"><label>📚 Matakuliah</label><select id="fMkId"><option value="">Pilih...</option>${Object.entries(mkMap).sort((a,b)=>(a[1].nama||'').localeCompare(b[1].nama||'')).map(([id,m])=>`<option value="${id}" ${id===j.mkId?'selected':''}>${m.kode||''} - ${m.nama}</option>`).join('')}</select></div>
        <div class="form-group"><label>🏫 Kelas</label><div class="kelas-checkbox-list">${renderKelasCheckboxes(selectedKelas)}</div></div>
        <div class="modal-buttons"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="btnUpdate" type="button">Update</button></div>`;
      document.getElementById('modalOverlay').classList.add('show');

      document.getElementById('btnUpdate').onclick = async () => {
        const mkId = document.getElementById('fMkId').value;
        const checkedKelas = [...document.querySelectorAll('.kelas-cb:checked')].map(cb=>cb.value);
        if (!mkId||checkedKelas.length===0) { alert('⚠️ Lengkapi!'); return; }
        const mk = mkMap[mkId], kelasNama = checkedKelas.map(id=>kelasMap[id]?.nama||id).join(', ');
        await db.collection('jadwal').doc(id).update({mkId,mkNama:mk?.nama||'-',mkKode:mk?.kode||'',kelasId:checkedKelas[0],kelasIds:checkedKelas,kelasNama,semester:kelasMap[checkedKelas[0]]?.semester||'1',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        closeModal(); alert('✅ Diupdate!'); await loadJadwal();
      };
    };

    window.hapusJadwal = async (id) => { if(confirm('Hapus?')){ await db.collection('jadwal').doc(id).delete(); alert('🗑️ Dihapus!'); await loadJadwal(); } };

    (async function init() { await loadOptions(); await loadJadwal(); })();
  </script>
</body>
</html>
