<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kehadiran Mahasiswa - Duty Lecturer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/duty-style.css">
  <style>
    .status-filter { display: flex; gap: 4px; margin-bottom: 12px; background: var(--gray-100); border-radius: 40px; padding: 4px; }
    .status-tab { flex: 1; padding: 8px; text-align: center; border-radius: 40px; font-size: 10px; font-weight: 600; cursor: pointer; border: none; background: transparent; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--gray-600); }
    .status-tab.active { background: white; color: var(--maroon); font-weight: 700; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-info">
      <h3>👥 Kehadiran Mahasiswa</h3>
      <p id="headerDate">Memuat...</p>
    </div>
  </header>

  <div class="content">
    <div class="status-filter">
      <button class="status-tab active" onclick="filterStatus('semua', this)">Semua</button>
      <button class="status-tab" onclick="filterStatus('sakit', this)">Sakit</button>
      <button class="status-tab" onclick="filterStatus('izin', this)">Izin</button>
      <button class="status-tab" onclick="filterStatus('alfa', this)">Alfa</button>
      <button class="status-tab" onclick="filterStatus('jaga', this)">Jaga</button>
    </div>

    <div class="card">
      <div class="card-title">Mahasiswa Tidak Hadir</div>
      <div id="mhsList"><p style="text-align:center;color:var(--gray-600);">Memuat...</p></div>
    </div>

    <button class="btn-share-wa" onclick="shareMhsWA()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.77.47 3.43 1.28 4.88L2 22l5.25-1.38A9.96 9.96 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.36 14.1c-.23.65-1.34 1.24-1.86 1.31-.52.08-1.19.12-1.92-.12-.4-.13-.92-.3-1.58-.59-2.78-1.2-4.6-4.02-4.74-4.21-.14-.19-1.14-1.51-1.14-2.88 0-1.37.72-2.05.98-2.33.26-.28.56-.35.75-.35.19 0 .38 0 .55.01.18.01.42-.07.65.5.23.57.79 1.95.86 2.09.07.14.12.3.02.49-.1.19-.14.3-.28.47-.14.17-.3.38-.42.51-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.07.95 1.97 1.25 2.25 1.39.28.14.44.12.6-.07.16-.19.7-.82.88-1.1.18-.28.37-.23.62-.14.25.09 1.6.76 1.88.9.28.14.46.21.53.32.07.12.07.67-.16 1.32z"/></svg>
      Share WA
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/bottom-nav-duty.js"></script>
  <script>
    const user = checkRole(['duty-lecturer', 'pusat-data']);
    if (!user) window.location.href = '../../index.html';

    let allMhsTidakHadir = [];
    let currentFilter = 'semua';

    function getWIBDate() {
      const now = new Date();
      const options = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
      return new Intl.DateTimeFormat('en-CA', options).format(now);
    }

    async function loadMhs() {
      const today = getWIBDate();
      document.getElementById('headerDate').textContent = 
        new Date().toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      try {
        const [absenSnap, mhsSnap] = await Promise.all([
          db.collection('absensi').where('tanggal', '==', today).get(),
          db.collection('mahasiswa').get()
        ]);

        const absen = absenSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const mhsMap = {};
        mhsSnap.forEach(d => { mhsMap[d.id] = d.data(); });

        allMhsTidakHadir = absen
          .filter(a => a.status && a.status !== 'hadir')
          .map(a => ({
            nama: mhsMap[a.mahasiswaId]?.nama || a.mahasiswaId,
            nim: mhsMap[a.mahasiswaId]?.nim || '-',
            kelas: a.kelasNama || mhsMap[a.mahasiswaId]?.kelasNama || '-',
            status: a.status,
            jamKe: a.jamKe,
            mkNama: a.mkNama || '-'
          }))
          .sort((a,b) => a.nama.localeCompare(b.nama));

        updateDutyBadge('hadir', allMhsTidakHadir.length);
        renderMhs();
      } catch(e) { console.error(e); }
    }

    function renderMhs() {
      const filtered = currentFilter === 'semua' ? allMhsTidakHadir : allMhsTidakHadir.filter(m => m.status === currentFilter);
      const container = document.getElementById('mhsList');
      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#1b5e20;padding:20px;">✅ Semua mahasiswa hadir!</p>';
        return;
      }
      container.innerHTML = filtered.map(m => `
        <div class="list-item">
          <div class="avatar">${(m.nama||'?')[0]}</div>
          <div class="info">
            <div class="name">${m.nama}</div>
            <div class="detail">${m.kelas} · JP ${m.jamKe} · ${m.mkNama}</div>
          </div>
          <span class="badge badge-${m.status}">${m.status.toUpperCase()}</span>
        </div>
      `).join('');
    }

    function filterStatus(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderMhs();
    }
    window.filterStatus = filterStatus;

    function shareMhsWA() {
      const dateStr = new Date().toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      let text = `⚠️ *MAHASISWA TIDAK HADIR*\n📅 ${dateStr}\n━━━━━━━━━━━━━━━━\n\n`;
      text += `📊 Total: ${allMhsTidakHadir.length}\n\n`;
      allMhsTidakHadir.forEach((m, i) => {
        text += `${i+1}. ${m.nama} (${m.kelas})\n   ${m.status.toUpperCase()} · JP ${m.jamKe} · ${m.mkNama}\n`;
      });
      text += `\n━━━━━━━━━━━━━━━━\n📱 © IPIM Maghfirah`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
    window.shareMhsWA = shareMhsWA;

    loadMhs();
    setInterval(loadMhs, 60000);
  </script>
</body>
</html>
