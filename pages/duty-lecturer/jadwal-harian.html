<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jadwal Harian - Duty Lecturer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../../css/duty-style.css">

  <style>
    /* ── Filter JP Tabs ── */
    .jp-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .jp-tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--gray-200);
      background: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--gray-600);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .jp-tab.active {
      background: var(--maroon);
      color: white;
      border-color: var(--maroon);
      box-shadow: 0 2px 8px rgba(122, 21, 21, 0.2);
    }

    /* ── Table ── */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .jadwal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 500px;
    }
    .jadwal-table thead th {
      background: var(--maroon);
      color: white;
      padding: 10px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #3d0a0a;
      white-space: nowrap;
    }
    .jadwal-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      vertical-align: middle;
    }
    .jadwal-table tbody tr:hover {
      background: rgba(122, 21, 21, 0.03);
    }
    .jadwal-table tbody tr:last-child td {
      border-bottom: none;
    }

    .kelas-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      background: #e3f2fd;
      color: #0d47a1;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }
    .status-badge.selesai  { background: #e8f5e9; color: #1b5e20; }
    .status-badge.berjalan { background: #fff3e0; color: #e65100; }
    .status-badge.belum    { background: #f5f5f5; color: #9e9e9e; }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="app-header">
    <div class="header-info">
      <h3>📅 Jadwal Harian</h3>
      <p id="headerDate">Memuat...</p>
    </div>
  </header>

  <!-- ═══ CONTENT ═══ -->
  <div class="content">
    <div class="card">
      <div class="card-title">Jadwal Hari Ini</div>

      <!-- Filter JP -->
      <div class="jp-tabs" id="jpTabs">
        <!-- Diisi oleh JS -->
      </div>

      <!-- Tabel Jadwal -->
      <div class="table-wrapper" id="jadwalTable">
        <p style="text-align: center; color: var(--gray-600);">Memuat...</p>
      </div>
    </div>
  </div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/bottom-nav-duty.js"></script>

  <script>
    const user = checkRole(['duty-lecturer', 'pusat-data']);
    if (!user) window.location.href = '../../index.html';

    // ── STATE ──
    let activeJP = null;
    let jadwalByJP = {};

    // ── HELPER ──
    function getWIBDate() {
      const now = new Date();
      const options = {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      };
      return new Intl.DateTimeFormat('en-CA', options).format(now);
    }

    function getDayName(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const names = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return names[date.getDay()];
    }

    function getCurrentJP() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      if (h < 7 || (h === 7 && m < 15)) return 0;
      if (h < 8 || (h === 8 && m < 5))  return 1;
      if (h < 9)  return 2;
      if (h < 10) return 3;
      if (h < 11) return 4;
      if (h < 12) return 5;
      return 6;
    }

    function getStatusLabel(jp) {
      const currentJP = getCurrentJP();
      if (jp < currentJP) return 'selesai';
      if (jp === currentJP) return 'berjalan';
      return 'belum';
    }

    function getStatusText(jp) {
      const status = getStatusLabel(jp);
      const map = {
        selesai: '✅ Selesai',
        berjalan: '🔴 Berjalan',
        belum: '⏳ Belum'
      };
      return map[status] || '';
    }

    // ── LOAD JADWAL ──
    async function loadJadwal() {
      const today = getWIBDate();
      const dayName = getDayName(today);

      document.getElementById('headerDate').textContent =
        new Date().toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });

      try {
        const jadwalSnap = await db.collection('jadwal')
          .where('hari', '==', dayName)
          .get();

        const jadwal = jadwalSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.jamKe || 0) - (b.jamKe || 0));

        if (jadwal.length === 0) {
          document.getElementById('jadwalTable').innerHTML =
            '<p style="text-align:center; color:var(--gray-600); padding:20px;">Tidak ada jadwal hari ini</p>';
          document.getElementById('jpTabs').innerHTML = '';
          return;
        }

        // ── GROUPING PER JP ──
        jadwalByJP = {};
        jadwal.forEach(j => {
          const jp = j.jamKe || 1;
          if (!jadwalByJP[jp]) jadwalByJP[jp] = [];
          jadwalByJP[jp].push(j);
        });

        // ── RENDER JP TABS ──
        const allJPs = Object.keys(jadwalByJP)
          .map(Number)
          .sort((a, b) => a - b);

        const currentJP = getCurrentJP();
        activeJP = allJPs.includes(currentJP) ? currentJP : allJPs[0];

        document.getElementById('jpTabs').innerHTML = allJPs.map(jp => {
          const status = getStatusLabel(jp);
          return `
            <button class="jp-tab ${jp === activeJP ? 'active' : ''}" onclick="pilihJP(${jp})">
              JP ${jp}
            </button>
          `;
        }).join('');

        renderTable();
      } catch (e) {
        console.error('Gagal load jadwal:', e);
      }
    }

    // ── RENDER TABLE ──
    function renderTable() {
      const container = document.getElementById('jadwalTable');
      const items = jadwalByJP[activeJP] || [];

      if (items.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--gray-600);padding:20px;">Tidak ada jadwal di JP ini</p>';
        return;
      }

      let html = `
        <table class="jadwal-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Kelas</th>
              <th>Mata Kuliah</th>
              <th>Dosen</th>
              <th>Waktu</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
      `;

      items.forEach((j, i) => {
        const status = getStatusLabel(activeJP);
        html += `
          <tr>
            <td>${i + 1}</td>
            <td><span class="kelas-badge">${j.kelasNama || '-'}</span></td>
            <td><strong>${j.mkNama || '-'}</strong></td>
            <td>${j.dosenNama || '-'}</td>
            <td>${j.waktu || '-'}</td>
            <td><span class="status-badge ${status}">${getStatusText(activeJP)}</span></td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // ── PILIH JP ──
    window.pilihJP = function(jp) {
      activeJP = jp;
      document.querySelectorAll('.jp-tab').forEach(tab => {
        tab.classList.remove('active');
      });
      event.target.classList.add('active');
      renderTable();
    };

    // ── INIT ──
    loadJadwal();
  </script>
</body>
</html>
