<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi Pekanan - Operator Akademik IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --green-dark: #004d40; --green: #00a859; --green-light: #e8f5e9; --gold: #d4a843; --white: #ffffff; --gray-50: #fafafa; --gray-100: #f5f5f5; --gray-200: #e0e0e0; --gray-400: #9e9e9e; --gray-600: #616161; --gray-800: #333333; --red: #e53935; --red-light: #fce4ec; --blue: #1e88e5; --blue-light: #e3f2fd; --orange: #f57c00; --sidebar-width: 260px; --radius-sm: 8px; --radius: 12px; --radius-lg: 16px; --transition: all 0.25s ease; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #f0f4f3; color: var(--gray-800); display: flex; min-height: 100vh; }

    .sidebar { width: var(--sidebar-width); background: var(--green-dark); color: white; height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
    .sidebar-logo { width: 40px; height: 40px; background: var(--gold); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--green-dark); font-size: 18px; flex-shrink: 0; }
    .sidebar-brand h2 { font-size: 16px; font-weight: 700; color: white; } .sidebar-brand span { font-size: 10px; opacity: 0.6; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
    .nav-section { margin-bottom: 8px; } .nav-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.4; padding: 12px 12px 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition); margin-bottom: 2px; cursor: pointer; }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; } .nav-item.active { background: rgba(255,255,255,0.15); color: var(--gold); font-weight: 600; }
    .nav-item i { width: 20px; text-align: center; font-size: 14px; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green-dark); font-weight: 700; font-size: 14px; flex-shrink: 0; }

    .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 24px 28px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .page-title h1 { font-size: 22px; font-weight: 700; } .page-title p { font-size: 13px; color: var(--gray-600); }
    .btn { padding: 9px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; }
    .btn-outline { background: white; border: 1.5px solid var(--gray-200); color: var(--gray-600); } .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-info { background: var(--blue-light); color: var(--blue); }

    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--gray-600); }
    .form-group input, .form-group select { padding: 8px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Poppins', sans-serif; outline: none; background: white; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--gray-200); text-align: center; }
    .stat-card .val { font-size: 28px; font-weight: 800; color: var(--green-dark); }
    .stat-card .lbl { font-size: 11px; color: var(--gray-600); margin-top: 4px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .widget { background: white; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); overflow: hidden; }
    .widget-header { padding: 14px 18px; border-bottom: 1px solid var(--gray-100); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .widget-body { padding: 16px; }
    .chart-wrap { height: 250px; position: relative; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th { background: var(--gray-50); padding: 8px 6px; text-align: center; font-size: 9px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; border-bottom: 2px solid var(--gray-200); }
    tbody td { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--gray-100); }
    tbody tr.highlight { background: #fce4ec; }
    tbody td:first-child { text-align: left; }

    .badge { padding: 3px 10px; border-radius: 12px; font-size: 9px; font-weight: 600; }
    .badge-red { background: var(--red-light); color: #b71c1c; }
    .badge-orange { background: #fff3e0; color: #e65100; }
    .badge-green { background: var(--green-light); color: #1b5e20; }
    .badge-sakit { background: #fef3c7; color: #92400e; }
    .badge-izin { background: #dbeafe; color: #1e40af; }
    .badge-alfa { background: #fce4ec; color: #991b1b; }

    .top-list { display: flex; flex-direction: column; gap: 6px; }
    .top-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--gray-50); border-radius: var(--radius-sm); }
    .top-rank { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: white; flex-shrink: 0; }
    .rank-1 { background: #e53935; } .rank-2 { background: #f57c00; } .rank-3 { background: #fbc02d; }
    .rank-rest { background: var(--gray-400); }

    @media (max-width: 1200px) { .grid-2 { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 16px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i></div><div class="sidebar-brand"><h2>IPIM Panel</h2><span>Operator Akademik</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><div class="nav-section-title">Akademik</div>
        <a href="rekap-absensi.html" class="nav-item"><i class="fa-solid fa-clipboard-check"></i> Rekap Absensi</a>
        <a href="rekap-absensi-pekanan.html" class="nav-item active"><i class="fa-solid fa-chart-line"></i> Rekap Pekanan</a>
        <a href="rekap-nilai.html" class="nav-item"><i class="fa-solid fa-chart-bar"></i> Rekap Nilai</a>
      </div>
    </nav>
    <div class="sidebar-footer"><div class="user-avatar" id="avatarLetter">A</div><div class="user-info-sidebar"><div class="name" id="sidebarName">Operator</div><div class="role">Akademik</div></div></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="page-title"><h1>📊 Rekap Absensi Pekanan</h1><p>Filter tanggal · Share WA · Top Jarang Hadir</p></div>
      <button class="btn btn-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>

    <div class="filter-row">
      <div class="form-group"><label>🏫 Kelas</label><select id="filterKelas" onchange="loadAll()"><option value="">Semua Kelas</option></select></div>
      <div class="form-group"><label>📅 Dari Tgl</label><input type="date" id="tglDari" onchange="loadAll()"></div>
      <div class="form-group"><label>📅 Sampai Tgl</label><input type="date" id="tglSampai" onchange="loadAll()"></div>
      <div class="form-group"><label>📅 Cepat</label><select id="filterPeriode" onchange="setPeriode()"><option value="">Custom</option><option value="pekan">1 Pekan</option><option value="bulan">1 Bulan</option><option value="semester">1 Semester</option></select></div>
      <button class="btn btn-info btn-sm" onclick="shareWA()"><i class="fa-brands fa-whatsapp"></i> Share WA</button>
      <button class="btn btn-outline btn-sm" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="grid-2">
      <div class="widget">
        <div class="widget-header"><i class="fa-solid fa-chart-bar" style="color:var(--green);"></i> Perbandingan Kehadiran</div>
        <div class="widget-body"><div class="chart-wrap"><canvas id="chartBatang"></canvas></div></div>
      </div>
      <div class="widget">
        <div class="widget-header"><i class="fa-solid fa-chart-pie" style="color:var(--red);"></i> Distribusi Status</div>
        <div class="widget-body"><div class="chart-wrap"><canvas id="chartPie"></canvas></div></div>
      </div>
    </div>

    <!-- Top Jarang Hadir -->
    <div class="widget" style="margin-bottom:20px;">
      <div class="widget-header">
        <span><i class="fa-solid fa-ranking-star" style="color:var(--red);"></i> 🔴 Mahasiswa Jarang Hadir (Top 10)</span>
        <button class="btn btn-info btn-sm" onclick="shareWA()"><i class="fa-brands fa-whatsapp"></i> Share WA</button>
      </div>
      <div class="widget-body"><div class="top-list" id="topTidakHadir"></div></div>
    </div>

    <!-- Detail Tidak Hadir per Tanggal -->
    <div class="widget">
      <div class="widget-header"><i class="fa-solid fa-table"></i> 📋 Mahasiswa Tidak Hadir (Filter Tanggal)</div>
      <div class="widget-body" style="overflow-x:auto;">
        <div id="tidakHadirList"><p style="text-align:center;color:var(--gray-400);">Memuat...</p></div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['operator-akademik', 'pusat-data']);
    if (!user) window.location.href = '../../index.html';
    document.getElementById('sidebarName').textContent = user.nama || 'Operator';
    document.getElementById('avatarLetter').textContent = (user.nama || 'A').charAt(0).toUpperCase();

    let allData = [], chartBatang, chartPie;
    let mhsMapGlobal = {}, mkMapGlobal = {};
    let currentStats = {};
    let globalTidakHadirList = [];

    const now = new Date();
    document.getElementById('tglSampai').value = now.toISOString().split('T')[0];
    const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
    document.getElementById('tglDari').value = weekAgo.toISOString().split('T')[0];

    window.setPeriode = function() {
      const periode = document.getElementById('filterPeriode').value;
      const now2 = new Date();
      let start = new Date();
      if (periode === 'pekan') start.setDate(now2.getDate() - 7);
      else if (periode === 'bulan') start.setDate(now2.getDate() - 30);
      else if (periode === 'semester') start.setMonth(now2.getMonth() - 6);
      else return;
      document.getElementById('tglDari').value = start.toISOString().split('T')[0];
      document.getElementById('tglSampai').value = now2.toISOString().split('T')[0];
      loadAll();
    };

    function getDateRange() {
      return {
        start: document.getElementById('tglDari').value,
        end: document.getElementById('tglSampai').value
      };
    }

    async function loadFilters() {
      const kSnap = await db.collection('kelas').get();
      const sel = document.getElementById('filterKelas');
      kSnap.docs.sort((a,b) => (a.data().nama||'').localeCompare(b.data().nama||'')).forEach(d => {
        const o = document.createElement('option'); o.value = d.id; o.textContent = d.data().nama; sel.appendChild(o);
      });
    }

    async function loadAll() {
      const kelasFilter = document.getElementById('filterKelas').value;
      const { start, end } = getDateRange();
      if (!start || !end) return;

      try {
        const [absensiSnap, mhsSnap, mkSnap] = await Promise.all([
          db.collection('absensi').get(),
          db.collection('mahasiswa').get(),
          db.collection('matakuliah').get()
        ]);

        mhsMapGlobal = {}; mhsSnap.forEach(d => { mhsMapGlobal[d.id] = d.data(); });
        mkMapGlobal = {}; mkSnap.forEach(d => { mkMapGlobal[d.id] = d.data(); });

        let absensiList = absensiSnap.docs.map(d => d.data()).filter(a => a.tanggal >= start && a.tanggal <= end);
        if (kelasFilter) absensiList = absensiList.filter(a => a.kelasId === kelasFilter);

        const totalAbsensi = absensiList.length;
        const totalMhs = new Set(absensiList.map(a => a.mahasiswaId)).size;
        const tidakHadirCount = absensiList.filter(a => a.status && a.status !== 'hadir').length;
        const persenHadir = totalAbsensi > 0 ? Math.round(((totalAbsensi - tidakHadirCount) / totalAbsensi) * 100) : 0;
        const mhsTidakHadirSet = new Set(absensiList.filter(a => a.status && a.status !== 'hadir').map(a => a.mahasiswaId));

        currentStats = { totalAbsensi, totalMhs, persenHadir, tidakHadirCount, start, end, mhsTidakHadirCount: mhsTidakHadirSet.size };

        // Stats
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="val">${totalAbsensi}</div><div class="lbl">Total Absensi</div></div>
          <div class="stat-card"><div class="val">${totalMhs}</div><div class="lbl">Mahasiswa</div></div>
          <div class="stat-card"><div class="val" style="color:#1b5e20;">${persenHadir}%</div><div class="lbl">Kehadiran</div></div>
          <div class="stat-card"><div class="val" style="color:#b71c1c;">${mhsTidakHadirSet.size}</div><div class="lbl">Mhs Tidak Hadir</div></div>`;

        // Chart Batang
        const days = [];
        const dStart = new Date(start), dEnd = new Date(end);
        for (let d = new Date(dStart); d <= dEnd; d.setDate(d.getDate()+1)) {
          days.push(new Date(d).toISOString().split('T')[0]);
        }
        const hadirPerDay = days.map(d => absensiList.filter(a => a.tanggal===d && (!a.status||a.status==='hadir')).length);
        const tidakPerDay = days.map(d => absensiList.filter(a => a.tanggal===d && a.status&&a.status!=='hadir').length);

        if (chartBatang) chartBatang.destroy();
        chartBatang = new Chart(document.getElementById('chartBatang'), {
          type: 'bar',
          data: {
            labels: days.map(d => new Date(d).toLocaleDateString('id-ID',{weekday:'short',day:'numeric'})),
            datasets: [
              { label: 'Hadir', data: hadirPerDay, backgroundColor: 'rgba(0,168,89,0.6)' },
              { label: 'Tidak Hadir', data: tidakPerDay, backgroundColor: 'rgba(229,57,53,0.6)' }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
        });

        // Chart Pie
        const sCount = absensiList.filter(a=>a.status==='sakit').length;
        const iCount = absensiList.filter(a=>a.status==='izin').length;
        const aCount = absensiList.filter(a=>a.status==='alfa').length;
        const jCount = absensiList.filter(a=>a.status==='jaga').length;
        if (chartPie) chartPie.destroy();
        chartPie = new Chart(document.getElementById('chartPie'), {
          type: 'doughnut',
          data: { labels: ['Sakit','Izin','Alfa','Jaga'], datasets: [{ data: [sCount,iCount,aCount,jCount], backgroundColor: ['#f59e0b','#3b82f6','#ef4444','#8b5cf6'] }] },
          options: { responsive: true, maintainAspectRatio: false }
        });

        // ═══ TOP JARANG HADIR (group by mahasiswa) ═══
        const mhsGroup = {};
        absensiList.filter(a => a.status && a.status !== 'hadir').forEach(a => {
          const key = a.mahasiswaId;
          if (!mhsGroup[key]) mhsGroup[key] = { sakit:0, izin:0, alfa:0, jaga:0, total:0, kelasId: a.kelasId, mkMap: {} };
          mhsGroup[key][a.status] = (mhsGroup[key][a.status]||0)+1;
          mhsGroup[key].total++;
          const mkId = a.mapelId || a.mkId;
          mhsGroup[key].mkMap[mkId] = (mhsGroup[key].mkMap[mkId]||0)+1;
        });

        const top10 = Object.entries(mhsGroup).sort((a,b) => b[1].total-a[1].total).slice(0,10);

        document.getElementById('topTidakHadir').innerHTML = top10.map(([id, d], i) => {
          const m = mhsMapGlobal[id] || {};
          const mkStr = Object.entries(d.mkMap).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([mkId,c])=> `${mkMapGlobal[mkId]?.nama||'MK'} ${c}x`).join(', ');
          const statusStr = [];
          if(d.sakit>0) statusStr.push(`🤒${d.sakit}`);
          if(d.izin>0) statusStr.push(`📝${d.izin}`);
          if(d.alfa>0) statusStr.push(`❌${d.alfa}`);
          if(d.jaga>0) statusStr.push(`🛡️${d.jaga}`);
          return `<div class="top-item">
            <div class="top-rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-rest'}">${i+1}</div>
            <div style="flex:1;"><strong>${m.nama||id}</strong><br><small>${m.kelasNama||'-'} · ${mkStr}</small></div>
            <div style="display:flex;gap:3px;flex-wrap:wrap;">${statusStr.map(s=>`<span class="badge badge-${s.includes('🤒')?'sakit':s.includes('📝')?'izin':s.includes('❌')?'alfa':'sakit'}">${s}</span>`).join('')}</div>
            <span class="badge badge-red">${d.total}x</span>
          </div>`;
        }).join('') || '<p style="text-align:center;">✅ Tidak ada mahasiswa tidak hadir</p>';

        // ═══ DAFTAR TIDAK HADIR PER TANGGAL (grup by mahasiswa + matkul) ═══
        const detailMap = {};
        absensiList.filter(a => a.status && a.status !== 'hadir').forEach(a => {
          const key = `${a.mahasiswaId}_${a.mapelId||a.mkId}`;
          if (!detailMap[key]) detailMap[key] = { mahasiswaId: a.mahasiswaId, mkId: a.mapelId||a.mkId, kelasId: a.kelasId, sakit:0, izin:0, alfa:0, jaga:0, total:0 };
          detailMap[key][a.status] = (detailMap[key][a.status]||0)+1;
          detailMap[key].total++;
        });

        globalTidakHadirList = Object.values(detailMap).sort((a,b) => b.total-a.total);

        document.getElementById('tidakHadirList').innerHTML = globalTidakHadirList.length === 0
          ? '<p style="text-align:center;">✅ Tidak ada mahasiswa tidak hadir dalam rentang tanggal ini</p>'
          : `<table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Matakuliah</th><th>Sakit</th><th>Izin</th><th>Alfa</th><th>Jaga</th><th>Total</th></tr></thead><tbody>
          ${globalTidakHadirList.map((d,i) => {
            const m = mhsMapGlobal[d.mahasiswaId] || {};
            const mk = mkMapGlobal[d.mkId] || {};
            return `<tr>
              <td>${i+1}</td><td style="text-align:left;"><strong>${m.nama||'-'}</strong></td><td>${m.kelasNama||'-'}</td><td>${mk.nama||'-'}</td>
              <td>${d.sakit||0}</td><td>${d.izin||0}</td><td>${d.alfa||0}</td><td>${d.jaga||0}</td>
              <td><strong>${d.total}</strong></td>
            </tr>`;
          }).join('')}</tbody></table>`;

      } catch(e) { console.error(e); }
    }

    // ═══ SHARE WA ═══
    window.shareWA = function() {
      const { totalAbsensi, totalMhs, persenHadir, mhsTidakHadirCount, start, end } = currentStats;
      
      let text = `📊 *REKAP ABSENSI*\n📅 ${start} s/d ${end}\n━━━━━━━━━━━━━━━━\n`;
      text += `📋 Total Absensi: *${totalAbsensi}*\n`;
      text += `👨‍🎓 Mahasiswa: *${totalMhs}*\n`;
      text += `✅ Kehadiran: *${persenHadir}%*\n`;
      text += `👤 Mhs Tidak Hadir: *${mhsTidakHadirCount} orang*\n\n`;

      if (globalTidakHadirList.length > 0) {
        text += `📋 *DAFTAR TIDAK HADIR:*\n`;
        globalTidakHadirList.forEach((d, i) => {
          const m = mhsMapGlobal[d.mahasiswaId] || {};
          const mk = mkMapGlobal[d.mkId] || {};
          const statusStr = [];
          if(d.sakit>0) statusStr.push(`Sakit:${d.sakit}`);
          if(d.izin>0) statusStr.push(`Izin:${d.izin}`);
          if(d.alfa>0) statusStr.push(`Alfa:${d.alfa}`);
          if(d.jaga>0) statusStr.push(`Jaga:${d.jaga}`);
          
          text += `${i+1}. *${m.nama||'-'}* - ${m.kelasNama||'-'}\n`;
          text += `   📚 ${mk.nama||'-'}\n`;
          text += `   ${statusStr.join(' | ')}\n`;
        });
      } else {
        text += `✅ Semua mahasiswa hadir!\n`;
      }

      text += `\n━━━━━━━━━━━━━━━━\n© IPIM Maghfirah`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    };

    window.exportExcel = function() {
      const data = globalTidakHadirList.map(d => {
        const m = mhsMapGlobal[d.mahasiswaId] || {};
        const mk = mkMapGlobal[d.mkId] || {};
        return {
          Nama: m.nama||'-', Kelas: m.kelasNama||'-', MK: mk.nama||'-',
          Sakit: d.sakit||0, Izin: d.izin||0, Alfa: d.alfa||0, Jaga: d.jaga||0, Total: d.total
        };
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Tidak Hadir');
      XLSX.writeFile(wb, 'rekap-tidak-hadir.xlsx');
    };

    window.logout = function() { if (confirm('Keluar?')) { auth.signOut().then(() => { localStorage.removeItem('user'); window.location.href = '../../index.html'; }); } };
    loadFilters();
    loadAll();
  </script>
</body>
