<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Program Bahasa • Operator Bahasa IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004d40; --primary-dark: #00332b; --primary-light: #00695c;
      --accent: #d4a843; --accent-dark: #b8860b; --accent-light: #fdf6e3;
      --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b; --gray-600: #475569;
      --gray-700: #334155; --gray-800: #1e293b; --red: #ef4444; --red-light: #fef2f2;
      --green-success: #10b981; --green-light: #ecfdf5; --blue: #3b82f6; --blue-light: #eff6ff;
      --orange: #f97316; --orange-light: #fff7ed; --purple: #7c3aed; --purple-light: #ede9fe;
      --bg-primary: #f0f4f0;
      --surface-glass: rgba(255, 255, 255, 0.6);
      --surface-glass-strong: rgba(255, 255, 255, 0.85);
      --border-glass: rgba(0, 77, 64, 0.08);
      --text-primary: var(--gray-800);
      --text-secondary: var(--gray-600);
      --text-muted: var(--gray-400);
      --sidebar-bg: rgba(255, 255, 255, 0.7);
      --nav-hover: rgba(0, 77, 64, 0.06);
      --nav-active: rgba(212, 168, 67, 0.15);
      --table-header-bg: rgba(248, 250, 252, 0.8);
      --table-row-hover: rgba(0, 77, 64, 0.02);
      --input-bg: rgba(255, 255, 255, 0.9);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 40px rgba(0,0,0,0.12);
      --shadow-inset: inset 2px 2px 5px rgba(0,0,0,0.04), inset -2px -2px 5px rgba(255,255,255,0.8);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-xl: 24px; --radius-2xl: 28px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-primary: #0a1628;
      --surface-glass: rgba(19, 32, 51, 0.6);
      --surface-glass-strong: rgba(19, 32, 51, 0.85);
      --border-glass: rgba(255,255,255,0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --sidebar-bg: rgba(10, 22, 40, 0.75);
      --nav-hover: rgba(212,168,67,0.08);
      --nav-active: rgba(212,168,67,0.18);
      --table-header-bg: rgba(19, 32, 51, 0.6);
      --table-row-hover: rgba(212,168,67,0.04);
      --input-bg: rgba(19, 32, 51, 0.8);
      --gray-50: #1e293b; --gray-100: #334155;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
      --shadow-xl: 0 20px 40px rgba(0,0,0,0.6);
      --shadow-inset: inset 2px 2px 5px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.02);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    .main-content {
      flex: 1;
      padding: 28px 32px;
      min-height: 100vh;
    }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 14px;
    }
    .page-title h1 {
      font-size: clamp(20px, 4vw, 26px); font-weight: 800;
      color: var(--text-primary); letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 3px; font-weight: 500; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 40px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: var(--transition); white-space: nowrap;
      background: var(--surface-glass-strong); backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-md); color: var(--text-primary);
    }
    .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .btn:active { box-shadow: var(--shadow-inset); transform: scale(0.97); }
    .btn-success { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; }
    .btn-warning { background: linear-gradient(135deg, var(--orange), #ea580c); color: white; border: none; }
    .btn-danger { background: linear-gradient(135deg, var(--red), #dc2626); color: white; border: none; }
    .btn-outline { background: var(--surface-glass); }
    .btn-sm { padding: 7px 14px; font-size: 12px; }

    .card {
      background: var(--surface-glass); backdrop-filter: blur(28px) saturate(180%);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-glass); margin-bottom: 20px; overflow: hidden;
    }
    .card-header {
      padding: 18px 24px; border-bottom: 1px solid var(--border-glass);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px; background: var(--surface-glass-strong);
    }
    .card-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 20px 24px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--gray-100); border-radius: 40px; padding: 4px; }
    .tab {
      flex: 1; padding: 10px 16px; text-align: center; border-radius: 40px;
      cursor: pointer; font-size: 12px; font-weight: 600; transition: var(--transition);
      border: none; background: transparent; font-family: inherit;
      color: var(--text-secondary);
    }
    .tab.active { background: var(--surface-glass-strong); color: var(--primary); box-shadow: var(--shadow-md); }

    /* DAY TABS */
    .day-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .day-tab {
      padding: 8px 12px; border-radius: 40px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--border-glass);
      background: var(--surface-glass); color: var(--text-secondary);
      transition: var(--transition); text-align: center; min-width: 65px;
    }
    .day-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .day-tab:hover:not(.active) { background: rgba(0,77,64,0.08); }
    .day-tab .day-name { display: block; font-size: 10px; opacity: 0.8; }
    .day-tab .day-date { display: block; font-size: 13px; font-weight: 700; }

    /* ADD FORM */
    .add-form {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: end;
      margin-bottom: 16px; padding: 16px;
      background: var(--surface-glass); border-radius: var(--radius-lg);
      border: 1px dashed var(--border-glass);
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .form-group input, .form-group select {
      padding: 10px 14px; border: 1.5px solid var(--border-glass);
      border-radius: 40px; font-size: 13px; font-family: inherit;
      background: var(--input-bg); color: var(--text-primary); outline: none;
      transition: var(--transition);
    }

    /* PROGRAM LIST */
    .program-list { display: flex; flex-direction: column; gap: 8px; }
    .program-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--surface-glass);
      border-radius: var(--radius-md); border: 1px solid var(--border-glass);
      transition: var(--transition);
    }
    .program-item.berjalan { border-left: 4px solid var(--green-success); }
    .program-item.belum-dicek { border-left: 4px solid var(--orange); }
    .program-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .program-check input[type="checkbox"] { display: none; }
    .check-box {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--border-glass); display: flex;
      align-items: center; justify-content: center; transition: var(--transition);
      font-size: 14px; flex-shrink: 0; background: var(--input-bg);
    }
    .program-check input:checked + .check-box {
      background: var(--green-success); border-color: var(--green-success); color: white;
    }
    .program-info { flex: 1; min-width: 0; }
    .program-nama { font-weight: 600; font-size: 13px; }
    .program-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .program-meta { font-size: 10px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
    .program-actions { display: flex; gap: 4px; }

    .alert { padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; margin-bottom: 16px; display: none; }
    .alert-success { background: var(--green-light); color: #1b5e20; }
    .alert-error { background: var(--red-light); color: #b71c1c; }

    @media (max-width: 768px) {
      .main-content { padding: 16px 14px; }
      .topbar { margin-top: 50px; flex-direction: column; gap: 10px; }
      .add-form { flex-direction: column; }
      .day-tabs { justify-content: center; }
    }
    @media (max-width: 480px) {
      .page-title h1 { font-size: 18px; }
      .btn { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>
<body data-page="program-bahasa">

  <!-- Sidebar Container -->
  <div id="sidebarContainer"></div>

  <!-- Burger & Theme Toggle -->
  <button class="burger-btn" id="burgerToggle"><svg><use href="#icon-burger"/></svg></button>
  <button class="theme-toggle" id="themeToggle"><svg id="themeIcon"><use href="#icon-moon"/></svg></button>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="topbar">
      <div class="page-title">
        <h1>📋 Program Bahasa</h1>
        <p>Monitoring program harian, bulanan & semesteran</p>
      </div>
      <button class="btn btn-outline" onclick="logout()">
        <svg><use href="#icon-logout"/></svg> Keluar
      </button>
    </div>

    <div id="alertSuccess" class="alert alert-success"></div>
    <div id="alertError" class="alert alert-error"></div>

    <!-- TABS KATEGORI -->
    <div class="tabs" id="categoryTabs">
      <button class="tab active" onclick="switchTab('harian')">☀️ Harian</button>
      <button class="tab" onclick="switchTab('bulanan')">📅 Bulanan</button>
      <button class="tab" onclick="switchTab('semesteran')">🎯 Semesteran</button>
    </div>

    <!-- DAY TABS (HARIAN) -->
    <div class="day-tabs" id="dayTabs"></div>

    <!-- ADD FORM -->
    <div class="add-form">
      <div class="form-group" style="flex:2;min-width:200px;">
        <label>Nama Program</label>
        <input type="text" id="programNama" placeholder="Contoh: Muhadatsah Pagi">
      </div>
      <div class="form-group" style="min-width:120px;">
        <label>Kategori</label>
        <select id="programKategori">
          <option value="harian">Harian</option>
          <option value="bulanan">Bulanan</option>
          <option value="semesteran">Semesteran</option>
        </select>
      </div>
      <div class="form-group" style="flex:2;min-width:150px;">
        <label>Deskripsi</label>
        <input type="text" id="programDesc" placeholder="Detail singkat...">
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button class="btn btn-success" onclick="tambahProgram()">
          <svg><use href="#icon-plus"/></svg> Tambah
        </button>
      </div>
    </div>

    <!-- PROGRAM LIST -->
    <div class="card">
      <div class="card-header">
        <h3>📋 <span id="listTitle">Program Harian</span></h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-success btn-sm" onclick="simpanChecklist()">
            <svg><use href="#icon-save"/></svg> Simpan Checklist
          </button>
          <button class="btn btn-warning btn-sm" onclick="exportExcel()">
            <svg><use href="#icon-export"/></svg> Export Excel
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="program-list" id="programList">
          <p style="text-align:center;color:var(--text-muted);padding:20px;">Memuat data...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/sidebar-bahasa.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script>
    (function() {
    'use strict';

    let currentTab = 'harian';
    let currentDayIndex = new Date().getDay();
    let allPrograms = [];
    let checklist = {};

    const DAY_NAMES = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const DAY_SHORT = ['Ahd', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    function showAlert(type, msg) {
      const el = document.getElementById(type === 'success' ? 'alertSuccess' : 'alertError');
      if (el) { el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 4000); }
    }

    function getDateForDay(dayIndex) {
      const now = new Date();
      const diff = dayIndex - now.getDay();
      const target = new Date(now);
      target.setDate(now.getDate() + diff);
      return target.toISOString().split('T')[0];
    }

    function getChecklistDate() {
      if (currentTab === 'harian') return getDateForDay(currentDayIndex);
      if (currentTab === 'bulanan') return new Date().toISOString().slice(0, 7);
      const now = new Date();
      return `${now.getFullYear()}-${now.getMonth() + 1 <= 6 ? '1' : '2'}`;
    }

    function renderDayTabs() {
      const dayTabs = document.getElementById('dayTabs');
      if (currentTab !== 'harian') {
        dayTabs.style.display = 'none';
        return;
      }
      dayTabs.style.display = 'flex';
      dayTabs.innerHTML = DAY_NAMES.map((name, i) => {
        const date = getDateForDay(i);
        const dateNum = new Date(date).getDate();
        const isActive = i === currentDayIndex;
        return `<div class="day-tab${isActive ? ' active' : ''}" onclick="pilihHari(${i})">
          <span class="day-name">${DAY_SHORT[i]}</span>
          <span class="day-date">${dateNum}</span>
        </div>`;
      }).join('');
    }

    window.pilihHari = function(dayIndex) {
      currentDayIndex = dayIndex;
      renderDayTabs();
      loadChecklist();
    };

    async function loadPrograms() {
      try {
        const snap = await db.collection('programBahasa').get();
        allPrograms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await loadChecklist();
      } catch(e) {
        programList.innerHTML = '<p style="text-align:center;color:var(--red);">Gagal memuat data</p>';
      }
    }

    async function loadChecklist() {
      const tanggal = getChecklistDate();
      try {
        const snap = await db.collection('programBahasaChecklist').where('tanggal', '==', tanggal).get();
        checklist = {};
        snap.forEach(d => {
          const data = d.data();
          checklist[data.programId] = { id: d.id, checked: data.checked };
        });
        renderPrograms();
      } catch(e) {}
    }

    function renderPrograms() {
      const filtered = allPrograms.filter(p => p.kategori === currentTab);
      document.getElementById('listTitle').textContent =
        currentTab === 'harian' ? 'Program Harian' : currentTab === 'bulanan' ? 'Program Bulanan' : 'Program Semesteran';

      const container = document.getElementById('programList');
      if (!filtered.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">Belum ada program</p>';
        return;
      }

      container.innerHTML = filtered.map(p => {
        const isChecked = checklist[p.id]?.checked || false;
        return `<div class="program-item ${isChecked ? 'berjalan' : 'belum-dicek'}" id="prog-${p.id}">
          <label class="program-check" onclick="toggleCheck('${p.id}')">
            <input type="checkbox" id="chk-${p.id}" ${isChecked ? 'checked' : ''}>
            <span class="check-box">${isChecked ? '✓' : ''}</span>
          </label>
          <div class="program-info">
            <div class="program-nama">${p.nama}</div>
            ${p.deskripsi ? `<div class="program-desc">${p.deskripsi}</div>` : ''}
            <div class="program-meta"><span>📂 ${p.kategori}</span></div>
          </div>
          <div class="program-actions">
            <button class="btn btn-outline btn-sm" onclick="editProgram('${p.id}')">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="hapusProgram('${p.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('');
    }

    window.toggleCheck = function(programId) {
      const chk = document.getElementById('chk-' + programId);
      chk.checked = !chk.checked;
      checklist[programId] = { id: checklist[programId]?.id, checked: chk.checked };
      const div = document.getElementById('prog-' + programId);
      const box = div.querySelector('.check-box');
      if (chk.checked) {
        div.className = 'program-item berjalan';
        box.innerHTML = '✓';
      } else {
        div.className = 'program-item belum-dicek';
        box.innerHTML = '';
      }
    };

    window.simpanChecklist = async function() {
      const tanggal = getChecklistDate();
      const batch = db.batch();
      let count = 0;
      for (const p of allPrograms.filter(x => x.kategori === currentTab)) {
        const data = checklist[p.id];
        if (!data) continue;
        const doc = { programId: p.id, tanggal, checked: data.checked, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        if (data.id) batch.update(db.collection('programBahasaChecklist').doc(data.id), doc);
        else { doc.createdAt = firebase.firestore.FieldValue.serverTimestamp(); batch.set(db.collection('programBahasaChecklist').doc(), doc); }
        count++;
      }
      if (!count) return showAlert('error', 'Tidak ada perubahan!');
      await batch.commit();
      showAlert('success', count + ' checklist disimpan!');
      await loadChecklist();
    };

    window.tambahProgram = async function() {
      const nama = document.getElementById('programNama').value.trim();
      const kategori = document.getElementById('programKategori').value;
      const deskripsi = document.getElementById('programDesc').value.trim();
      if (!nama) return showAlert('error', 'Nama wajib!');
      await db.collection('programBahasa').add({ nama, kategori, deskripsi, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('programNama').value = '';
      document.getElementById('programDesc').value = '';
      showAlert('success', 'Program ditambahkan!');
      await loadPrograms();
    };

    window.hapusProgram = async function(id) {
      if (!confirm('Hapus program?')) return;
      await db.collection('programBahasa').doc(id).delete();
      showAlert('success', 'Dihapus!');
      await loadPrograms();
    };

    window.editProgram = async function(id) {
      const p = allPrograms.find(x => x.id === id);
      if (!p) return;
      const nama = prompt('Nama:', p.nama);
      if (!nama) return;
      const desc = prompt('Deskripsi:', p.deskripsi || '');
      await db.collection('programBahasa').doc(id).update({ nama, deskripsi: desc });
      showAlert('success', 'Diupdate!');
      await loadPrograms();
    };

    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('#categoryTabs .tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'harian') currentDayIndex = new Date().getDay();
      renderDayTabs();
      loadChecklist();
    };

    window.exportExcel = function() {
      const tanggal = getChecklistDate();
      const data = allPrograms.map(p => ({
        Kategori: p.kategori, Nama: p.nama, Deskripsi: p.deskripsi || '',
        Status: checklist[p.id]?.checked ? '✅' : '❌', Tanggal: tanggal
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Program');
      XLSX.writeFile(wb, 'program-bahasa.xlsx');
      showAlert('success', 'Diexport!');
    };

    window.logout = function() {
      if (confirm('Keluar?')) {
        try { auth.signOut(); } catch(e) {}
        localStorage.removeItem('user');
        window.location.href = '../../index.html';
      }
    };

    renderDayTabs();
    loadPrograms();
    })();
  </script>
</body>
</html>
