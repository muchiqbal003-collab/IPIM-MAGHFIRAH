<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Rekap Pelanggaran • Operator Bahasa IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004d40; --primary-light: #00695c; --accent: #d4a843; --accent-light: #fdf6e3;
      --bg-primary: #f0f4f0; --surface-glass: rgba(255,255,255,0.6); --surface-glass-strong: rgba(255,255,255,0.85);
      --border-glass: rgba(0,77,64,0.08); --text-primary: #1e293b; --text-secondary: #475569; --text-muted: #94a3b8;
      --sidebar-bg: rgba(255,255,255,0.7); --nav-hover: rgba(0,77,64,0.06); --nav-active: rgba(212,168,67,0.15);
      --red: #ef4444; --red-light: #fef2f2; --green-light: #ecfdf5; --blue: #3b82f6; --blue-light: #eff6ff;
      --orange: #f97316; --orange-light: #fff7ed;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1); --shadow-xl: 0 20px 40px rgba(0,0,0,0.12);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-xl: 24px;
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --bg-primary: #0a1628; --surface-glass: rgba(19,32,51,0.6); --surface-glass-strong: rgba(19,32,51,0.85);
      --border-glass: rgba(255,255,255,0.08); --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #64748b;
      --sidebar-bg: rgba(10,22,40,0.75); --nav-hover: rgba(212,168,67,0.08); --nav-active: rgba(212,168,67,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; min-height: 100vh; }

    .main-content { flex: 1; padding: 24px 28px; min-height: 100vh; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-title h1 { font-size: clamp(20px, 4vw, 24px); font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .page-title p { font-size: 12px; color: var(--text-secondary); }

    .btn { padding: 9px 16px; border: none; border-radius: 40px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); background: var(--surface-glass-strong); border: 1px solid var(--border-glass); box-shadow: var(--shadow-sm); color: var(--text-primary); }
    .btn:hover { box-shadow: var(--shadow-md); }
    .btn-sm { padding: 6px 12px; font-size: 11px; }

    .card { background: var(--surface-glass); backdrop-filter: blur(24px); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); border: 1px solid var(--border-glass); margin-bottom: 16px; overflow: hidden; }
    .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: var(--surface-glass-strong); }
    .card-header h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .card-body { padding: 16px 20px; overflow-x: auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--surface-glass); border-radius: var(--radius-lg); padding: 14px; border: 1px solid var(--border-glass); text-align: center; }
    .stat-value { font-size: 22px; font-weight: 800; }
    .stat-label { font-size: 10px; color: var(--text-muted); }

    .filter-tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--gray-100, #f1f5f9); border-radius: 40px; padding: 4px; }
    .filter-tab { flex: 1; padding: 8px 12px; border-radius: 40px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 600; border: none; background: transparent; font-family: inherit; color: var(--text-secondary); }
    .filter-tab.active { background: var(--surface-glass-strong); color: var(--primary); box-shadow: var(--shadow-sm); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
    thead th { background: rgba(248,250,252,0.8); padding: 10px; font-size: 9px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border-glass); text-align: left; }
    tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border-glass); }
    tbody tr:hover { background: rgba(0,77,64,0.02); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; }
    .badge-high { background: var(--red-light); color: #991b1b; }
    .badge-mid { background: var(--orange-light); color: #c2410c; }
    .badge-low { background: var(--green-light); color: #065f46; }

    /* GENDER COMPARISON */
    .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .gender-card { background: var(--surface-glass); border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border-glass); text-align: center; }
    .gender-card .g-icon { font-size: 30px; }
    .gender-card .g-total { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .gender-card .g-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .gender-card .g-pct { font-size: 14px; font-weight: 800; margin-top: 6px; }
    .gender-card .g-bar-wrap { width: 100%; height: 8px; background: var(--gray-100, #f1f5f9); border-radius: 10px; margin-top: 8px; overflow: hidden; }
    .gender-card .g-bar { height: 100%; border-radius: 10px; transition: width 0.6s ease; }

    /* WEEK COMPARISON */
    .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .week-card { background: var(--surface-glass); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-glass); text-align: center; }
    .week-card .w-label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .week-card .w-date { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .week-card .w-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 10px; }
    .week-card .w-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .week-card .w-pct { font-weight: 700; }

    @media (max-width: 768px) {
      .main-content { padding: 14px 12px; }
      .topbar { margin-top: 50px; flex-direction: column; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .gender-grid { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body data-page="rekap-bahasa">

  <div id="sidebarContainer"></div>
  <button class="burger-btn" id="burgerToggle"><svg><use href="#icon-burger"/></svg></button>
  <button class="theme-toggle" id="themeToggle"><svg id="themeIcon"><use href="#icon-moon"/></svg></button>

  <main class="main-content" id="mainContent">
    <div class="topbar">
      <div class="page-title"><h1>📋 Rekap Pelanggaran</h1><p>Persentase mahasiswa berbahasa Arab baik</p></div>
      <button class="btn" onclick="logout()">🚪 Keluar</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- GENDER COMPARISON (Persentase yang BAIK) -->
    <div class="card">
      <div class="card-header"><h3>👥 Persentase Berbahasa Arab Baik</h3></div>
      <div class="card-body">
        <div class="gender-grid" id="genderGrid"></div>
      </div>
    </div>

    <!-- WEEK COMPARISON -->
    <div class="card">
      <div class="card-header"><h3>📊 Perbandingan 4 Pekan Terakhir</h3></div>
      <div class="card-body" id="weekComparison"></div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div class="card-header">
        <h3>👥 Rekap per Mahasiswa</h3>
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" onclick="filterData('pekan')">1 Pekan</button>
          <button class="filter-tab" onclick="filterData('bulan')">1 Bulan</button>
          <button class="filter-tab" onclick="filterData('semester')">1 Semester</button>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive" id="tableContainer"></div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/sidebar-bahasa.js"></script>

  <script>
  (function(){
  'use strict';

  let allData = [], allMahasiswa = [], currentFilter = 'pekan';

  function getDateRange(f) {
    const now = new Date(), end = now.toISOString().split('T')[0];
    const start = new Date();
    if (f === 'pekan') start.setDate(now.getDate() - 7);
    else if (f === 'bulan') start.setDate(now.getDate() - 30);
    else start.setMonth(now.getMonth() - 6);
    return { start: start.toISOString().split('T')[0], end };
  }

  async function loadData() {
    try {
      const [laporSnap, mhsSnap] = await Promise.all([
        db.collection('laporBahasa').get(),
        db.collection('mahasiswa').get()
      ]);
      allData = laporSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      allMahasiswa = mhsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      updateStats();
      updateGenderComparison();
      updateWeekComparison();
      renderTable();
    } catch(e) {
      console.error('Gagal load:', e);
    }
  }

  function getFiltered() {
    const { start, end } = getDateRange(currentFilter);
    return allData.filter(d => d.tanggal >= start && d.tanggal <= end);
  }

  // Hitung persentase mahasiswa yang TIDAK melanggar (berbahasa Arab baik)
  function getPersentaseBaik(jk, data) {
    const totalJk = allMahasiswa.filter(m => m.jk === jk).length;
    if (totalJk === 0) return { total: 0, melanggar: 0, baik: 0, pct: 100 };
    
    const pelanggarIds = new Set(
      data.filter(d => {
        const m = allMahasiswa.find(x => x.id === d.mahasiswaId);
        return m?.jk === jk;
      }).map(d => d.mahasiswaId)
    );
    
    const melanggar = pelanggarIds.size;
    const baik = totalJk - melanggar;
    const pct = Math.round((baik / totalJk) * 100);
    
    return { total: totalJk, melanggar, baik, pct };
  }

  function updateStats() {
    const f = getFiltered();
    const totalMhs = allMahasiswa.length;
    const pelanggar = new Set(f.map(d => d.mahasiswaId || d.namaPelapor)).size;
    const baik = totalMhs - pelanggar;
    const pctBaik = totalMhs > 0 ? Math.round((baik / totalMhs) * 100) : 100;

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-value">${totalMhs}</div><div class="stat-label">Total Mahasiswa</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green-light);">${baik}</div><div class="stat-label">✅ Berbahasa Baik</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--red);">${pelanggar}</div><div class="stat-label">❌ Melanggar</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${pctBaik >= 80 ? 'var(--green-light)' : pctBaik >= 50 ? 'var(--orange)' : 'var(--red)'};">${pctBaik}%</div><div class="stat-label">% Berbahasa Baik</div></div>`;
  }

  // ========== GENDER COMPARISON (Persentase Baik) ==========
  function updateGenderComparison() {
    const f = getFiltered();
    const laki = getPersentaseBaik('L', f);
    const perempuan = getPersentaseBaik('P', f);

    const barL = laki.pct;
    const barP = perempuan.pct;

    document.getElementById('genderGrid').innerHTML = `
      <div class="gender-card" style="border-top: 4px solid #3b82f6;">
        <div class="g-icon">👨‍🎓</div>
        <div class="g-total" style="color:#3b82f6;">${laki.pct}%</div>
        <div class="g-label">Mahasiswa Putra</div>
        <div class="g-pct">${laki.baik}/${laki.total} berbahasa Arab baik</div>
        <div class="g-bar-wrap"><div class="g-bar" style="width:${barL}%;background:#3b82f6;"></div></div>
      </div>
      <div class="gender-card" style="border-top: 4px solid #ec4899;">
        <div class="g-icon">👩‍🎓</div>
        <div class="g-total" style="color:#ec4899;">${perempuan.pct}%</div>
        <div class="g-label">Mahasiswi Putri</div>
        <div class="g-pct">${perempuan.baik}/${perempuan.total} berbahasa Arab baik</div>
        <div class="g-bar-wrap"><div class="g-bar" style="width:${barP}%;background:#ec4899;"></div></div>
      </div>`;
  }

  // ========== WEEK COMPARISON (4 Pekan) ==========
  function updateWeekComparison() {
    const weeks = [];
    for (let i = 3; i >= 0; i--) {
      const end = new Date();
      end.setDate(end.getDate() - i * 7);
      const start = new Date(end);
      start.setDate(start.getDate() - 7);

      const docs = allData.filter(d =>
        d.tanggal >= start.toISOString().split('T')[0] &&
        d.tanggal <= end.toISOString().split('T')[0]
      );

      const laki = getPersentaseBaik('L', docs);
      const perempuan = getPersentaseBaik('P', docs);

      weeks.push({
        label: `Pekan ${4 - i}`,
        date: `${start.getDate()}/${start.getMonth() + 1} - ${end.getDate()}/${end.getMonth() + 1}`,
        laki: laki,
        perempuan: perempuan
      });
    }

    document.getElementById('weekComparison').innerHTML = `
      <div class="week-grid">
        ${weeks.map((w, i) => {
          const bgColor = i === 3 ? 'var(--accent-light)' : '';
          return `<div class="week-card" style="${bgColor ? 'background:' + bgColor + ';' : ''}">
            <div class="w-label">${w.label}</div>
            <div class="w-date">${w.date}</div>
            <div class="w-row">
              <span class="w-color" style="background:#3b82f6;"></span>
              <span>Putra:</span>
              <span class="w-pct" style="color:#3b82f6;">${w.laki.pct}%</span>
            </div>
            <div class="w-row">
              <span class="w-color" style="background:#ec4899;"></span>
              <span>Putri:</span>
              <span class="w-pct" style="color:#ec4899;">${w.perempuan.pct}%</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }

  // ========== TABLE ==========
  function renderTable() {
    const f = getFiltered();
    const grouped = {};
    f.forEach(d => {
      const key = d.mahasiswaId || d.namaPelapor || 'Unknown';
      if (!grouped[key]) {
        const m = allMahasiswa.find(x => x.id === d.mahasiswaId);
        grouped[key] = {
          nama: d.namaPelapor || m?.nama || 'Unknown',
          nim: d.nim || m?.nim || '-',
          jk: m?.jk || '-',
          count: 0
        };
      }
      grouped[key].count++;
    });

    const list = Object.values(grouped).sort((a, b) => b.count - a.count);
    const total = f.length || 1;

    document.getElementById('tableContainer').innerHTML = list.length ? `
      <table><thead><tr><th>No</th><th>Nama</th><th>NIM</th><th>JK</th><th>Jumlah Pelanggaran</th><th>Status</th></tr></thead><tbody>
      ${list.map((m, i) => {
        const pct = Math.round((m.count / total) * 100);
        const cls = pct >= 30 ? 'badge-high' : pct >= 15 ? 'badge-mid' : 'badge-low';
        const label = pct >= 30 ? 'Sering' : pct >= 15 ? 'Kadang' : 'Jarang';
        return `<tr><td>${i + 1}</td><td><strong>${m.nama}</strong></td><td>${m.nim}</td><td>${m.jk === 'L' ? 'Putra' : m.jk === 'P' ? 'Putri' : '-'}</td><td>${m.count}</td><td><span class="badge ${cls}">${label}</span></td></tr>`;
      }).join('')}</tbody></table>` : '<p style="text-align:center;color:var(--text-muted);">✅ Tidak ada pelanggaran</p>';
  }

  window.filterData = function(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    updateStats();
    updateGenderComparison();
    renderTable();
  };

  window.logout = function() {
    if (confirm('Keluar?')) {
      try { auth.signOut(); } catch(e) {}
      localStorage.removeItem('user');
      window.location.href = '../../index.html';
    }
  };

  loadData();
  })();
  </script>
</body>
</html>
