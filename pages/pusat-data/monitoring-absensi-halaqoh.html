<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Absensi Halaqoh - Pusat Data IPIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --green-dark: #004d40; --green: #00a859; --green-light: #e8f5e9; --gold: #d4a843; --white: #ffffff; --gray-50: #fafafa; --gray-100: #f5f5f5; --gray-200: #e0e0e0; --gray-400: #9e9e9e; --gray-600: #616161; --gray-800: #333333; --red: #e53935; --red-light: #fce4ec; --sidebar-width: 260px; --radius-sm: 8px; --radius: 12px; --transition: all 0.25s ease; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--gray-50); color: var(--gray-800); display: flex; min-height: 100vh; }

    .sidebar { width: var(--sidebar-width); background: var(--green-dark); color: white; height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
    .sidebar-logo { width: 40px; height: 40px; background: var(--gold); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--green-dark); font-size: 18px; flex-shrink: 0; }
    .sidebar-brand h2 { font-size: 16px; font-weight: 700; color: white; } .sidebar-brand span { font-size: 10px; color: rgba(255,255,255,0.6); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
    .nav-section { margin-bottom: 8px; } .nav-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); padding: 12px 12px 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition); margin-bottom: 2px; cursor: pointer; }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; } .nav-item.active { background: rgba(255,255,255,0.15); color: var(--gold); font-weight: 600; }
    .nav-item i { width: 20px; text-align: center; font-size: 14px; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green-dark); font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .user-info-sidebar .name { font-size: 13px; font-weight: 600; color: white; } .user-info-sidebar .role { font-size: 10px; color: rgba(255,255,255,0.5); }

    .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 24px 28px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-title h1 { font-size: 22px; font-weight: 700; color: var(--gray-800); } .page-title p { font-size: 13px; color: var(--gray-600); margin-top: 2px; }
    .btn { padding: 9px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; }
    .btn-outline { background: var(--white); border: 1.5px solid var(--gray-200); color: var(--gray-600); } .btn-sm { padding: 6px 12px; font-size: 11px; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: var(--white); border-radius: var(--radius); padding: 16px; border: 1px solid var(--gray-200); text-align: center; }
    .stat-card .val { font-size: 28px; font-weight: 700; }
    .stat-card .lbl { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

    .card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); margin-bottom: 20px; }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; }
    .card-body { padding: 16px; }

    .halaqoh-list { display: flex; flex-direction: column; gap: 8px; }
    .halaqoh-card { background: var(--gray-50); border-radius: var(--radius-sm); border: 1px solid var(--gray-200); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .halaqoh-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--red-light); display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 16px; flex-shrink: 0; }
    .halaqoh-card.sudah .halaqoh-icon { background: var(--green-light); color: var(--green-dark); }
    .halaqoh-info { flex: 1; }
    .halaqoh-nama { font-weight: 700; font-size: 13px; }
    .halaqoh-musyrif { font-size: 10px; color: var(--gray-600); }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; }
    .badge-belum { background: var(--red-light); color: #b71c1c; }
    .badge-sudah { background: var(--green-light); color: #1b5e20; }

    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 16px; } }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i></div><div class="sidebar-brand"><h2>IPIM Panel</h2><span>Pusat Data</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><div class="nav-section-title">Utama</div><a href="dashboard.html" class="nav-item"><i class="fa-solid fa-grid-2"></i> Dashboard</a></div>
      <div class="nav-section"><div class="nav-section-title">Monitoring</div>
        <a href="monitoring-absensi-kelas.html" class="nav-item"><i class="fa-solid fa-clipboard-check"></i> Absensi Kelas</a>
        <a href="monitoring-absensi-halaqoh.html" class="nav-item active"><i class="fa-solid fa-mosque"></i> Absensi Halaqoh</a>
        <a href="monitoring-login.html" class="nav-item"><i class="fa-solid fa-right-to-bracket"></i> Login User</a>
      </div>
    </nav>
    <div class="sidebar-footer"><div class="user-avatar" id="avatarLetter">A</div><div class="user-info-sidebar"><div class="name" id="sidebarName">Admin</div><div class="role">Pusat Data</div></div></div>
  </aside>

  <main class="main-content">
    <div class="topbar"><div class="page-title"><h1>🕌 Monitoring Absensi Halaqoh</h1><p>Pantau musyrif yang sudah/belum absen halaqoh hari ini</p></div><button class="btn btn-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button></div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="card">
      <div class="card-header"><span><i class="fa-solid fa-circle-xmark" style="color:var(--red);"></i> Halaqoh yang BELUM Absen</span><button class="btn btn-outline btn-sm" onclick="loadData()"><i class="fa-solid fa-sync"></i> Refresh</button></div>
      <div class="card-body"><div class="halaqoh-list" id="belumList"><p style="text-align:center;color:var(--gray-400);">Memuat...</p></div></div>
    </div>

    <div class="card">
      <div class="card-header"><span><i class="fa-solid fa-circle-check" style="color:var(--green);"></i> Halaqoh yang SUDAH Absen</span></div>
      <div class="card-body"><div class="halaqoh-list" id="sudahList"><p style="text-align:center;color:var(--gray-400);">Memuat...</p></div></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const user = checkRole(['pusat-data']);
    if (!user) window.location.href = '../../index.html';
    document.getElementById('sidebarName').textContent = user.nama || 'Admin';
    document.getElementById('avatarLetter').textContent = (user.nama || 'A').charAt(0).toUpperCase();

    async function loadData() {
      const todayStr = new Date().toISOString().split('T')[0];

      try {
        const [halaqohSnap, absensiSnap, usersSnap] = await Promise.all([
          db.collection('halaqoh').get(),
          db.collection('absensiHalaqoh').where('tanggal','==',todayStr).get(),
          db.collection('users').where('role', 'in', ['musyrif', 'dosen-musyrif']).get()
        ]);

        const allHalaqoh = halaqohSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const allAbsensi = absensiSnap.docs.map(d => d.data());
        const usersMap = {}; usersSnap.forEach(d => { usersMap[d.id] = d.data(); });

        const halaqohSudahAbsen = new Set(allAbsensi.map(a => a.halaqohId));
        
        const belumList = [], sudahList = [];

        allHalaqoh.forEach(h => {
          const musyrifId = h.musyrifId || h.userId;
          const musyrif = usersMap[musyrifId] || {};
          const sudah = halaqohSudahAbsen.has(h.id);

          const card = `<div class="halaqoh-card ${sudah ? 'sudah' : ''}">
            <div class="halaqoh-icon"><i class="fa-solid fa-mosque"></i></div>
            <div class="halaqoh-info">
              <div class="halaqoh-nama">${h.nama||'-'}</div>
              <div class="halaqoh-musyrif">👤 ${musyrif.nama||musyrifId||'Belum ada musyrif'}</div>
            </div>
            <span class="badge ${sudah ? 'badge-sudah' : 'badge-belum'}">${sudah ? '✅ Sudah' : '❌ Belum'}</span>
          </div>`;

          if (sudah) sudahList.push(card); else belumList.push(card);
        });

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="val">${allHalaqoh.length}</div><div class="lbl">Total Halaqoh</div></div>
          <div class="stat-card"><div class="val" style="color:#1b5e20;">${sudahList.length}</div><div class="lbl">✅ Sudah Absen</div></div>
          <div class="stat-card"><div class="val" style="color:#b71c1c;">${belumList.length}</div><div class="lbl">❌ Belum Absen</div></div>
        `;

        document.getElementById('belumList').innerHTML = belumList.join('') || '<p style="text-align:center;color:#1b5e20;">✅ Semua halaqoh sudah absen!</p>';
        document.getElementById('sudahList').innerHTML = sudahList.join('') || '<p style="text-align:center;color:var(--gray-400);">Belum ada yang absen</p>';

      } catch(e) { console.error(e); }
    }

    window.logout = function() { if (confirm('Keluar?')) { auth.signOut().then(() => { localStorage.removeItem('user'); window.location.href = '../../index.html'; }); } };
    loadData();
  </script>
</body>
</html>
